  blockers:
    - severity: info
      origin: validation
      code: preexisting-nonhermetic-paths-test
      evidence:
        - "test/unit/paths.test.ts『repoRoot: .git
          がどこにも見つからない場合は例外を投げる（AC-2）』が本実行環境で失敗（Missing expected exception）"
        - 同テストは本Issueの変更を適用しない pristine base コピーでも同一に失敗するため、ISSUE-356
          起因の回帰ではない（AC-6 の『成功し続ける』は非違反）
        - 原因は当該テストの前提『os.tmpdir() 配下は通常 git リポジトリの外側』が本環境で成立しないこと（/tmp/.git
          が存在）。テスト自体の hermetic 性の問題であり別Issueで扱うべき
    - severity: info
      origin: specification
      code: config-key-drift-not-fail-loud
      evidence:
        - codex.sh の起動コマンドは --strict-config を使わないため、将来 codex CLI が
          approval_policy キーを改名した場合、-c 指定は黙って無視され既定のエスカレーション方針へ劣化する（実機 codex
          debug prompt-input で、未知キー指定時は Escalation Requests 節が描画されることを確認）
        - SPEC『スコープ外』が『将来のcodex CLIバージョンで approval_policy
          設定キー自体が変更された場合の追従は別Issueで扱う』と明記しているため、本ゲートでは非ブロッキング
    - severity: warning
      origin: implementation
      code: weak-regression-guard-flag-form
      evidence:
        - "test/integration/gate-adapters.test.ts: assert.doesNotMatch(argv,
          /^--ask-for-approval$/m) は空白区切り形式のみを検出する"
        - 'test/integration/gate-adapters.test.ts createCodexStub: [[ "$arg" !=
          "--ask-for-approval" ]] || exit 64 も同様に完全一致のみ'
        - clap は --ask-for-approval=never という単一 argv トークン形式も受理するため、この形で再導入された場合
          AC-1/AC-2 の回帰をどちらの検査もすり抜ける
    - severity: info
      origin: implementation
      code: stub-rejection-branches-unexercised
      evidence:
        - test/integration/gate-adapters.test.ts createCodexStub の exit
          64（--ask-for-approval 検出）・exit 65（approval_policy 欠落）分岐は、どのテストからも発火しない
        - 回帰時に stub 側で落ちることを示す negative test が無く、実質の検証力は argv ログに対する 2 つの assert
          に限られる
        - 同分岐は stdin を drain せず終了するため、発火時は呼出側が EPIPE/SIGPIPE
          を受ける経路になり、意図した失敗メッセージが観測されない可能性がある
    - severity: info
      origin: implementation
      code: real-cli-verification-performed-by-reviewer
      evidence:
        - design.yaml の info blocker
          fake-stub-circular-verification（AC-1/AC-2/AC-3 の automated 検証が fake
          stub 経由である旨）を、レビュア側で実機 codex-cli 0.146.0 に対し read-only で解消確認した
        - "AC-1: codex exec --help（0.146.0）は
          -c/--sandbox/-m/-C/--color/--skip-git-repo-check/--ephemeral/--ignore\
          -user-config/--ignore-rules と PROMPT
          位置引数（-）を列挙し、組み立て後コマンドラインの全オプションが実在する。--ask-for-approval は exec
          には存在せず、変更後は不使用"
        - 'AC-2/AC-3: 変更後コマンドラインの -c 上書き一式（model_reasoning_effort /
          approval_policy="never" / shell_environment_policy.* /
          default_permissions / permissions.review.filesystem）を実機へ与えて
          rc=0。approval_policy に不正値を与えると `unknown variant ... expected one of
          untrusted, on-failure, on-request, granular, never in approval_policy`
          となり、型付き実在キーであることと never が有効値であることを確認'
        - "AC-6 補足: base 側で --ask-for-approval を参照する既存テストは存在せず（grep は codex.sh
          の当該行のみ）、test/unit/gate-credentialless-ci.test.ts の
          assert（shell_environment_policy.inherit /
          permissions.review.filesystem）は変更後も成立する"
