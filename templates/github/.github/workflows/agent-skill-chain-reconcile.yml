# 正本: AGENTS.md §ゲートの継承・無効化
#
# pushごとに、承認済み成果物digestを対象commit SHAへ照合する。変化なしなら最新SHAへ
# 成功を再発行し、変化ありなら当該ゲートと全下流ゲートを無効化する（scripts/gate-reconcile.sh、
# 判定ルールはschemas/gate-report.schema.yaml末尾を参照）。インターフェーススタブであり、
# CLI実装（src/agents-md.ts）が完了するまでこのワークフローは失敗し続ける（意図的な挙動）。
name: agent-skill-chain / reconcile

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  checks: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive issue_id
        id: ctx
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          ISSUE_ID="ISSUE-$(echo "$BRANCH" | sed -E 's#^[^/]+/([0-9]+)-.*#\1#')"
          if ! [[ "$ISSUE_ID" =~ ^ISSUE-[0-9]+$ ]]; then
            echo "ブランチ名 '$BRANCH' から issue_id を抽出できません（config/agent-skill-chain.yaml branch.pattern に非適合）" >&2
            exit 1
          fi
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"

      - name: Reconcile gates against pushed SHA
        run: ./scripts/gate-reconcile.sh "${{ steps.ctx.outputs.issue_id }}" "${{ github.sha }}"
