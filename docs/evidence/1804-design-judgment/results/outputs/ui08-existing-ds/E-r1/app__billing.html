<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>請求先の編集 | 管理画面</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="billing.css">
</head>
<body>
<header class="app-header">
  <p class="app-header__title">会員管理</p>
  <nav class="app-nav" aria-label="主要">
    <a href="members.html">会員一覧</a>
    <a href="billing.html" aria-current="page">請求先</a>
  </nav>
</header>
<main class="page">
  <h1 class="page__title">請求先の編集</h1>

  <div id="viewer-notice" class="alert alert--neutral" hidden>
    閲覧権限のため、請求先は編集できません。変更が必要な場合は、編集権限のある契約者または管理者に依頼してください。
  </div>
  <div id="result" role="status" aria-live="polite"></div>

  <div class="card billing-form">
    <form id="form" novalidate>
      <p class="billing-form__note"><span class="billing-form__req">必須</span> の項目は必ず入力してください。</p>
      <fieldset id="fields">
        <legend class="visually-hidden">請求先情報</legend>

        <div class="field">
          <label class="field__label" for="name">請求先の名称<span class="billing-form__req">必須</span></label>
          <span class="field__hint" id="name-hint">50文字以内</span>
          <input class="field__input" id="name" name="name" type="text" autocomplete="organization" aria-describedby="name-hint name-error">
          <span class="field__error" id="name-error" hidden></span>
        </div>

        <div class="field">
          <label class="field__label" for="dept">部署名<span class="billing-form__opt">任意</span></label>
          <input class="field__input" id="dept" name="dept" type="text" autocomplete="organization-title" aria-describedby="dept-error">
          <span class="field__error" id="dept-error" hidden></span>
        </div>

        <div class="field">
          <label class="field__label" for="contact">担当者名<span class="billing-form__req">必須</span></label>
          <input class="field__input" id="contact" name="contact" type="text" autocomplete="name" aria-describedby="contact-error">
          <span class="field__error" id="contact-error" hidden></span>
        </div>

        <div class="field">
          <label class="field__label" for="email">メールアドレス<span class="billing-form__req">必須</span></label>
          <span class="field__hint" id="email-hint">例：billing@example.com</span>
          <input class="field__input" id="email" name="email" type="email" autocomplete="email" aria-describedby="email-hint email-error">
          <span class="field__error" id="email-error" hidden></span>
        </div>

        <div class="field">
          <label class="field__label" for="zip">郵便番号<span class="billing-form__req">必須</span></label>
          <span class="field__hint" id="zip-hint">7桁の数字。ハイフンはあってもなくても構いません（例：1500002）</span>
          <input class="field__input field__input--short" id="zip" name="zip" type="text" inputmode="numeric" autocomplete="postal-code" aria-describedby="zip-hint zip-error">
          <span class="field__error" id="zip-error" hidden></span>
        </div>

        <div class="field">
          <label class="field__label" for="address">住所<span class="billing-form__req">必須</span></label>
          <input class="field__input" id="address" name="address" type="text" autocomplete="street-address" aria-describedby="address-error">
          <span class="field__error" id="address-error" hidden></span>
        </div>

        <div class="field">
          <label class="field__label" for="tel">電話番号<span class="billing-form__opt">任意</span></label>
          <input class="field__input field__input--short" id="tel" name="tel" type="tel" inputmode="tel" autocomplete="tel" aria-describedby="tel-error">
          <span class="field__error" id="tel-error" hidden></span>
        </div>
      </fieldset>

      <div class="billing-form__actions">
        <button class="btn btn--primary" id="save" type="submit">保存</button>
      </div>
    </form>
  </div>
</main>

<script>
(function () {
  var form = document.getElementById('form');
  var save = document.getElementById('save');
  var result = document.getElementById('result');
  var isViewer = new URLSearchParams(location.search).get('role') === 'viewer';
  var saving = false;

  // 閲覧権限：入力欄と保存を無効化し、理由を表示する
  if (isViewer) {
    document.getElementById('viewer-notice').hidden = false;
    document.getElementById('fields').disabled = true;
    save.disabled = true;
    save.setAttribute('aria-describedby', 'viewer-notice');
  }

  function val(id) { return document.getElementById(id).value.trim(); }

  function validate() {
    var errors = [];
    var name = val('name'), contact = val('contact'), email = val('email'),
        zip = val('zip').normalize('NFKC').replace(/[-‐ー−\s]/g, ''), address = val('address');
    if (!name) errors.push(['name', '請求先の名称を入力してください。']);
    else if (name.length > 50) errors.push(['name', '請求先の名称は50文字以内で入力してください（現在' + name.length + '文字）。']);
    if (!contact) errors.push(['contact', '担当者名を入力してください。']);
    if (!email) errors.push(['email', 'メールアドレスを入力してください。']);
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.push(['email', 'メールアドレスの形式が正しくありません。「name@example.com」のように入力してください。']);
    if (!zip) errors.push(['zip', '郵便番号を入力してください。']);
    else if (!/^\d{7}$/.test(zip)) errors.push(['zip', '郵便番号は7桁の数字で入力してください（ハイフンは省略できます）。']);
    if (!address) errors.push(['address', '住所を入力してください。']);
    return errors;
  }

  function showErrors(errors) {
    ['name', 'dept', 'contact', 'email', 'zip', 'address', 'tel'].forEach(function (id) {
      var input = document.getElementById(id), el = document.getElementById(id + '-error');
      var hit = errors.filter(function (e) { return e[0] === id; })[0];
      el.hidden = !hit;
      el.textContent = hit ? hit[1] : '';
      if (hit) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
    });
  }

  function notify(kind, text, errors) {
    result.innerHTML = '';
    if (!text) return;
    var box = document.createElement('div');
    box.className = 'alert alert--' + kind;
    box.setAttribute('role', kind === 'danger' ? 'alert' : 'status');
    box.tabIndex = -1;
    var p = document.createElement('span');
    p.textContent = text;
    box.appendChild(p);
    if (errors) {
      var ul = document.createElement('ul');
      ul.className = 'alert__list';
      errors.forEach(function (e) {
        var li = document.createElement('li'), a = document.createElement('a');
        a.href = '#' + e[0];
        a.textContent = e[1];
        a.addEventListener('click', function (ev) { ev.preventDefault(); document.getElementById(e[0]).focus(); });
        li.appendChild(a);
        ul.appendChild(li);
      });
      box.appendChild(ul);
    }
    result.appendChild(box);
    return box;
  }

  // 模擬の保存処理：1秒後に成功。fail@example.com は失敗
  function mockSave(data) {
    return new Promise(function (resolve, reject) {
      setTimeout(function () {
        if (data.email.toLowerCase() === 'fail@example.com') reject(new Error('mock failure'));
        else resolve();
      }, 1000);
    });
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (isViewer || saving) return;
    var errors = validate();
    showErrors(errors);
    if (errors.length) {
      notify('danger', '入力内容に誤りがあります（' + errors.length + '件）。直してからもう一度「保存」を押してください。', errors);
      document.getElementById(errors[0][0]).focus();
      return;
    }
    saving = true;
    save.disabled = true;
    save.textContent = '保存中…';
    form.setAttribute('aria-busy', 'true');
    notify('neutral', '保存しています…');
    mockSave({ email: val('email') }).then(function () {
      notify('success', '保存しました。請求先の変更を反映しました。');
    }, function () {
      var box = notify('danger', '保存に失敗しました。入力内容はそのまま残しています。時間をおいて、もう一度「保存」を押してください。');
      if (box) box.focus();
    }).then(function () {
      saving = false;
      save.disabled = false;
      save.textContent = '保存';
      form.removeAttribute('aria-busy');
    });
  });
})();
</script>
</body>
</html>
