<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出荷オペレーション監視</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#1b2430; --sub:#58626f; --line:#d5d9df;
  --alert:#b3261e; --alert-bg:#fdecea; --warn:#8a5a00; --warn-bg:#fff4d6;
  --ok:#1d6b3a; --bar:#3a5f8f; --bar-bg:#e3e7ed;
  --sans:"Noto Sans CJK JP","Liberation Sans","DejaVu Sans",sans-serif;
  --mono:"DejaVu Sans Mono","Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding:16px 24px 32px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:700}
header .meta{color:var(--sub);font-size:14px}
header .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
h2{font-size:15px;margin:0 0 8px;font-weight:700}
.summary{margin:12px 0;padding:12px 16px;border-radius:6px;border:2px solid var(--alert);background:var(--alert-bg);color:var(--alert);font-weight:700;font-size:17px}
.summary.clear{border-color:var(--ok);background:#e6f4ea;color:var(--ok)}
.summary small{display:block;font-weight:400;color:var(--ink);font-size:14px}
.source-err{margin:12px 0;padding:10px 16px;border:2px solid var(--warn);background:var(--warn-bg);border-radius:6px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.source-err .txt{flex:1 1 360px;min-width:0}
.source-err b{color:var(--warn)}
button{font:inherit;min-height:44px;padding:0 18px;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:6px;cursor:pointer;font-weight:700}
button:focus-visible,summary:focus-visible{outline:3px solid #1a5fd0;outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:12px 0 20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.kpi.bad{border:2px solid var(--alert);background:var(--alert-bg)}
.kpi .label{font-size:13px;color:var(--sub)}
.kpi .val{font-size:34px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .val span{font-size:14px;font-weight:400;color:var(--sub);margin-left:3px}
.kpi .tgt{font-size:12px;color:var(--sub)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:3px;border:1.5px solid currentColor;white-space:nowrap}
.badge.bad{color:var(--alert);background:#fff}
.badge.ok{color:var(--ok)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.lane{border-top:1px solid var(--line)}
.lane:first-of-type{border-top:0}
.lane summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:96px minmax(0,2.2fr) 70px minmax(120px,2fr) 90px 24px;gap:12px;align-items:center;padding:10px 4px;min-height:48px}
.lane summary::-webkit-details-marker{display:none}
.lane.bad summary{background:var(--alert-bg);box-shadow:inset 5px 0 0 var(--alert);padding-left:12px}
.lane .id{font-family:var(--mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lane .carrier{display:block;font-family:var(--sans);color:var(--sub);font-size:12px}
.lane .name{min-width:0}
.bar{height:10px;background:var(--bar-bg);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar)}
.pct{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;text-align:right}
.delay{font-weight:700}
.lane.bad .delay{color:var(--alert)}
.chev{color:var(--sub);transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.detail{padding:8px 16px 14px 112px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px}
.detail dt{color:var(--sub)} .detail dd{margin:0;overflow-wrap:anywhere;word-break:break-all;font-family:var(--mono);font-size:13px}
.detail dd.jp{font-family:var(--sans);font-size:14px}
.cols{display:grid;grid-template-columns:96px minmax(0,2.2fr) 70px minmax(120px,2fr) 90px 24px;gap:12px;font-size:12px;color:var(--sub);padding:0 4px 4px}
.sources{margin-top:20px}
.sources ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13px}
.sources li{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.sources li.err{border:2px solid var(--warn)}
@media (max-width:1100px){
  .wrap{padding:12px 16px 24px}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi .val{font-size:30px}
  .lane summary,.cols{grid-template-columns:88px minmax(0,2fr) 60px minmax(80px,1.4fr) 80px 20px;gap:8px}
  .detail{padding-left:16px}
  .sources ul{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="site"></h1>
    <div class="meta">最終更新 <b id="updated"></b>（<span id="ago"></span>）</div>
  </header>
  <div id="summary" role="status"></div>
  <div id="srcerr"></div>
  <section aria-label="KPI"><div class="kpis" id="kpis"></div></section>
  <section class="panel" aria-label="レーン別状況">
    <h2>レーン別状況 <span style="font-weight:400;color:var(--sub);font-size:13px">遅延件数が <span id="lth"></span> 件を超えるレーンを上に表示。行を押すと担当者・注文参照を表示</span></h2>
    <div class="cols"><span>状態</span><span>レーン</span><span class="num">締切</span><span>出荷 / 予定</span><span class="num">遅延</span><span></span></div>
    <div id="lanes"></div>
  </section>
  <section class="sources" aria-label="データ源"><h2>データ源</h2><ul id="sources"></ul></section>
</div>
<script>
const DATA = {
  "site": "第2物流センター（架空）",
  "shift": "日勤 08:00–17:00",
  "updated_at": "2027-03-08T14:32:00+09:00",
  "kpis": [
    {"key": "shipped", "label": "出荷済み件数", "value": 3184, "unit": "件", "target": 5200, "threshold": null},
    {"key": "progress", "label": "出荷進捗率", "value": 61.2, "unit": "%", "target": 64.0, "threshold": {"type": "min", "value": 58.0}},
    {"key": "delay_rate", "label": "出荷遅延率", "value": 12.4, "unit": "%", "target": 3.0, "threshold": {"type": "max", "value": 5.0}},
    {"key": "pick_rate", "label": "ピッキング速度", "value": 142, "unit": "件/時", "target": 150, "threshold": {"type": "min", "value": 120}},
    {"key": "mispick", "label": "誤ピッキング", "value": 3, "unit": "件", "target": 0, "threshold": {"type": "max", "value": 5}},
    {"key": "staff", "label": "稼働人数", "value": 47, "unit": "人", "target": 50, "threshold": {"type": "min", "value": 40}}
  ],
  "lanes": [
    {"id": "LANE-A01-OSAKA-KANSAI-EXPRESS", "carrier": "関西急便", "cutoff": "15:00", "planned": 820, "shipped": 611, "delayed": 4, "lead": "田中", "order_ref": "ORD-20270308-A01-000000611-KX"},
    {"id": "LANE-A02-NAGOYA", "carrier": "中部運輸", "cutoff": "15:30", "planned": 640, "shipped": 402, "delayed": 2, "lead": "鈴木", "order_ref": "ORD-20270308-A02-000000402"},
    {"id": "LANE-B01-TOHOKU-REFRIGERATED-COLDCHAIN", "carrier": "北日本冷凍", "cutoff": "14:00", "planned": 410, "shipped": 188, "delayed": 61, "lead": "佐藤", "order_ref": "ORD-20270308-B01-000000188-COLDCHAIN-PRIORITY"},
    {"id": "LANE-B02-KANTO", "carrier": "関東ロジ", "cutoff": "16:00", "planned": 1120, "shipped": 744, "delayed": 5, "lead": "高橋", "order_ref": "ORD-20270308-B02-000000744"},
    {"id": "LANE-C01-KYUSHU", "carrier": "九州便", "cutoff": "13:30", "planned": 380, "shipped": 371, "delayed": 0, "lead": "伊藤", "order_ref": "ORD-20270308-C01-000000371"},
    {"id": "LANE-C02-HOKURIKU", "carrier": "北陸トラック", "cutoff": "15:00", "planned": 300, "shipped": 176, "delayed": 9, "lead": "渡辺", "order_ref": "ORD-20270308-C02-000000176"},
    {"id": "LANE-D01-SHIKOKU", "carrier": "四国フェリー便", "cutoff": "12:30", "planned": 260, "shipped": 260, "delayed": 0, "lead": "山本", "order_ref": "ORD-20270308-D01-000000260"},
    {"id": "LANE-D02-RETURNS", "carrier": "返品処理", "cutoff": "17:00", "planned": 1270, "shipped": 432, "delayed": 1, "lead": "中村", "order_ref": "ORD-20270308-D02-000000432"}
  ],
  "lane_delay_threshold": 8,
  "sources": [
    {"name": "WMS 出荷実績", "status": "ok", "last_success": "2027-03-08T14:32:00+09:00"},
    {"name": "ハンディ端末 ピッキング記録", "status": "ok", "last_success": "2027-03-08T14:31:40+09:00"},
    {"name": "冷蔵庫 温度センサー", "status": "error", "last_success": "2027-03-08T10:42:00+09:00", "error": "接続タイムアウト"}
  ]
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('ja-JP');
// タイムゾーン非依存で「JSTの時刻」を表示（文字列から直接取り出す）
const hm = iso => iso.slice(11, 16);
const hms = iso => iso.slice(11, 19);
const date = iso => iso.slice(0, 10).replace(/-/g, '/');
const now = new Date(DATA.updated_at); // 表示基準＝最終更新時刻（固定データのため）
const ago = iso => {
  const m = Math.round((now - new Date(iso)) / 60000);
  if (m < 1) return '1分未満前';
  return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60}分前` : `${m}分前`;
};

const kpiBad = k => k.threshold && (k.threshold.type === 'max' ? k.value > k.threshold.value : k.value < k.threshold.value);
const lth = DATA.lane_delay_threshold;
const laneBad = l => l.delayed > lth;

$('site').textContent = `${DATA.site} ／ ${DATA.shift}`;
$('updated').textContent = `${date(DATA.updated_at)} ${hms(DATA.updated_at)}`;
$('ago').textContent = '表示時点';
$('lth').textContent = lth;

// 総括
const badK = DATA.kpis.filter(kpiBad), badL = DATA.lanes.filter(laneBad);
const n = badK.length + badL.length;
$('summary').className = 'summary' + (n ? '' : ' clear');
$('summary').innerHTML = n
  ? `▲ 要対処 ${n} 件<small>KPI: ${badK.map(k => esc(k.label)).join('、') || 'なし'} ／ レーン: ${badL.map(l => esc(l.id)).join('、') || 'なし'}</small>`
  : '✓ しきい値超過なし';

// データ源エラー
$('srcerr').innerHTML = DATA.sources.filter(s => s.status === 'error').map((s, i) => `
  <div class="source-err" role="alert">
    <div class="txt"><b>⚠ データ取得失敗：${esc(s.name)}</b>（${esc(s.error || '不明なエラー')}）<br>
    最後に成功：${date(s.last_success)} ${hm(s.last_success)}（${ago(s.last_success)}）。この間の値は最新ではありません。</div>
    <button type="button" data-retry="${i}">再試行</button>
    <span class="pct" aria-live="polite" id="retry-${i}"></span>
  </div>`).join('');
document.querySelectorAll('[data-retry]').forEach(b => b.addEventListener('click', () => {
  $('retry-' + b.dataset.retry).textContent = '再試行を要求しました（デモ：実際の再取得は行いません）';
}));

// KPI
$('kpis').innerHTML = DATA.kpis.map(k => {
  const bad = kpiBad(k);
  const th = k.threshold ? `しきい値 ${k.threshold.type === 'max' ? '≤' : '≥'} ${k.threshold.value}${esc(k.unit)}` : 'しきい値なし';
  return `<div class="kpi ${bad ? 'bad' : ''}">
    <div class="label">${esc(k.label)}</div>
    <div class="val">${fmt(k.value)}<span>${esc(k.unit)}</span></div>
    <div class="tgt">目標 ${fmt(k.target)}${esc(k.unit)} ／ ${th}</div>
    ${bad ? '<span class="badge bad">▲ しきい値超過</span>' : k.threshold ? '<span class="badge ok">✓ 正常</span>' : '<span class="badge" style="color:var(--sub)">— 監視対象外</span>'}
  </div>`;
}).join('');

// レーン（遅延超過を上、その中・外は遅延件数の多い順）
const lanes = [...DATA.lanes].sort((a, b) => laneBad(b) - laneBad(a) || b.delayed - a.delayed);
$('lanes').innerHTML = lanes.map(l => {
  const bad = laneBad(l), p = Math.round(l.shipped / l.planned * 100);
  return `<details class="lane ${bad ? 'bad' : ''}">
    <summary>
      <span>${bad ? '<span class="badge bad">▲ 要対処</span>' : '<span class="badge ok">✓ 正常</span>'}</span>
      <span class="name"><span class="id" style="display:block" title="${esc(l.id)}">${esc(l.id)}</span><span class="carrier">${esc(l.carrier)}</span></span>
      <span class="num">${esc(l.cutoff)}</span>
      <span><div class="bar" aria-hidden="true"><i style="width:${p}%"></i></div><span class="pct">${fmt(l.shipped)} / ${fmt(l.planned)}（${p}%）</span></span>
      <span class="num delay">${fmt(l.delayed)} 件</span>
      <span class="chev" aria-hidden="true">›</span>
    </summary>
    <dl class="detail">
      <dt>レーンID</dt><dd>${esc(l.id)}</dd>
      <dt>担当者</dt><dd class="jp">${esc(l.lead)}</dd>
      <dt>遅延件数</dt><dd class="jp">${fmt(l.delayed)} 件（しきい値 ${lth} 件${bad ? ' 超過' : ' 以内'}）</dd>
      <dt>注文参照</dt><dd>${esc(l.order_ref)}</dd>
    </dl>
  </details>`;
}).join('');

// データ源一覧
$('sources').innerHTML = DATA.sources.map(s => s.status === 'error'
  ? `<li class="err"><b>⚠ ${esc(s.name)}</b><br>取得失敗 ／ 最終成功 ${hm(s.last_success)}</li>`
  : `<li>✓ ${esc(s.name)}<br>正常 ／ 最終成功 ${hms(s.last_success)}</li>`).join('');
</script>
</body>
</html>
