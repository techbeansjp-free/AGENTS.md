<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出荷オペレーション監視</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --ink:#1b1f24; --muted:#586069; --line:#d5d9de;
  --alert:#b3261e; --alert-bg:#fdeceb; --alert-line:#e8a29d;
  --ok:#2d5f3f; --track:#e3e6ea; --bar:#3d5a80;
  --sans:"Noto Sans CJK JP","Liberation Sans","DejaVu Sans",sans-serif;
  --mono:"DejaVu Sans Mono","Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding:16px 24px 32px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0;font-weight:700}
.meta{color:var(--muted);font-size:14px}
.meta strong{color:var(--ink);font-variant-numeric:tabular-nums}
h2{font-size:16px;margin:24px 0 8px;font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* 状況サマリー */
.summary{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:6px;border:2px solid var(--alert);background:var(--alert-bg);font-weight:700;font-size:17px}
.summary.clear{border-color:var(--ok);background:#e9f3ec;color:var(--ok)}
.summary .chips{display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
.chip{background:#fff;border:1px solid var(--alert-line);border-radius:4px;padding:2px 8px;color:var(--alert)}

/* データ源 */
.source-err{margin-top:12px;border:2px solid var(--alert);background:var(--surface);border-radius:6px;padding:10px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.source-err .t{font-weight:700;color:var(--alert)}
.source-err .d{color:var(--ink);font-size:14px;overflow-wrap:anywhere}
button{font:inherit;font-weight:700;min-height:44px;padding:0 20px;border:2px solid var(--alert);background:#fff;color:var(--alert);border-radius:6px;cursor:pointer}
button:hover{background:var(--alert-bg)}
button:focus-visible{outline:3px solid #1a5fb4;outline-offset:2px}
button[disabled]{opacity:.6;cursor:default}
.retry-msg{grid-column:1/-1;font-size:14px;color:var(--muted);min-height:1.5em;margin:0}
.src-ok{margin:8px 0 0;font-size:13px;color:var(--muted);display:flex;gap:4px 20px;flex-wrap:wrap}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:0;padding:0;list-style:none}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.kpi.over{border:2px solid var(--alert);background:var(--alert-bg);padding:11px 13px}
.kpi .lb{font-size:14px;color:var(--muted);font-weight:500}
.kpi .v{font-size:34px;font-weight:700;line-height:1.2;white-space:nowrap}
.kpi .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi.over .v{color:var(--alert)}
.kpi .sub{font-size:13px;color:var(--muted)}
.flag{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--alert);border-radius:3px;padding:0 6px;margin-top:2px}
.okmark{font-size:13px;color:var(--ok);font-weight:500}

/* レーン */
.lanes{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);table-layout:fixed}
.lanes th{font-size:13px;color:var(--muted);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);background:#fafbfc}
.lanes td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
.lanes tr.over td{background:var(--alert-bg)}
.lanes tr.over td:first-child{box-shadow:inset 6px 0 0 var(--alert)}
.id{font-family:var(--mono);font-size:13px;font-weight:700;overflow-wrap:anywhere}
.ref{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.car{font-size:14px}
.bar{height:10px;background:var(--track);border-radius:5px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--bar)}
.over .bar i{background:var(--alert)}
.dl{font-size:20px;font-weight:700}
.over .dl{color:var(--alert)}
.col-st{width:92px}.col-prog{width:20%}.col-dl{width:96px}.col-cut{width:84px}.col-lead{width:84px}
.note{font-size:13px;color:var(--muted);margin-top:6px}

@media (max-width:1100px){
  .wrap{padding:12px 16px 24px}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi .v{font-size:30px}
  .col-lead{width:70px}.col-prog{width:22%}
  .source-err{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="meta">最終更新 <strong id="updated"></strong></div>
  </header>

  <div id="summary" role="status"></div>
  <div id="sources"></div>

  <h2>主要KPI</h2>
  <ul class="kpis" id="kpis"></ul>

  <h2>レーン別の状況</h2>
  <table class="lanes">
    <caption class="note" style="caption-side:bottom;text-align:left" id="lane-note"></caption>
    <thead><tr>
      <th class="col-st" scope="col">状態</th>
      <th scope="col">レーン / 運送会社 / 注文参照</th>
      <th class="col-prog" scope="col">出荷（済 / 予定）</th>
      <th class="col-dl" scope="col">遅延件数</th>
      <th class="col-cut" scope="col">締切</th>
      <th class="col-lead" scope="col">担当者</th>
    </tr></thead>
    <tbody id="lanes"></tbody>
  </table>
</div>

<script>
const DATA = {
  "site": "第2物流センター（架空）",
  "shift": "日勤 08:00–17:00",
  "updated_at": "2027-03-08T14:32:00+09:00",
  "kpis": [
    {"key": "shipped", "label": "出荷済み件数", "value": 3184, "unit": "件", "target": 5200, "threshold": null},
    {"key": "progress", "label": "出荷進捗率", "value": 61.2, "unit": "%", "target": 64.0, "threshold": {"type": "min", "value": 58.0}},
    {"key": "delay_rate", "label": "出荷遅延率", "value": 12.4, "unit": "%", "target": 3.0, "threshold": {"type": "max", "value": 5.0}},
    {"key": "pick_rate", "label": "ピッキング速度", "value": 142, "unit": "件/時", "target": 150, "threshold": {"type": "min", "value": 120}},
    {"key": "mispick", "label": "誤ピッキング", "value": 3, "unit": "件", "target": 0, "threshold": {"type": "max", "value": 5}},
    {"key": "staff", "label": "稼働人数", "value": 47, "unit": "人", "target": 50, "threshold": {"type": "min", "value": 40}}
  ],
  "lanes": [
    {"id": "LANE-A01-OSAKA-KANSAI-EXPRESS", "carrier": "関西急便", "cutoff": "15:00", "planned": 820, "shipped": 611, "delayed": 4, "lead": "田中", "order_ref": "ORD-20270308-A01-000000611-KX"},
    {"id": "LANE-A02-NAGOYA", "carrier": "中部運輸", "cutoff": "15:30", "planned": 640, "shipped": 402, "delayed": 2, "lead": "鈴木", "order_ref": "ORD-20270308-A02-000000402"},
    {"id": "LANE-B01-TOHOKU-REFRIGERATED-COLDCHAIN", "carrier": "北日本冷凍", "cutoff": "14:00", "planned": 410, "shipped": 188, "delayed": 61, "lead": "佐藤", "order_ref": "ORD-20270308-B01-000000188-COLDCHAIN-PRIORITY"},
    {"id": "LANE-B02-KANTO", "carrier": "関東ロジ", "cutoff": "16:00", "planned": 1120, "shipped": 744, "delayed": 5, "lead": "高橋", "order_ref": "ORD-20270308-B02-000000744"},
    {"id": "LANE-C01-KYUSHU", "carrier": "九州便", "cutoff": "13:30", "planned": 380, "shipped": 371, "delayed": 0, "lead": "伊藤", "order_ref": "ORD-20270308-C01-000000371"},
    {"id": "LANE-C02-HOKURIKU", "carrier": "北陸トラック", "cutoff": "15:00", "planned": 300, "shipped": 176, "delayed": 9, "lead": "渡辺", "order_ref": "ORD-20270308-C02-000000176"},
    {"id": "LANE-D01-SHIKOKU", "carrier": "四国フェリー便", "cutoff": "12:30", "planned": 260, "shipped": 260, "delayed": 0, "lead": "山本", "order_ref": "ORD-20270308-D01-000000260"},
    {"id": "LANE-D02-RETURNS", "carrier": "返品処理", "cutoff": "17:00", "planned": 1270, "shipped": 432, "delayed": 1, "lead": "中村", "order_ref": "ORD-20270308-D02-000000432"}
  ],
  "lane_delay_threshold": 8,
  "sources": [
    {"name": "WMS 出荷実績", "status": "ok", "last_success": "2027-03-08T14:32:00+09:00"},
    {"name": "ハンディ端末 ピッキング記録", "status": "ok", "last_success": "2027-03-08T14:31:40+09:00"},
    {"name": "冷蔵庫 温度センサー", "status": "error", "last_success": "2027-03-08T10:42:00+09:00", "error": "接続タイムアウト"}
  ]
};

const $ = id => document.getElementById(id);
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
// タイムゾーン変換を避け、データ記載の現地時刻をそのまま表示する
function hm(iso){ return iso.slice(11,16); }
function ymd(iso){ return iso.slice(0,4)+"/"+iso.slice(5,7)+"/"+iso.slice(8,10); }
function fmt(n){ return n.toLocaleString("ja-JP"); }
function elapsed(fromIso, toIso){
  const m = Math.round((new Date(toIso) - new Date(fromIso)) / 60000);
  return Math.floor(m/60) + "時間" + (m%60) + "分";
}

const isOver = k => k.threshold && (k.threshold.type === "max" ? k.value > k.threshold.value : k.value < k.threshold.value);
const laneOver = l => l.delayed > DATA.lane_delay_threshold;

$("title").textContent = DATA.site + "　出荷状況（" + DATA.shift + "）";
$("updated").textContent = ymd(DATA.updated_at) + " " + hm(DATA.updated_at);

const overKpis = DATA.kpis.filter(isOver);
const overLanes = DATA.lanes.filter(laneOver);
const errSrc = DATA.sources.filter(s => s.status === "error");
const issues = overKpis.length + overLanes.length + errSrc.length;

// サマリー
const sum = $("summary");
sum.className = "summary" + (issues ? "" : " clear");
if (issues){
  sum.appendChild(el("span", null, "▲ 対処が必要：" + issues + "件"));
  const chips = el("span", "chips");
  if (overLanes.length) chips.appendChild(el("span","chip","遅延超過レーン " + overLanes.length));
  if (overKpis.length) chips.appendChild(el("span","chip","しきい値超過KPI " + overKpis.length));
  if (errSrc.length) chips.appendChild(el("span","chip","取得失敗データ源 " + errSrc.length));
  sum.appendChild(chips);
} else {
  sum.textContent = "✓ 対処が必要な項目はありません";
}

// データ源
const srcBox = $("sources");
errSrc.forEach(s => {
  const b = el("div","source-err");
  b.setAttribute("role","alert");
  const txt = el("div");
  txt.appendChild(el("div","t","▲ データ取得に失敗：" + s.name));
  txt.appendChild(el("div","d",
    "原因：" + (s.error || "不明") + "　／　最後に成功：" + ymd(s.last_success) + " " + hm(s.last_success) +
    "（最終更新から " + elapsed(s.last_success, DATA.updated_at) + " 前）。この源の値は古い可能性があります。"));
  const btn = el("button", null, "再試行");
  btn.type = "button";
  btn.setAttribute("aria-label", s.name + " の取得を再試行");
  const msg = el("p","retry-msg");
  msg.setAttribute("aria-live","polite");
  btn.addEventListener("click", () => {
    btn.disabled = true;
    msg.textContent = "再試行を受け付けました（このデモ画面では実際の再取得は行いません）";
    setTimeout(() => { btn.disabled = false; }, 3000);
  });
  b.append(txt, btn, msg);
  srcBox.appendChild(b);
});
const okList = DATA.sources.filter(s => s.status === "ok");
if (okList.length){
  const p = el("div","src-ok");
  okList.forEach(s => p.appendChild(el("span",null,"✓ " + s.name + "：正常（" + hm(s.last_success) + " 取得）")));
  srcBox.appendChild(p);
}

// KPI
const kl = $("kpis");
DATA.kpis.forEach(k => {
  const over = isOver(k);
  const li = el("li","kpi" + (over ? " over" : ""));
  li.appendChild(el("div","lb",k.label));
  const v = el("div","v num", fmt(k.value));
  v.appendChild(el("small",null,k.unit));
  li.appendChild(v);
  li.appendChild(el("div","sub num","目標 " + fmt(k.target) + k.unit));
  if (k.threshold){
    const t = k.threshold;
    const rule = "基準 " + fmt(t.value) + k.unit + (t.type === "max" ? " 以下" : " 以上");
    if (over) li.appendChild(el("div","flag","▲ 基準超過（" + rule + "）"));
    else li.appendChild(el("div","okmark","✓ 正常（" + rule + "）"));
  } else {
    li.appendChild(el("div","okmark","基準なし"));
  }
  kl.appendChild(li);
});

// レーン（要対応を上に。同順内は元の並び）
const sorted = DATA.lanes.map((l,i)=>({l,i})).sort((a,b)=>(laneOver(b.l)-laneOver(a.l)) || (a.i-b.i)).map(x=>x.l);
const tb = $("lanes");
sorted.forEach(l => {
  const over = laneOver(l);
  const tr = el("tr", over ? "over" : "");
  const st = el("td", null);
  st.appendChild(el("strong", over ? "" : "okmark", over ? "▲ 要対応" : "✓ 正常"));
  const nm = el("td");
  nm.appendChild(el("div","id",l.id));
  nm.appendChild(el("div","car",l.carrier));
  nm.appendChild(el("div","ref",l.order_ref));
  const pr = el("td");
  const pct = Math.round(l.shipped / l.planned * 1000) / 10;
  pr.appendChild(el("div","num", fmt(l.shipped) + " / " + fmt(l.planned) + "（" + pct + "%）"));
  const bar = el("div","bar"); const fill = el("i"); fill.style.width = Math.min(100,pct) + "%";
  bar.appendChild(fill); pr.appendChild(bar);
  const dl = el("td");
  dl.appendChild(el("span","dl num", String(l.delayed)));
  dl.appendChild(document.createTextNode(" 件"));
  const cut = el("td","num", l.cutoff);
  const lead = el("td",null, l.lead);
  tr.append(st, nm, pr, dl, cut, lead);
  tb.appendChild(tr);
});
$("lane-note").textContent = "遅延件数が " + DATA.lane_delay_threshold + " 件を超えたレーンを「要対応」とし、上に表示します。";
</script>
</body>
</html>
