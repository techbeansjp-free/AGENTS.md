<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出荷オペレーション監視</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --ink:#1b2430; --sub:#566272; --line:#d5dae1;
  --alert:#b3261e; --alert-bg:#fdecea; --ok:#1d6b3a; --bar:#3b5b82; --bar-bg:#e3e7ed;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5}
.num,.mono{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-variant-numeric:tabular-nums}
main{max-width:1440px;margin:0 auto;padding:16px 24px 32px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 24px;margin-bottom:12px}
h1{font-size:20px;margin:0;font-weight:700}
header .meta{color:var(--sub)}
header .updated{color:var(--ink);font-weight:700}
h2{font-size:16px;margin:24px 0 8px;font-weight:700}

/* summary / alerts */
.summary{display:flex;flex-direction:column;gap:8px}
.banner{border:2px solid var(--alert);background:var(--alert-bg);border-radius:6px;padding:10px 14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.banner.calm{border-color:var(--ok);background:#e8f4ec}
.banner .tag{font-weight:700;color:#fff;background:var(--alert);border-radius:3px;padding:0 8px;white-space:nowrap}
.banner.calm .tag{background:var(--ok)}
.banner .body{flex:1 1 320px;min-width:0}
.banner .body strong{font-weight:700}
.banner .sub{color:var(--sub);font-size:13px}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:#fff;color:var(--ink);
  border-radius:4px;padding:6px 14px;min-height:40px;font-weight:700}
button:hover{background:var(--ink);color:#fff}
button:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
button[disabled]{opacity:.6;cursor:default}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.kpi.breach{border:3px solid var(--alert);background:var(--alert-bg);padding:8px 10px}
.kpi .label{color:var(--sub);font-size:13px}
.kpi .status{font-weight:700;color:var(--alert);font-size:13px;min-height:20px}
.kpi .value{font-size:34px;font-weight:700;line-height:1.2}
.kpi.breach .value{color:var(--alert)}
.kpi .unit{font-size:14px;font-weight:400;color:var(--sub);margin-left:3px}
.kpi .rule{font-size:12px;color:var(--sub);margin-top:2px}

/* lanes */
.lanes{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lane-head,.lane{display:grid;gap:8px 14px;align-items:center;padding:10px 14px;
  grid-template-columns:minmax(0,2.6fr) minmax(0,1.1fr) 60px minmax(120px,1.6fr) 80px 56px minmax(0,2.4fr)}
.lane-head{background:#eceff3;color:var(--sub);font-size:12px;font-weight:700;padding-top:6px;padding-bottom:6px}
.lane{border-top:1px solid var(--line)}
.lane.breach{border-left:8px solid var(--alert);background:var(--alert-bg);padding-left:8px}
.lane .id{font-weight:700;font-size:13px;overflow-wrap:anywhere;word-break:break-all}
.lane .badge{display:inline-block;margin-right:6px;color:#fff;background:var(--alert);border-radius:3px;padding:0 6px;font-size:12px;white-space:nowrap;word-break:normal}
.lane .ref{font-size:11px;color:var(--sub);overflow-wrap:anywhere;word-break:break-all}
.lane .delayed{font-weight:700;text-align:right}
.lane.breach .delayed{color:var(--alert)}
.bar{height:10px;background:var(--bar-bg);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar)}
.lane.breach .bar i{background:var(--alert)}
.pct{font-size:12px;color:var(--sub)}
.l-lead,.l-carrier{overflow-wrap:anywhere}
.lane .cell-label{display:none}

/* sources */
.sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.src{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.src.error{border:3px solid var(--alert);background:var(--alert-bg);padding:8px 10px}
.src .name{font-weight:700;overflow-wrap:anywhere}
.src .st{font-size:13px;color:var(--ok);font-weight:700}
.src.error .st{color:var(--alert)}
.src .t{font-size:13px;color:var(--sub)}
.src button{margin-top:6px}

@media (max-width:1100px){
  main{padding:12px 14px 24px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sources{grid-template-columns:1fr}
  .lane-head{display:none}
  .lane{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 70px}
  .lane .c-id{grid-column:1/-1}
  .lane .c-bar{grid-column:1/4}
  .lane .c-ref{grid-column:1/-1}
  .lane .cell-label{display:block;font-size:11px;color:var(--sub)}
}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="site"></h1>
    <div class="meta"><span id="shift"></span>　<span class="updated">最終更新 <span class="num" id="updated"></span></span></div>
  </header>

  <section class="summary" id="summary" aria-label="対処が必要な項目" aria-live="polite"></section>

  <h2>KPI</h2>
  <section class="kpis" id="kpis"></section>

  <h2>レーン別 出荷状況 <span class="pct" id="laneNote"></span></h2>
  <section class="lanes" id="lanes">
    <div class="lane-head" aria-hidden="true">
      <div>レーン / 注文参照</div><div>運送会社</div><div>締め</div><div>出荷進捗</div><div style="text-align:right">出荷/予定</div><div style="text-align:right">遅延</div><div>担当</div>
    </div>
  </section>

  <h2>データ源</h2>
  <section class="sources" id="sources"></section>
</main>

<script>
const DATA = {
  "site": "第2物流センター（架空）",
  "shift": "日勤 08:00–17:00",
  "updated_at": "2027-03-08T14:32:00+09:00",
  "kpis": [
    {"key": "shipped", "label": "出荷済み件数", "value": 3184, "unit": "件", "target": 5200, "threshold": null},
    {"key": "progress", "label": "出荷進捗率", "value": 61.2, "unit": "%", "target": 64.0, "threshold": {"type": "min", "value": 58.0}},
    {"key": "delay_rate", "label": "出荷遅延率", "value": 12.4, "unit": "%", "target": 3.0, "threshold": {"type": "max", "value": 5.0}},
    {"key": "pick_rate", "label": "ピッキング速度", "value": 142, "unit": "件/時", "target": 150, "threshold": {"type": "min", "value": 120}},
    {"key": "mispick", "label": "誤ピッキング", "value": 3, "unit": "件", "target": 0, "threshold": {"type": "max", "value": 5}},
    {"key": "staff", "label": "稼働人数", "value": 47, "unit": "人", "target": 50, "threshold": {"type": "min", "value": 40}}
  ],
  "lanes": [
    {"id": "LANE-A01-OSAKA-KANSAI-EXPRESS", "carrier": "関西急便", "cutoff": "15:00", "planned": 820, "shipped": 611, "delayed": 4, "lead": "田中", "order_ref": "ORD-20270308-A01-000000611-KX"},
    {"id": "LANE-A02-NAGOYA", "carrier": "中部運輸", "cutoff": "15:30", "planned": 640, "shipped": 402, "delayed": 2, "lead": "鈴木", "order_ref": "ORD-20270308-A02-000000402"},
    {"id": "LANE-B01-TOHOKU-REFRIGERATED-COLDCHAIN", "carrier": "北日本冷凍", "cutoff": "14:00", "planned": 410, "shipped": 188, "delayed": 61, "lead": "佐藤", "order_ref": "ORD-20270308-B01-000000188-COLDCHAIN-PRIORITY"},
    {"id": "LANE-B02-KANTO", "carrier": "関東ロジ", "cutoff": "16:00", "planned": 1120, "shipped": 744, "delayed": 5, "lead": "高橋", "order_ref": "ORD-20270308-B02-000000744"},
    {"id": "LANE-C01-KYUSHU", "carrier": "九州便", "cutoff": "13:30", "planned": 380, "shipped": 371, "delayed": 0, "lead": "伊藤", "order_ref": "ORD-20270308-C01-000000371"},
    {"id": "LANE-C02-HOKURIKU", "carrier": "北陸トラック", "cutoff": "15:00", "planned": 300, "shipped": 176, "delayed": 9, "lead": "渡辺", "order_ref": "ORD-20270308-C02-000000176"},
    {"id": "LANE-D01-SHIKOKU", "carrier": "四国フェリー便", "cutoff": "12:30", "planned": 260, "shipped": 260, "delayed": 0, "lead": "山本", "order_ref": "ORD-20270308-D01-000000260"},
    {"id": "LANE-D02-RETURNS", "carrier": "返品処理", "cutoff": "17:00", "planned": 1270, "shipped": 432, "delayed": 1, "lead": "中村", "order_ref": "ORD-20270308-D02-000000432"}
  ],
  "lane_delay_threshold": 8,
  "sources": [
    {"name": "WMS 出荷実績", "status": "ok", "last_success": "2027-03-08T14:32:00+09:00"},
    {"name": "ハンディ端末 ピッキング記録", "status": "ok", "last_success": "2027-03-08T14:31:40+09:00"},
    {"name": "冷蔵庫 温度センサー", "status": "error", "last_success": "2027-03-08T10:42:00+09:00", "error": "接続タイムアウト"}
  ]
};

const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 表示用: タイムゾーン変換せず、データの記載時刻(JST)をそのまま読む
const hm = iso => iso.slice(11, 16);
const hms = iso => iso.slice(11, 19);
const md = iso => iso.slice(5, 10).replace('-', '/');
const fmt = (v, unit) => unit === '%' ? v.toFixed(1) : v.toLocaleString('ja-JP');
const minsBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 60000);
const dur = m => (m >= 60 ? Math.floor(m / 60) + '時間' : '') + (m % 60 ? (m % 60) + '分' : '');

const kpiBreach = k => k.threshold && (k.threshold.type === 'min' ? k.value < k.threshold.value : k.value > k.threshold.value);
const laneBreach = l => l.delayed > DATA.lane_delay_threshold;

$('site').textContent = DATA.site + ' 出荷状況';
$('shift').textContent = DATA.shift;
$('updated').textContent = md(DATA.updated_at) + ' ' + hms(DATA.updated_at);

const badK = DATA.kpis.filter(kpiBreach);
const badL = DATA.lanes.filter(laneBreach);
const badS = DATA.sources.filter(s => s.status === 'error');

// --- summary
const sum = $('summary');
if (badK.length + badL.length === 0) {
  sum.append(el('div', 'banner calm', '<span class="tag">✓ 異常なし</span><div class="body">しきい値を超えた KPI・レーンはありません。</div>'));
} else {
  const kt = badK.map(k => `${esc(k.label)} ${fmt(k.value, k.unit)}${esc(k.unit)}`).join('、');
  const lt = badL.map(l => `<span class="mono" style="overflow-wrap:anywhere">${esc(l.id)}</span>（遅延${l.delayed}件）`).join('、');
  sum.append(el('div', 'banner',
    `<span class="tag">⚠ 要対処 ${badK.length + badL.length}件</span><div class="body">` +
    (badK.length ? `<div><strong>KPI ${badK.length}件：</strong>${kt}</div>` : '') +
    (badL.length ? `<div><strong>レーン ${badL.length}件：</strong>${lt}</div>` : '') + `</div>`));
}
badS.forEach(s => {
  const ago = dur(minsBetween(s.last_success, DATA.updated_at));
  const b = el('div', 'banner',
    `<span class="tag">✕ 取得失敗</span><div class="body"><strong>${esc(s.name)}</strong>：${esc(s.error || 'エラー')}。` +
    `最後に成功：<span class="num">${md(s.last_success)} ${hm(s.last_success)}</span>（${ago}前）` +
    `<div class="sub">この間の値は更新されていません。</div></div>`);
  b.append(retryBtn(s));
  sum.append(b);
});

function retryBtn(s) {
  const b = el('button', null, '再試行');
  b.type = 'button';
  b.setAttribute('aria-label', s.name + ' を再試行');
  b.addEventListener('click', () => {
    b.disabled = true; b.textContent = '再試行中…';
    setTimeout(() => { b.disabled = false; b.textContent = '再試行'; }, 1500); // 実取得は未実装
  });
  return b;
}

// --- KPI
DATA.kpis.forEach(k => {
  const bad = kpiBreach(k);
  const rule = k.threshold ? `しきい値 ${k.threshold.type === 'min' ? '≥' : '≤'} ${fmt(k.threshold.value, k.unit)}${esc(k.unit)}` : 'しきい値なし';
  $('kpis').append(el('div', 'kpi' + (bad ? ' breach' : ''),
    `<div class="label">${esc(k.label)}</div>` +
    `<div class="status">${bad ? '⚠ しきい値' + (k.threshold.type === 'min' ? '未満' : '超過') : ''}</div>` +
    `<div class="value num">${fmt(k.value, k.unit)}<span class="unit">${esc(k.unit)}</span></div>` +
    `<div class="rule">目標 ${fmt(k.target, k.unit)}${esc(k.unit)} ／ ${rule}</div>`));
});

// --- lanes（要対処を先頭、次に遅延件数の多い順）
$('laneNote').textContent = `遅延 ${DATA.lane_delay_threshold} 件超で要対処`;
[...DATA.lanes].sort((a, b) => laneBreach(b) - laneBreach(a) || b.delayed - a.delayed).forEach(l => {
  const bad = laneBreach(l);
  const pct = Math.round(l.shipped / l.planned * 100);
  $('lanes').append(el('div', 'lane' + (bad ? ' breach' : ''),
    `<div class="c-id"><span class="id mono">${bad ? '<span class="badge">⚠ 要対処</span>' : ''}${esc(l.id)}</span>` +
      `<div class="ref mono c-ref">${esc(l.order_ref)}</div></div>` +
    `<div class="l-carrier"><span class="cell-label">運送会社</span>${esc(l.carrier)}</div>` +
    `<div class="num"><span class="cell-label">締め</span>${l.cutoff}</div>` +
    `<div class="c-bar"><div class="bar" role="img" aria-label="出荷進捗 ${pct}%"><i style="width:${pct}%"></i></div><div class="pct num">${pct}%</div></div>` +
    `<div class="num" style="text-align:right"><span class="cell-label">出荷/予定</span>${l.shipped}/${l.planned}</div>` +
    `<div class="delayed num"><span class="cell-label">遅延</span>${l.delayed}件</div>` +
    `<div class="l-lead"><span class="cell-label">担当</span>${esc(l.lead)}</div>`));
});

// --- sources
DATA.sources.forEach(s => {
  const err = s.status === 'error';
  const d = el('div', 'src' + (err ? ' error' : ''),
    `<div class="name">${esc(s.name)}</div>` +
    `<div class="st">${err ? '✕ 取得失敗：' + esc(s.error || '') : '● 正常'}</div>` +
    `<div class="t">最後に成功 <span class="num">${md(s.last_success)} ${hms(s.last_success)}</span></div>`);
  if (err) d.append(retryBtn(s));
  $('sources').append(d);
});
</script>
</body>
</html>
