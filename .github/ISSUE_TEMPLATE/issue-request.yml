# issue-request.yml — GitHub Issue Forms（本リポの手動起票の構造強制・ISSUE_TRACKING_MODE=github_native）
#
# 本ファイルは本リポジトリの**実効 Issue Forms** である（S-3 汎用雛形
# enforcement/github/issue-request.example.yml をコピー・02_設計 ADR-S2-6）。
# GitHub Issue Forms の既定探索先 .github/ISSUE_TEMPLATE/ に置かれ、Web UI の「New Issue」画面で
# 選択肢として表示される。
#
# ── 目的 ──────────────────────────────────────────────────────────────────
#   ISSUE_TRACKING_MODE=github_native では、AI 起票（gh issue create --body）は
#   run_command.md §Constraints が定める body テンプレートを直接渡せるが、オーナーによる
#   GitHub Web UI 上の手動起票には同等の構造強制がない。本 Forms は GitHub Issue Forms の
#   `required` 機構を使い、目的・成功基準・受け入れ基準の入力を Web UI 側でも必須化する。
#
# ── 効き方（重要） ────────────────────────────────────────────────────────
#   - `validations.required: true` のフィールドが未入力だと Web UI 側で submit できない
#     （本リポジトリでの自動テスト対象外。GitHub 側の既存機構が保証する契約）。
#   - AI 経路（gh issue create --body）は本 Forms を経由せず、run_command.md §Constraints の
#     body テンプレートを直接渡すため、本 Forms の有無に関わらず AI 起票フローは不変。
#   - 本ファイルは enforcement（audit.sh・hook）から読まれない（手動起票の構造強制のみが責務）。
#
# ── フィールド対応（00_要求定義.md との対応） ────────────────────────────
#   目的・成功基準・受け入れ基準は必須（required: true）。全体像・フロー／参照は任意（required: false）。
#
name: "Issue 起票（要求定義）"
description: "目的・成功基準・受け入れ基準を明確にした Issue を起票します。"
title: "[Issue] "
labels: []
body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: "この issue で達成したいこと（00_要求定義.md §1.1 目的 相当）。"
    validations:
      required: true
  - type: textarea
    id: success-criteria
    attributes:
      label: 成功基準
      description: "○/× で判定できる成功基準（00_要求定義.md §6 成功基準 相当）。"
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 受け入れ基準
      description: "Given/When/Then 等で確認できる受け入れ基準。"
    validations:
      required: true
  - type: textarea
    id: overview-flow
    attributes:
      label: 全体像・フロー
      description: "（任意）関連する処理フロー・マインドマップ等。"
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 参照
      description: "（任意）関連 Issue・ドキュメントへのリンク。"
    validations:
      required: false
