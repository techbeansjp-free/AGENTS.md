name: Current Host worktree execution
on:
  pull_request:
permissions:
  contents: read
# 同じPRへの新しいpushで、古いcommitの実行を止める（#1714）。
# 手動の再実行（run_attempt > 1）は固有のgroupに入れ、最新commitの実行を取り消さない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}${{ github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: true
jobs:
  worktree:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify real worktree with existing dependencies and commit binding
        run: node --test test/test_worktree_execution.mjs
