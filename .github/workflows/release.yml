name: 自動・手動release

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: package.jsonと一致させるrelease version
        required: true
        type: string
      dry_run:
        description: 外部更新を行わず計画だけを確認する
        required: true
        type: boolean
        default: true
      publish_npm:
        description: 承認後にnpmへprovenance付きで公開する
        required: true
        type: boolean
        default: false

concurrency:
  group: main-mutator
  cancel-in-progress: false

# 既定は読取専用とし、外部更新jobだけがjob単位で権限を追加する。
permissions:
  contents: read

jobs:
  validate:
    name: 自動・手動release候補を検証する
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      state: ${{ steps.plan_outputs.outputs.state }}
      version: ${{ steps.plan_outputs.outputs.version }}
      tag: ${{ steps.plan_outputs.outputs.tag }}
      needs_version_bump: ${{ steps.plan_outputs.outputs.needs_version_bump }}
      npm_enabled: ${{ steps.plan_outputs.outputs.npm_enabled }}
      release_sha: ${{ steps.plan_outputs.outputs.release_sha }}
      distribution_digest: ${{ steps.plan_outputs.outputs.distribution_digest }}
      distribution_entry_count: ${{ steps.plan_outputs.outputs.distribution_entry_count }}
    steps:
      - name: release候補のcommitを取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node.js実行環境を準備する
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: PoC隔離実行に必要なbubblewrapを導入する
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: 固定ファイルどおりに依存を導入する
        run: npm ci
      - name: 全Gherkin・型・build・package contentsを必須gateで検証する
        run: npm run verify:distribution
      - name: 既存tagをrelease計画用に取得する
        run: git tag --list > existing-tags.txt
      - name: 現在の配布digestを算出する
        if: ${{ github.event_name == 'push' }}
        run: node --import tsx scripts/compute_distribution_digest.ts > distribution-digest.json
      - name: 直前releaseの配布digestを算出する
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        run: |
          printf '{"digest":"","entryCount":0,"errors":[]}\n' > previous-distribution-digest.json
          version="$(node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')"
          previous_tag="v$version"
          if ! git rev-parse --verify "refs/tags/$previous_tag" >/dev/null 2>&1; then
            exit 0
          fi
          if ! git worktree add --detach ../previous-release "$previous_tag"; then
            exit 0
          fi
          if ! (cd ../previous-release && npm ci --ignore-scripts && npm run build); then
            exit 0
          fi
          if node --import tsx scripts/compute_distribution_digest.ts --cwd ../previous-release > previous-distribution-digest-candidate.json; then
            cp previous-distribution-digest-candidate.json previous-distribution-digest.json
          fi
      - name: 純関数で自動release計画を作成する
        id: auto_release_plan
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          RELEASE_MODE: auto
          RELEASE_EXISTING_TAGS_FILE: existing-tags.txt
          RELEASE_DISTRIBUTION_DIGEST_FILE: distribution-digest.json
          RELEASE_PREVIOUS_DISTRIBUTION_DIGEST_FILE: previous-distribution-digest.json
          RELEASE_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node --import tsx scripts/plan_release.ts > release-plan.json
      - name: 純関数で手動release計画を作成する
        id: manual_release_plan
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        env:
          RELEASE_REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_PUBLISH_NPM: ${{ inputs.publish_npm }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_SHA: ${{ github.sha }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_EXISTING_TAGS_FILE: existing-tags.txt
          RELEASE_GATES_JSON: >-
            [{"name":"quality","passed":true},{"name":"build","passed":true},{"name":"package","passed":true},{"name":"test","passed":true},{"name":"typecheck","passed":true}]
        run: node --import tsx scripts/plan_release.ts > release-plan.json
      - name: release計画を後続jobへ渡す
        id: plan_outputs
        if: always()
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          if (!output || !fs.existsSync("release-plan.json")) process.exit(1);
          const plan = JSON.parse(fs.readFileSync("release-plan.json", "utf8"));
          const npmStage = plan.stages?.find(({ stage }) => stage === "npm_publish");
          const distribution = fs.existsSync("distribution-digest.json")
            ? JSON.parse(fs.readFileSync("distribution-digest.json", "utf8"))
            : { digest: "", entryCount: 0 };
          fs.appendFileSync(
            output,
            [
              `state=${plan.state}`,
              `version=${plan.version}`,
              `tag=${plan.tag}`,
              `needs_version_bump=${plan.needsVersionBump === true}`,
              `npm_enabled=${npmStage?.enabled === true}`,
              `release_sha=${process.env.RELEASE_SHA ?? ""}`,
              `distribution_digest=${distribution.digest ?? ""}`,
              `distribution_entry_count=${distribution.entryCount ?? 0}`,
              "",
            ].join("\n"),
          );
          NODE
      - name: release note候補を生成する
        if: always()
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_SHA^" 2>/dev/null || true)"
          {
            printf '# 変更内容\n\n'
            if [ -n "$previous_tag" ]; then
              git log "$previous_tag..$RELEASE_SHA" --pretty='- %s (%h)'
            else
              git log "$RELEASE_SHA" --pretty='- %s (%h)'
            fi
          } > release-notes.md
      - name: npm pack対象をdry-runで取得する
        if: always()
        run: npm pack --dry-run --json --ignore-scripts > npm-pack.json
      - name: 自動・手動release計画と未完了操作を記録する
        if: always()
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const planText = fs.existsSync("release-plan.json")
            ? fs.readFileSync("release-plan.json", "utf8")
            : '{"state":"failed","reasons":["release計画を生成できませんでした"]}';
          const plan = JSON.parse(planText);
          const notes = fs.existsSync("release-notes.md")
            ? fs.readFileSync("release-notes.md", "utf8")
            : "release noteを生成できませんでした";
          const pack = fs.existsSync("npm-pack.json")
            ? JSON.parse(fs.readFileSync("npm-pack.json", "utf8"))
            : [];
          const files = pack[0]?.files?.map(({ path }) => `- ${path}`).join("\n") ?? "- 取得失敗";
          const distribution = fs.existsSync("distribution-digest.json")
            ? JSON.parse(fs.readFileSync("distribution-digest.json", "utf8"))
            : { digest: "", entryCount: 0 };
          const previousDistribution = fs.existsSync("previous-distribution-digest.json")
            ? JSON.parse(fs.readFileSync("previous-distribution-digest.json", "utf8"))
            : { digest: "" };
          const packageMetadata = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const previousTag = `v${packageMetadata.version}`;
          const stopped = plan.state === "dry-run" || plan.state === "skipped" || plan.state === "rejected";
          fs.appendFileSync(
            summary,
            [
              "# release候補の検証結果",
              "",
              `- 契機: ${process.env.RELEASE_EVENT ?? "不明"}`,
              `- 状態: ${plan.state ?? "failed"}`,
              `- version: ${plan.version ?? "不明"}`,
              `- tag: ${plan.tag ?? "不明"}`,
              `- version bump: ${plan.needsVersionBump === true ? "必要" : "不要"}`,
              `- npm公開: ${process.env.RELEASE_EVENT === "workflow_dispatch" && plan.stages?.some(({ stage, enabled }) => stage === "npm_publish" && enabled) ? "手動経路で要求済み" : "未実行"}`,
              `- 現在の配布digest: ${distribution.digest || "算出なし"}`,
              `- 直前release: ${previousDistribution.digest ? `${previousTag} / ${previousDistribution.digest}` : `${previousTag}の配布digestなし`}`,
              `- 配布file件数: ${distribution.entryCount ?? 0}`,
              `- release要否: ${plan.state === "release" || plan.state === "bump-then-release" || plan.state === "ready" ? "必要" : "不要"}`,
              `- release判定理由: ${Array.isArray(plan.reasons) && plan.reasons.length > 0 ? plan.reasons.join(" / ") : "理由なし"}`,
              "",
              "## release計画",
              "",
              "~~~json",
              planText.trim(),
              "~~~",
              "",
              "## release note候補",
              "",
              notes.trim(),
              "",
              "## npm pack対象",
              "",
              files,
              "",
              stopped
                ? "外部更新は未実行です。理由を確認し、必要なら新しいrunで再計画してください。"
                : "検証だけが完了し、version bump PR・Git tag・GitHub Releaseは後続jobで個別に記録します。",
              "",
            ].join("\n"),
          );
          NODE
      - name: 不正なrelease計画で外部更新を停止する
        if: always()
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_STATE: ${{ steps.plan_outputs.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          const event = process.env.RELEASE_EVENT;
          const state = process.env.RELEASE_STATE;
          if (event === "push" && !["release", "bump-then-release", "skipped"].includes(state ?? "")) process.exit(1);
          if (event === "workflow_dispatch" && !["ready", "dry-run"].includes(state ?? "")) process.exit(1);
          NODE

  bump_version:
    name: version bumpをPR経由でmainへ反映する
    needs: validate
    if: ${{ github.event_name == 'push' && needs.validate.outputs.state == 'bump-then-release' && needs.validate.outputs.needs_version_bump == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      state: ${{ steps.bump_status.outputs.state }}
      release_sha: ${{ steps.bump_status.outputs.release_sha }}
      pr_url: ${{ steps.bump_operation.outputs.pr_url }}
    steps:
      - name: PATでmainの最新状態を取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_MAIN_PAT }}
      - name: Node.js実行環境を準備する
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: PoC隔離実行に必要なbubblewrapを導入する
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: bump branchとPRを作成してadmin mergeする
        id: bump_operation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_MAIN_PAT }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          branch="release/bump-v$RELEASE_VERSION"
          git fetch origin main
          main_version="$(git show "origin/main:package.json" | node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).version)')"
          if [ "$main_version" = "$RELEASE_VERSION" ]; then
            git switch --detach origin/main
            pr_url="$(gh pr list --head "$branch" --base main --state all --json url --jq '.[0].url')"
          else
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git fetch origin "$branch"
              git switch --detach FETCH_HEAD
            else
              git switch --create "$branch" origin/main
              npm version "$RELEASE_VERSION" --no-git-tag-version
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package.json package-lock.json
              git commit --message "chore(release): bump version to $RELEASE_VERSION [skip ci]"
              git push origin "HEAD:refs/heads/$branch"
            fi
          fi
          observed_version="$(node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')"
          if [ "$observed_version" != "$RELEASE_VERSION" ]; then
            exit 1
          fi
          npm ci
          npm run project:quality
          npm run quality
          npm run build
          npm run docs:format
          npm run test:format
          npm run trace:check
          npm run architecture:check
          npm run conformance:check
          npm run package:check
          if [ "$main_version" != "$RELEASE_VERSION" ]; then
            pr_url="$(gh pr list --head "$branch" --base main --state open --json url --jq '.[0].url')"
            if [ -z "$pr_url" ]; then
              pr_url="$(gh pr create --base main --head "$branch" --title "chore(release): bump version to $RELEASE_VERSION [skip ci]" --body "自動releaseのため、package.jsonを正本としてversionを$RELEASE_VERSIONへ更新します。")"
            fi
            gh pr edit "$pr_url" --title "chore(release): bump version to $RELEASE_VERSION [skip ci]"
            gh pr merge "$pr_url" --admin --merge
          fi
          printf 'pr_url=%s\n' "$pr_url" >> "$GITHUB_OUTPUT"
      - name: merge後のmain SHAとversionを読み直す
        id: bump_status
        if: always()
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          BUMP_OPERATION_OUTCOME: ${{ steps.bump_operation.outcome }}
        run: |
          git fetch origin main
          release_sha="$(git rev-parse origin/main)"
          export RELEASE_SHA="$release_sha"
          git show "$release_sha:package.json" > released-package.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          if (!output) process.exit(1);
          const metadata = JSON.parse(fs.readFileSync("released-package.json", "utf8"));
          const succeeded = process.env.BUMP_OPERATION_OUTCOME === "success" && metadata.version === process.env.RELEASE_VERSION;
          fs.appendFileSync(output, `state=${succeeded ? "succeeded" : "failed"}\nrelease_sha=${succeeded ? process.env.RELEASE_SHA ?? "" : ""}\n`);
          NODE
      - name: version bump PRの結果と復旧方法を記録する
        if: always()
        env:
          BUMP_STATE: ${{ steps.bump_status.outputs.state }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PR_URL: ${{ steps.bump_operation.outputs.pr_url }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const succeeded = process.env.BUMP_STATE === "succeeded";
          fs.appendFileSync(summary, [
            "# version bump PRの結果",
            "",
            `- version: ${process.env.RELEASE_VERSION ?? "不明"}`,
            `- PR: ${process.env.PR_URL || "作成または取得できず"}`,
            `- 状態: ${succeeded ? "succeeded" : "failed"}`,
            succeeded ? "- 完了: 品質gate、bump branch、PR、admin merge、main再読取" : "- 完了: workflow summaryに記録済みの操作まで",
            succeeded ? "- 未完了: Git tag、GitHub Release" : "- 未完了: PR merge、Git tag、GitHub Release",
            succeeded ? "- 復旧: mainのversionと後続tag・Releaseを確認する" : "- 復旧: branchとPRの実状態を確認し、同じrunを再実行する",
            "",
          ].join("\n"));
          NODE
      - name: bump PR未確認時に後続releaseを停止する
        if: always()
        env:
          BUMP_STATE: ${{ steps.bump_status.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.BUMP_STATE !== "succeeded") process.exit(1);
          NODE

  tag:
    name: 検証済みcommitへGit tagを冪等に作成する
    needs: [validate, bump_version]
    if: >-
      ${{ always() &&
          (needs.validate.outputs.state == 'ready' ||
           needs.validate.outputs.state == 'release' ||
           needs.validate.outputs.state == 'bump-then-release') &&
          (needs.validate.outputs.needs_version_bump != 'true' ||
           needs.bump_version.outputs.state == 'succeeded') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      state: ${{ steps.tag_status.outputs.state }}
      release_sha: ${{ steps.release_target.outputs.release_sha }}
    steps:
      - name: release対象SHAをbump結果から解決する
        id: release_target
        env:
          BUMP_REQUIRED: ${{ needs.validate.outputs.needs_version_bump }}
          BUMP_SHA: ${{ needs.bump_version.outputs.release_sha }}
          ORIGINAL_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          if (!output) process.exit(1);
          const releaseSha = process.env.BUMP_REQUIRED === "true" ? process.env.BUMP_SHA : process.env.ORIGINAL_SHA;
          if (!releaseSha) process.exit(1);
          fs.appendFileSync(output, `release_sha=${releaseSha}\n`);
          NODE
      - name: 検証済みrelease対象commitを取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release_target.outputs.release_sha }}
      - name: remote確認後に注釈付きtagを必要な場合だけ作成する
        id: tag_operation
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ steps.release_target.outputs.release_sha }}
        run: |
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" > tag-before.txt
          if [ ! -s tag-before.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: remote tagのSHAを読み直す
        id: tag_status
        if: always()
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ steps.release_target.outputs.release_sha }}
        run: |
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" > tag-after.txt || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          const expected = process.env.RELEASE_SHA;
          const tag = process.env.RELEASE_TAG;
          if (!output || !expected || !tag) process.exit(1);
          const lines = fs.readFileSync("tag-after.txt", "utf8").trim().split(/\r?\n/).filter(Boolean);
          const peeled = lines.find((line) => line.endsWith(`refs/tags/${tag}^{}`));
          const direct = lines.find((line) => line.endsWith(`refs/tags/${tag}`));
          const observed = (peeled ?? direct ?? "").split(/\s+/)[0] ?? "";
          fs.appendFileSync(output, `state=${observed === expected ? "succeeded" : "failed"}\n`);
          NODE
      - name: Git tag操作結果と復旧方法を記録する
        if: always()
        env:
          TAG_STATE: ${{ steps.tag_status.outputs.state }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const succeeded = process.env.TAG_STATE === "succeeded";
          fs.appendFileSync(summary, [
            "# Git tag操作結果",
            "",
            `- tag: ${process.env.RELEASE_TAG ?? "不明"}`,
            `- 状態: ${succeeded ? "succeeded" : "failed"}`,
            succeeded ? "- 完了: validate、必要なversion bump、Git tag" : "- 完了: validateとsummary記録済みの操作まで",
            succeeded ? "- 未完了: GitHub Release" : "- 未完了: Git tag、GitHub Release",
            succeeded ? "- 復旧: 同じSHAのtagは再作成せず後続へ進む" : "- 復旧: remote tagの有無とSHAを確認して新しいrunで再計画する",
            "",
          ].join("\n"));
          NODE
      - name: tag未確認時に成功報告を拒否する
        if: always()
        env:
          TAG_STATE: ${{ steps.tag_status.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.TAG_STATE !== "succeeded") process.exit(1);
          NODE

  github_release:
    name: GitHub Releaseを冪等に作成する
    needs: [validate, tag]
    if: ${{ always() && needs.tag.outputs.state == 'succeeded' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      state: ${{ steps.release_status.outputs.state }}
    steps:
      - name: tag作成済みcommitを取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.release_sha }}
          persist-credentials: false
      - name: 公開用release noteを生成する
        env:
          RELEASE_SHA: ${{ needs.tag.outputs.release_sha }}
          DISTRIBUTION_DIGEST: ${{ needs.validate.outputs.distribution_digest }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_SHA^" 2>/dev/null || true)"
          {
            printf '# 変更内容\n\n'
            if [ -n "$previous_tag" ]; then
              git log "$previous_tag..$RELEASE_SHA" --pretty='- %s (%h)'
            else
              git log "$RELEASE_SHA" --pretty='- %s (%h)'
            fi
            printf '\n\n## 配布digest（参考情報）\n\n'
            printf -- '- digest: %s\n' "${DISTRIBUTION_DIGEST:-算出なし}"
            printf -- '- 判定の正本は対象tagの配布物から再計算したdigestであり、GitHub Release本文ではありません。\n'
          } > release-notes.md
      - name: GitHub Releaseを必要な場合だけ作成する
        id: release_operation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json tagName,name,url > release-before.json 2>/dev/null; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
      - name: GitHub Releaseを読み直す
        id: release_observation
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --json tagName,name,url > release-after.json
      - name: GitHub Releaseの状態を確定する
        id: release_status
        if: always()
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          if (!output) process.exit(1);
          let state = "failed";
          try {
            const observed = JSON.parse(fs.readFileSync("release-after.json", "utf8"));
            state = observed.tagName === process.env.RELEASE_TAG && observed.name === process.env.RELEASE_TAG ? "succeeded" : "failed";
          } catch {
            state = "failed";
          }
          fs.appendFileSync(output, `state=${state}\n`);
          NODE
      - name: GitHub Release操作結果と復旧方法を記録する
        if: always()
        env:
          RELEASE_STATE: ${{ steps.release_status.outputs.state }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_EVENT: ${{ github.event_name }}
          NPM_ENABLED: ${{ needs.validate.outputs.npm_enabled }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const succeeded = process.env.RELEASE_STATE === "succeeded";
          fs.appendFileSync(summary, [
            "# GitHub Release操作結果",
            "",
            `- tag・Release名: ${process.env.RELEASE_TAG ?? "不明"}`,
            `- 状態: ${succeeded ? "succeeded" : "failed"}`,
            succeeded ? "- 完了: validate、必要なversion bump、Git tag、GitHub Release" : "- 完了: validate、必要なversion bump、Git tag",
            succeeded && process.env.RELEASE_EVENT === "push"
              ? "- 未実行: npm公開（自動経路では常に無効）"
              : succeeded && process.env.NPM_ENABLED === "true"
                ? "- 未完了: npm公開（environment承認待ち）"
                : succeeded
                  ? "- 未実行: npm公開（手動入力なし）"
                  : "- 未完了: GitHub Release",
            succeeded ? "- 復旧: 同名Releaseは再作成せず成功として扱う" : "- 復旧: Releaseの有無を確認し、存在しなければ新しいrunで再実行する",
            "",
          ].join("\n"));
          NODE
      - name: Release未確認時に成功報告を拒否する
        if: always()
        env:
          RELEASE_STATE: ${{ steps.release_status.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.RELEASE_STATE !== "succeeded") process.exit(1);
          NODE

  npm_publish:
    name: 手動承認後にnpm packageを公開する
    needs: [validate, tag, github_release]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.publish_npm == true &&
          needs.validate.outputs.state == 'ready' &&
          needs.validate.outputs.npm_enabled == 'true' &&
          needs.tag.outputs.state == 'succeeded' &&
          needs.github_release.outputs.state == 'succeeded' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: release tagの内容を取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - name: npm公開用Node.js実行環境を準備する
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: PoC隔離実行に必要なbubblewrapを導入する
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: 固定ファイルどおりに公開用依存を導入する
        run: npm ci
      - name: tag内容で全release gateを再検証する
        run: npm run verify:distribution
      - name: 検査対象のnpm artifactを一度だけ作成する
        id: pack_artifact
        run: |
          mkdir -p ./release-artifact
          npm pack --json --pack-destination=./release-artifact > "$RUNNER_TEMP/pack-result.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const output = process.env.GITHUB_OUTPUT;
          if (!output) process.exit(1);
          const packed = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pack-result.json`, "utf8"));
          const filename = Array.isArray(packed) && packed.length === 1
            ? packed[0]?.filename
            : undefined;
          if (typeof filename !== "string" || !filename.endsWith(".tgz") || /[\r\n]/u.test(filename) || path.basename(filename) !== filename) process.exit(1);
          const tarballPath = path.join("release-artifact", filename);
          if (!fs.statSync(tarballPath).isFile()) process.exit(1);
          fs.appendFileSync(output, `tarball_path=${tarballPath}\n`);
          NODE
      - name: 配布artifactのconsumer acceptanceを検証する
        id: consumer_acceptance
        env:
          TARBALL_PATH: ${{ steps.pack_artifact.outputs.tarball_path }}
        run: |
          if [ -z "$TARBALL_PATH" ]; then exit 1; fi
          node --import tsx scripts/check_consumer_acceptance.ts --tarball="$TARBALL_PATH" --mechanisms=git-dependency,packed-bin,scale-output
          node --import tsx scripts/compute_distribution_digest.ts > "$RUNNER_TEMP/distribution-digest.json"
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          const tarballPath = process.env.TARBALL_PATH;
          if (!output || !tarballPath) process.exit(1);
          const artifactSha256 = crypto.createHash("sha256").update(fs.readFileSync(tarballPath)).digest("hex");
          const distribution = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/distribution-digest.json`, "utf8"));
          if (!distribution || typeof distribution.digest !== "string" || !/^[a-f0-9]{64}$/u.test(distribution.digest)) process.exit(1);
          fs.appendFileSync(output, [
            `artifact_sha256=${artifactSha256}`,
            `distribution_digest=${distribution.digest}`,
            "",
          ].join("\n"));
          NODE
      - name: 検査済みartifactの同一性を公開直前に再検証する
        id: verify_identity
        env:
          TARBALL_PATH: ${{ steps.pack_artifact.outputs.tarball_path }}
          ACCEPTED_ARTIFACT_SHA256: ${{ steps.consumer_acceptance.outputs.artifact_sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          const tarballPath = process.env.TARBALL_PATH;
          const accepted = process.env.ACCEPTED_ARTIFACT_SHA256;
          if (!tarballPath || !accepted || !/^[a-f0-9]{64}$/u.test(accepted)) process.exit(1);
          const publication = crypto.createHash("sha256").update(fs.readFileSync(tarballPath)).digest("hex");
          if (publication !== accepted) process.exit(1);
          NODE
      - name: 明示承認されたpackageをprovenance付きで公開する
        id: npm_operation
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL_PATH: ${{ steps.pack_artifact.outputs.tarball_path }}
        run: npm publish --provenance --access public "$TARBALL_PATH"
      - name: npm registryの公開versionを読み直す
        id: npm_observation
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: npm view "agent-skill-chain@$RELEASE_VERSION" version --json > npm-after.json
      - name: npm公開状態を確定する
        id: npm_status
        if: always()
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          NPM_OPERATION_OUTCOME: ${{ steps.npm_operation.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          if (!output) process.exit(1);
          let state = "failed";
          try {
            const observed = JSON.parse(fs.readFileSync("npm-after.json", "utf8"));
            state = process.env.NPM_OPERATION_OUTCOME === "success" && observed === process.env.RELEASE_VERSION ? "succeeded" : "failed";
          } catch {
            state = "failed";
          }
          fs.appendFileSync(output, `state=${state}\n`);
          NODE
      - name: npm公開結果と復旧方法を記録する
        if: always()
        env:
          NPM_STATE: ${{ steps.npm_status.outputs.state }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const succeeded = process.env.NPM_STATE === "succeeded";
          fs.appendFileSync(summary, [
            "# npm公開操作結果",
            "",
            `- version: ${process.env.RELEASE_VERSION ?? "不明"}`,
            `- 状態: ${succeeded ? "succeeded" : "failed"}`,
            succeeded ? "- 完了: Git tag、GitHub Release、npm公開" : "- 完了: Git tag、GitHub Release",
            succeeded ? "- 未完了: なし" : "- 未完了: npm公開",
            succeeded ? "- 復旧: 公開済みversionは削除せずnpm deprecateで利用非推奨理由と代替versionを案内する" : "- 復旧: registryでversionの有無を再確認し、未公開なら原因解消後に新しいrunで再計画する",
            "",
          ].join("\n"));
          NODE
      - name: npm公開未確認時に成功報告を拒否する
        if: always()
        env:
          NPM_STATE: ${{ steps.npm_status.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.NPM_STATE !== "succeeded") process.exit(1);
          NODE
