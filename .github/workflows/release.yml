name: 自動・手動release

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 作成するrelease version（package.jsonのversionはrelease追随をやめたsentinelであり、一致は要求しない）
        required: true
        type: string
      dry_run:
        description: 外部更新を行わず計画だけを確認する
        required: true
        type: boolean
        default: true

concurrency:
  group: main-mutator
  cancel-in-progress: false

# 既定は読取専用とし、外部更新jobだけがjob単位で権限を追加する。
permissions:
  contents: read

jobs:
  validate:
    name: 自動・手動release候補を検証する
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      state: ${{ steps.plan_outputs.outputs.state }}
      version: ${{ steps.plan_outputs.outputs.version }}
      tag: ${{ steps.plan_outputs.outputs.tag }}
      needs_version_bump: ${{ steps.plan_outputs.outputs.needs_version_bump }}
      release_sha: ${{ steps.plan_outputs.outputs.release_sha }}
      distribution_digest: ${{ steps.plan_outputs.outputs.distribution_digest }}
      distribution_entry_count: ${{ steps.plan_outputs.outputs.distribution_entry_count }}
    steps:
      - name: release候補のcommitを取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # 重い導入とgateの前に置く。追い越されたrunと、既定branchのmerge commitでない
      # trigger commitを、費用を払う前に落とす。
      - name: 後続のmain更新に追い越されたrunを停止する
        env:
          EVENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$RELEASE_EVENT" != "push" ]; then
            echo "手動releaseはtrigger SHA照合の対象外である"
            exit 0
          fi
          remote_sha="$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)"
          if [ -z "$remote_sha" ]; then
            echo "remote既定branch tipを読み取れなかったため停止する" >&2
            exit 1
          fi
          if [ "$remote_sha" != "$EVENT_SHA" ]; then
            echo "trigger SHA $EVENT_SHA はremote既定branch tip $remote_sha と異なる。後続のmain更新が最新runで回収するため停止する" >&2
            exit 1
          fi
          echo "trigger SHA $EVENT_SHA はremote既定branch tipと一致する"
      - name: release対象commitがmerge commitであることを確認する
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$RELEASE_EVENT" != "push" ]; then
            echo "手動releaseは親数判定の対象外である"
            exit 0
          fi
          parents="$(git rev-list --parents -n 1 "$EVENT_SHA" | wc -w)"
          if [ "$parents" != "3" ]; then
            echo "release対象commit $EVENT_SHA の親が2つではないため停止する（観測 $((parents - 1)) 個）" >&2
            exit 1
          fi
          echo "release対象commit $EVENT_SHA の親は2つである"
      - name: Node.js実行環境を準備する
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: PoC隔離実行に必要なbubblewrapを準備する
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apparmor-profiles \
            bubblewrap
          test -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo apparmor_parser -r \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          /usr/bin/bwrap \
            --unshare-all \
            --die-with-parent \
            --new-session \
            --ro-bind / / \
            -- /bin/true
      - name: 固定ファイルどおりに依存を導入する
        run: npm ci
      - name: 全Gherkin・型・build・package contentsを必須gateで検証する
        run: npm run verify:distribution
      - name: 既存tagをrelease計画用に取得する
        run: git tag --list > existing-tags.txt
      # 手動releaseでもbuild_distributionのcontentDigestとして必要になったため、
      # push限定をやめて常に算出する（自動release計画の差分比較にも使う既存用途は
      # 変えない、独立review REV-04是正）。
      - name: 現在の配布digestを算出する
        run: node --import tsx scripts/compute_distribution_digest.ts > distribution-digest.json
      - name: 直前releaseの配布digestを算出する
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        run: |
          printf '{"digest":"","entryCount":0,"errors":[]}\n' > previous-distribution-digest.json
          version="$(node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')"
          previous_tag="v$version"
          if ! git rev-parse --verify "refs/tags/$previous_tag" >/dev/null 2>&1; then
            exit 0
          fi
          if ! git worktree add --detach ../previous-release "$previous_tag"; then
            exit 0
          fi
          if ! (cd ../previous-release && npm ci --ignore-scripts && npm run build); then
            exit 0
          fi
          if node --import tsx scripts/compute_distribution_digest.ts --cwd ../previous-release > previous-distribution-digest-candidate.json; then
            cp previous-distribution-digest-candidate.json previous-distribution-digest.json
          fi
      - name: 純関数で自動release計画を作成する
        id: auto_release_plan
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          RELEASE_MODE: auto
          RELEASE_EXISTING_TAGS_FILE: existing-tags.txt
          RELEASE_DISTRIBUTION_DIGEST_FILE: distribution-digest.json
          RELEASE_PREVIOUS_DISTRIBUTION_DIGEST_FILE: previous-distribution-digest.json
          RELEASE_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node --import tsx scripts/plan_release.ts > release-plan.json
      - name: 純関数で手動release計画を作成する
        id: manual_release_plan
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        env:
          RELEASE_REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_SHA: ${{ github.sha }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_EXISTING_TAGS_FILE: existing-tags.txt
          RELEASE_GATES_JSON: >-
            [{"name":"quality","passed":true},{"name":"build","passed":true},{"name":"package","passed":true},{"name":"test","passed":true},{"name":"typecheck","passed":true}]
        run: node --import tsx scripts/plan_release.ts > release-plan.json
      - name: release計画を後続jobへ渡す
        id: plan_outputs
        if: always()
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          if (!output || !fs.existsSync("release-plan.json")) process.exit(1);
          const plan = JSON.parse(fs.readFileSync("release-plan.json", "utf8"));
          const distribution = fs.existsSync("distribution-digest.json")
            ? JSON.parse(fs.readFileSync("distribution-digest.json", "utf8"))
            : { digest: "", entryCount: 0 };
          fs.appendFileSync(
            output,
            [
              `state=${plan.state}`,
              `version=${plan.version}`,
              `tag=${plan.tag}`,
              `needs_version_bump=${plan.needsVersionBump === true}`,
              `release_sha=${process.env.RELEASE_SHA ?? ""}`,
              `distribution_digest=${distribution.digest ?? ""}`,
              `distribution_entry_count=${distribution.entryCount ?? 0}`,
              "",
            ].join("\n"),
          );
          NODE
      - name: release note候補を生成する
        if: always()
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_SHA^" 2>/dev/null || true)"
          {
            printf '# 変更内容\n\n'
            if [ -n "$previous_tag" ]; then
              git log "$previous_tag..$RELEASE_SHA" --pretty='- %s (%h)'
            else
              git log "$RELEASE_SHA" --pretty='- %s (%h)'
            fi
          } > release-notes.md
      - name: npm pack対象をdry-runで取得する
        if: always()
        run: npm pack --dry-run --json --ignore-scripts > npm-pack.json
      - name: 自動・手動release計画と未完了操作を記録する
        if: always()
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const planText = fs.existsSync("release-plan.json")
            ? fs.readFileSync("release-plan.json", "utf8")
            : '{"state":"failed","reasons":["release計画を生成できませんでした"]}';
          const plan = JSON.parse(planText);
          const notes = fs.existsSync("release-notes.md")
            ? fs.readFileSync("release-notes.md", "utf8")
            : "release noteを生成できませんでした";
          const pack = fs.existsSync("npm-pack.json")
            ? JSON.parse(fs.readFileSync("npm-pack.json", "utf8"))
            : [];
          const files = pack[0]?.files?.map(({ path }) => `- ${path}`).join("\n") ?? "- 取得失敗";
          const distribution = fs.existsSync("distribution-digest.json")
            ? JSON.parse(fs.readFileSync("distribution-digest.json", "utf8"))
            : { digest: "", entryCount: 0 };
          const previousDistribution = fs.existsSync("previous-distribution-digest.json")
            ? JSON.parse(fs.readFileSync("previous-distribution-digest.json", "utf8"))
            : { digest: "" };
          const packageMetadata = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const previousTag = `v${packageMetadata.version}`;
          const stopped = plan.state === "dry-run" || plan.state === "skipped" || plan.state === "rejected";
          fs.appendFileSync(
            summary,
            [
              "# release候補の検証結果",
              "",
              `- 契機: ${process.env.RELEASE_EVENT ?? "不明"}`,
              `- 状態: ${plan.state ?? "failed"}`,
              `- version: ${plan.version ?? "不明"}`,
              `- tag: ${plan.tag ?? "不明"}`,
              `- version bump: ${plan.needsVersionBump === true ? "必要" : "不要"}`,
              `- npm公開: ${process.env.RELEASE_EVENT === "workflow_dispatch" && plan.stages?.some(({ stage, enabled }) => stage === "npm_publish" && enabled) ? "手動経路で要求済み" : "未実行"}`,
              `- 現在の配布digest: ${distribution.digest || "算出なし"}`,
              `- 直前release: ${previousDistribution.digest ? `${previousTag} / ${previousDistribution.digest}` : `${previousTag}の配布digestなし`}`,
              `- 配布file件数: ${distribution.entryCount ?? 0}`,
              `- release要否: ${plan.state === "release" || plan.state === "ready" ? "必要" : "不要"}`,
              `- release判定理由: ${Array.isArray(plan.reasons) && plan.reasons.length > 0 ? plan.reasons.join(" / ") : "理由なし"}`,
              "",
              "## release計画",
              "",
              "~~~json",
              planText.trim(),
              "~~~",
              "",
              "## release note候補",
              "",
              notes.trim(),
              "",
              "## npm pack対象",
              "",
              files,
              "",
              stopped
                ? "外部更新は未実行です。理由を確認し、必要なら新しいrunで再計画してください。"
                : "検証だけが完了し、Git tagとGitHub Releaseは後続jobで個別に記録します。既定branchへは書き込みません。",
              "",
            ].join("\n"),
          );
          NODE
      - name: 不正なrelease計画で外部更新を停止する
        if: always()
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_STATE: ${{ steps.plan_outputs.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          const event = process.env.RELEASE_EVENT;
          const state = process.env.RELEASE_STATE;
          if (event === "push" && !["release", "skipped"].includes(state ?? "")) process.exit(1);
          if (event === "workflow_dispatch" && !["ready", "dry-run"].includes(state ?? "")) process.exit(1);
          NODE
      # packed-binとscale-outputはpackage:checkから毎回実行されるが、git-dependencyだけは
      # どのreleaseでも実行されていなかった。tag自体がnpx github:#<tag>の配布アドレスに
      # なるため、tag作成より前で止める（Issue #1216）。
      - name: 検査対象のrelease artifactを作成する
        id: pack_release_artifact
        run: |
          set -euo pipefail
          TARBALL_PATH="$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -n 1)"
          test -n "$TARBALL_PATH"
          printf 'tarball_path=%s\n' "$RUNNER_TEMP/$TARBALL_PATH" >> "$GITHUB_OUTPUT"
      - name: 実Git依存でのconsumer acceptanceを検証する
        env:
          TARBALL_PATH: ${{ steps.pack_release_artifact.outputs.tarball_path }}
        run: |
          set -euo pipefail
          test -n "$TARBALL_PATH"
          node --import tsx scripts/check_consumer_acceptance.ts \
            --tarball="$TARBALL_PATH" --mechanisms=git-dependency

  build_distribution:
    name: 検証済み計画から配布物を1度だけ生成する
    needs: validate
    if: >-
      ${{ needs.validate.result == 'success' &&
          (needs.validate.outputs.state == 'ready' ||
           needs.validate.outputs.state == 'release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 既存validateと同じ権限levelを維持する。配布物を生成するだけであり、
    # tagやGitHub Releaseへの書き込み権限は持たせない（02 §2.3）。
    permissions:
      contents: read
    outputs:
      state: ${{ steps.distribution_status.outputs.state }}
      packed_artifact_sha256: ${{ steps.hash_after_pack.outputs.sha256 }}
      accepted_artifact_sha256: ${{ steps.hash_after_acceptance.outputs.sha256 }}
    steps:
      - name: release対象commitを取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false
      - name: Node.js実行環境を準備する
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: release対象commitのための一時treeを追加する
        run: git worktree add --detach ../release-distribution HEAD
      - name: release計画を一時fileへ書き出す
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          CONTENT_DIGEST: ${{ needs.validate.outputs.distribution_digest }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          fs.writeFileSync(
            "release-plan-for-materialize.json",
            `${JSON.stringify({
              version: process.env.RELEASE_VERSION,
              tag: process.env.RELEASE_TAG,
              sourceSha: process.env.RELEASE_SHA,
              contentDigest: process.env.CONTENT_DIGEST,
            })}\n`,
          );
          NODE
      - name: 固定ファイルどおりに依存を導入する
        run: npm ci
      - name: 一時treeへversionとrelease identityを書き込む
        run: |
          node --import tsx scripts/materialize_release.ts \
            --plan=release-plan-for-materialize.json \
            --target=../release-distribution
      - name: 一時treeで依存を導入しbuildする
        working-directory: ../release-distribution
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: version付与前後で配布digestが不変であることを確認する
        working-directory: ../release-distribution
        env:
          EXPECTED_DIGEST: ${{ needs.validate.outputs.distribution_digest }}
        run: |
          node --import tsx scripts/compute_distribution_digest.ts > distribution-digest-after.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const after = JSON.parse(fs.readFileSync("distribution-digest-after.json", "utf8"));
          const expected = process.env.EXPECTED_DIGEST ?? "";
          if (!after.digest || after.digest !== expected) {
            console.error(`配布digestがversion付与前後で変化しました: before=${expected} after=${after.digest ?? ""}`);
            process.exit(1);
          }
          NODE
      - name: release artifactを固定名でpackする
        id: pack_release_artifact
        working-directory: ../release-distribution
        run: |
          set -euo pipefail
          TARBALL_PATH="$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -n 1)"
          test -n "$TARBALL_PATH"
          mv "$RUNNER_TEMP/$TARBALL_PATH" "$RUNNER_TEMP/agent-skill-chain.tgz"
          printf 'tarball_path=%s\n' "$RUNNER_TEMP/agent-skill-chain.tgz" >> "$GITHUB_OUTPUT"
      - name: pack直後のartifact digestを記録する
        id: hash_after_pack
        env:
          TARBALL_PATH: ${{ steps.pack_release_artifact.outputs.tarball_path }}
        run: |
          set -euo pipefail
          digest="$(sha256sum "$TARBALL_PATH" | cut -d ' ' -f1)"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: release-identity consumer acceptanceを検証する
        id: release_identity_acceptance
        env:
          TARBALL_PATH: ${{ steps.pack_release_artifact.outputs.tarball_path }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node --import tsx scripts/check_consumer_acceptance.ts \
            --tarball="$TARBALL_PATH" --mechanisms=release-identity \
            --expected-version="$EXPECTED_VERSION"
      - name: acceptance直後のartifact digestを記録する
        id: hash_after_acceptance
        if: always()
        env:
          TARBALL_PATH: ${{ steps.pack_release_artifact.outputs.tarball_path }}
        run: |
          set -euo pipefail
          digest="$(sha256sum "$TARBALL_PATH" | cut -d ' ' -f1)"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Actions artifactとしてrelease tgzをuploadする
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-skill-chain-release-tgz
          path: ${{ steps.pack_release_artifact.outputs.tarball_path }}
          retention-days: 14
          if-no-files-found: error
      # **byte一致だけでなくacceptance step自身の結果も見る。**
      # `hash_after_acceptance`は`if: always()`のためacceptance失敗後も実行され、
      # 同じtarballを再hashするだけなのでbyte一致は失敗時も成立してしまう
      # （独立review REV-14指摘）。
      - name: 配布物生成状態を確定する
        id: distribution_status
        if: always()
        env:
          PACKED_SHA: ${{ steps.hash_after_pack.outputs.sha256 }}
          ACCEPTED_SHA: ${{ steps.hash_after_acceptance.outputs.sha256 }}
          ACCEPTANCE_OUTCOME: ${{ steps.release_identity_acceptance.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          if (!output) process.exit(1);
          const packed = process.env.PACKED_SHA ?? "";
          const accepted = process.env.ACCEPTED_SHA ?? "";
          const digestsMatch = /^[a-f0-9]{64}$/.test(packed) && packed === accepted;
          const acceptancePassed = process.env.ACCEPTANCE_OUTCOME === "success";
          const succeeded = digestsMatch && acceptancePassed;
          fs.appendFileSync(output, `state=${succeeded ? "succeeded" : "failed"}\n`);
          NODE
      - name: 配布物生成結果を記録する
        if: always()
        env:
          DISTRIBUTION_STATE: ${{ steps.distribution_status.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const succeeded = process.env.DISTRIBUTION_STATE === "succeeded";
          fs.appendFileSync(summary, [
            "# 配布物生成結果",
            "",
            `- 状態: ${succeeded ? "succeeded" : "failed"}`,
            succeeded
              ? "- 完了: 配布物生成、release-identity consumer acceptance"
              : "- 未完了: 配布物生成またはrelease-identity consumer acceptance",
            "",
          ].join("\n"));
          NODE
      - name: 配布物生成未確認時に成功報告を拒否する
        if: always()
        env:
          DISTRIBUTION_STATE: ${{ steps.distribution_status.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.DISTRIBUTION_STATE !== "succeeded") process.exit(1);
          NODE

  tag:
    name: 検証済みcommitへGit tagを冪等に作成する
    needs: [validate, build_distribution]
    # validateのstate出力はconsumer acceptanceより前に書かれる。always()と保存済みstateだけ
    # では、acceptanceが落ちてvalidateがfailureになってもtagが作られる（Issue #1216 F-01）。
    # job結果そのものを要求する。build_distributionの成功（配布物生成とrelease-identity
    # acceptanceの両方）も同様にtagより前へ要求する（owner確定入力2）。
    if: >-
      ${{ needs.validate.result == 'success' &&
          needs.build_distribution.result == 'success' &&
          (needs.validate.outputs.state == 'ready' ||
           needs.validate.outputs.state == 'release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      state: ${{ steps.tag_status.outputs.state }}
      release_sha: ${{ steps.release_target.outputs.release_sha }}
    steps:
      - name: release対象SHAを検証結果から解決する
        id: release_target
        env:
          ORIGINAL_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          if (!output) process.exit(1);
          const releaseSha = process.env.ORIGINAL_SHA;
          if (!releaseSha) process.exit(1);
          fs.appendFileSync(output, `release_sha=${releaseSha}\n`);
          NODE
      - name: 検証済みrelease対象commitを取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release_target.outputs.release_sha }}
      - name: tag書き込み直前にremote既定branch tipを読み直す
        env:
          RELEASE_SHA: ${{ steps.release_target.outputs.release_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$RELEASE_EVENT" != "push" ]; then
            echo "手動releaseはtrigger SHA照合の対象外である"
            exit 0
          fi
          remote_sha="$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)"
          if [ -z "$remote_sha" ]; then
            echo "remote既定branch tipを読み取れなかったため停止する" >&2
            exit 1
          fi
          if [ "$remote_sha" != "$RELEASE_SHA" ]; then
            echo "release対象SHA $RELEASE_SHA がremote既定branch tip $remote_sha と一致しないため停止する" >&2
            exit 1
          fi
      - name: remote確認後に注釈付きtagを必要な場合だけ作成する
        id: tag_operation
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ steps.release_target.outputs.release_sha }}
        run: |
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" > tag-before.txt
          if [ ! -s tag-before.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: remote tagのSHAを読み直す
        id: tag_status
        if: always()
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ steps.release_target.outputs.release_sha }}
        run: |
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" > tag-after.txt || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          const expected = process.env.RELEASE_SHA;
          const tag = process.env.RELEASE_TAG;
          if (!output || !expected || !tag) process.exit(1);
          const lines = fs.readFileSync("tag-after.txt", "utf8").trim().split(/\r?\n/).filter(Boolean);
          const peeled = lines.find((line) => line.endsWith(`refs/tags/${tag}^{}`));
          const direct = lines.find((line) => line.endsWith(`refs/tags/${tag}`));
          const observed = (peeled ?? direct ?? "").split(/\s+/)[0] ?? "";
          fs.appendFileSync(output, `state=${observed === expected ? "succeeded" : "failed"}\n`);
          NODE
      - name: Git tag操作結果と復旧方法を記録する
        if: always()
        env:
          TAG_STATE: ${{ steps.tag_status.outputs.state }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const succeeded = process.env.TAG_STATE === "succeeded";
          fs.appendFileSync(summary, [
            "# Git tag操作結果",
            "",
            `- tag: ${process.env.RELEASE_TAG ?? "不明"}`,
            `- 状態: ${succeeded ? "succeeded" : "failed"}`,
            succeeded ? "- 完了: validate、必要なversion bump、Git tag" : "- 完了: validateとsummary記録済みの操作まで",
            succeeded ? "- 未完了: GitHub Release" : "- 未完了: Git tag、GitHub Release",
            succeeded ? "- 復旧: 同じSHAのtagは再作成せず後続へ進む" : "- 復旧: remote tagの有無とSHAを確認して新しいrunで再計画する",
            "",
          ].join("\n"));
          NODE
      - name: tag未確認時に成功報告を拒否する
        if: always()
        env:
          TAG_STATE: ${{ steps.tag_status.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.TAG_STATE !== "succeeded") process.exit(1);
          NODE

  github_release:
    name: GitHub Releaseをdraft経由で冪等に公開する
    needs: [validate, tag, build_distribution]
    if: >-
      ${{ needs.validate.result == 'success' &&
          needs.tag.result == 'success' &&
          needs.build_distribution.result == 'success' &&
          needs.tag.outputs.state == 'succeeded' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      state: ${{ steps.release_status.outputs.state }}
    steps:
      - name: tag作成済みcommitを取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.release_sha }}
          persist-credentials: false
      - name: build_distributionが生成したtgzを取得する
        uses: actions/download-artifact@v4
        with:
          name: agent-skill-chain-release-tgz
          path: release-artifact
      - name: 公開用release noteを生成する
        env:
          RELEASE_SHA: ${{ needs.tag.outputs.release_sha }}
          DISTRIBUTION_DIGEST: ${{ needs.validate.outputs.distribution_digest }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_SHA^" 2>/dev/null || true)"
          {
            printf '# 変更内容\n\n'
            if [ -n "$previous_tag" ]; then
              git log "$previous_tag..$RELEASE_SHA" --pretty='- %s (%h)'
            else
              git log "$RELEASE_SHA" --pretty='- %s (%h)'
            fi
            printf '\n\n## 配布digest（参考情報）\n\n'
            printf -- '- digest: %s\n' "${DISTRIBUTION_DIGEST:-算出なし}"
            printf -- '- 判定の正本は対象tagの配布物から再計算したdigestであり、GitHub Release本文ではありません。\n'
          } > release-notes.md
      # 3分岐の冪等化（02 §6）: (1)Releaseなし→draft作成、(2)draftのまま存在→
      # 添付・照合・publishから再開、(3)publish済みでasset digest一致→既存資産を
      # 成功として扱う。**publish済みでasset digestが不一致または確認不能な場合は
      # 既存Releaseへ一切書き込まず停止する。** `--clobber`はdraftのまま存在する
      # 場合にだけ許可し、publish済みReleaseを上書きしない（独立review REV-03是正）。
      - name: GitHub Releaseの現在状態を確認する
        id: release_before
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --json tagName,name,url,isDraft,assets > release-before.json
      - name: 現在状態をmissing・draft・published-match・published-mismatchへ分類する
        id: release_phase
        if: always()
        env:
          TARBALL_PATH: release-artifact/agent-skill-chain.tgz
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          const output = process.env.GITHUB_OUTPUT;
          if (!output) process.exit(1);
          let before;
          try {
            before = JSON.parse(fs.readFileSync("release-before.json", "utf8"));
          } catch {
            before = null;
          }
          if (!before) {
            fs.appendFileSync(output, "phase=missing\n");
            process.exit(0);
          }
          if (before.isDraft !== false) {
            fs.appendFileSync(output, "phase=draft\n");
            process.exit(0);
          }
          const publishedAsset = (before.assets ?? []).find((asset) => asset.name === "agent-skill-chain.tgz");
          const localSha256 = crypto.createHash("sha256").update(fs.readFileSync(process.env.TARBALL_PATH)).digest("hex");
          const remoteDigest = publishedAsset?.digest ? String(publishedAsset.digest).replace("sha256:", "") : undefined;
          fs.appendFileSync(output, `phase=${remoteDigest && remoteDigest === localSha256 ? "published-match" : "published-mismatch"}\n`);
          NODE
      - name: publish済みでasset digestが不一致または確認不能な場合は停止する
        if: ${{ steps.release_phase.outputs.phase == 'published-mismatch' }}
        run: |
          echo "既存のpublish済みReleaseと生成物のasset digestが一致しないか確認できません。既存Releaseは変更していません。新しいpatch versionでtag・releaseをやり直してください。" >&2
          exit 1
      - name: draft releaseを必要な場合だけ作成する
        id: release_operation
        if: ${{ steps.release_phase.outputs.phase == 'missing' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
      - name: assetを未添付ならdraft releaseへ添付する
        id: attach_asset
        if: ${{ steps.release_phase.outputs.phase == 'missing' || steps.release_phase.outputs.phase == 'draft' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARBALL_PATH: release-artifact/agent-skill-chain.tgz
        run: gh release upload "$RELEASE_TAG" "$TARBALL_PATH" --clobber
      # **公開先から取得し直したbyte列をhashする。** ローカルの添付元fileを再hashする
      # だけでは、upload自体が壊れていても検査を通過してしまう
      # （独立review REV-02指摘、TOCTOU排除の実体化）。
      - name: 添付後のasset digestを公開先から取得し直して記録する
        id: hash_publication
        if: ${{ steps.release_phase.outputs.phase == 'missing' || steps.release_phase.outputs.phase == 'draft' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf publication-check
          mkdir publication-check
          gh release download "$RELEASE_TAG" --pattern agent-skill-chain.tgz --dir publication-check --clobber
          digest="$(sha256sum publication-check/agent-skill-chain.tgz | cut -d ' ' -f1)"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      # TOCTOU排除の要（FR-05）: pack直後・acceptance直後・公開先から取得し直した
      # asset の3者が一致した場合だけpublishする。既存evaluateArtifactIdentity
      # （無変更）を--verify-artifact-identityで呼び出す。
      # **値はenv:経由で渡す。** `run:`内の直接展開はこのfileの他stepの慣行から
      # 外れ、値がSHA-256 hex以外を持ちうる形へ将来変わった場合にinjection sinkに
      # なりうる（独立review REV-17指摘）。
      - name: pack・acceptance・公開先取得の3者artifact digest一致を検証する
        id: verify_identity
        if: ${{ steps.release_phase.outputs.phase == 'missing' || steps.release_phase.outputs.phase == 'draft' }}
        env:
          PACKED_SHA256: ${{ needs.build_distribution.outputs.packed_artifact_sha256 }}
          ACCEPTED_SHA256: ${{ needs.build_distribution.outputs.accepted_artifact_sha256 }}
          PUBLICATION_SHA256: ${{ steps.hash_publication.outputs.sha256 }}
        run: |
          node --import tsx scripts/check_consumer_acceptance.ts \
            --verify-artifact-identity \
            --packed-sha256="$PACKED_SHA256" \
            --accepted-sha256="$ACCEPTED_SHA256" \
            --publication-sha256="$PUBLICATION_SHA256"
      - name: 3者一致後にdraftをpublishする
        id: publish_release
        if: ${{ steps.release_phase.outputs.phase == 'missing' || steps.release_phase.outputs.phase == 'draft' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
      # **実際にrepository設定APIを読みに行く。** 取得不能はunknownとして報告し
      # jobを止めないが（R2、停止条件ではない）、試みずに常にunknownと決め打つと
      # 運用者が実際のenabled/disabledを知る手段が無くなる（独立review REV-06指摘）。
      - name: Immutable Releasesの設定状態を報告する
        id: immutable_releases_state
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(0);
          let state = "unknown";
          try {
            const raw = execFileSync("gh", ["api", `repos/${process.env.REPO}`], { encoding: "utf8" });
            const repo = JSON.parse(raw);
            const candidate =
              typeof repo?.immutable_releases_enabled === "boolean"
                ? repo.immutable_releases_enabled
                : typeof repo?.immutable_releases?.enabled === "boolean"
                  ? repo.immutable_releases.enabled
                  : undefined;
            if (typeof candidate === "boolean") state = candidate ? "enabled" : "disabled";
          } catch {
            state = "unknown";
          }
          const note = state === "unknown" ? "（repository設定APIから未取得。owner管理のrepository設定を別途確認してください）" : "";
          fs.appendFileSync(summary, [
            "",
            "## Immutable Releasesの設定状態",
            "",
            `- 状態: ${state}${note}`,
            "",
          ].join("\n"));
          NODE
      - name: GitHub Releaseを読み直す
        id: release_observation
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --json tagName,name,url,isDraft > release-after.json
      - name: GitHub Releaseの状態を確定する
        id: release_status
        if: always()
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_PHASE: ${{ steps.release_phase.outputs.phase }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          if (!output) process.exit(1);
          let state = "failed";
          if (process.env.RELEASE_PHASE !== "published-mismatch") {
            try {
              const observed = JSON.parse(fs.readFileSync("release-after.json", "utf8"));
              state = observed.tagName === process.env.RELEASE_TAG && observed.name === process.env.RELEASE_TAG && observed.isDraft === false ? "succeeded" : "failed";
            } catch {
              state = "failed";
            }
          }
          fs.appendFileSync(output, `state=${state}\n`);
          NODE
      - name: GitHub Release操作結果と復旧方法を記録する
        if: always()
        env:
          RELEASE_STATE: ${{ steps.release_status.outputs.state }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const succeeded = process.env.RELEASE_STATE === "succeeded";
          fs.appendFileSync(summary, [
            "# GitHub Release操作結果",
            "",
            `- tag・Release名: ${process.env.RELEASE_TAG ?? "不明"}`,
            `- 状態: ${succeeded ? "succeeded" : "failed"}`,
            succeeded ? "- 完了: validate、必要なversion bump、Git tag、配布物生成、GitHub Release publish" : "- 完了: validate、必要なversion bump、Git tag",
            succeeded ? "- npm公開: 経路そのものが存在しません" : "- 未完了: GitHub Release（draftのまま残る場合があります）",
            succeeded ? "- 復旧: 同名Releaseは再作成せず成功として扱う" : "- 復旧: draft releaseのasset digest一致を確認し、新しいrunで添付・照合・publishを再試行する",
            "",
          ].join("\n"));
          NODE
      - name: Release未確認時に成功報告を拒否する
        if: always()
        env:
          RELEASE_STATE: ${{ steps.release_status.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.RELEASE_STATE !== "succeeded") process.exit(1);
          NODE
