name: 手動release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: package.jsonと一致させるrelease version
        required: true
        type: string
      dry_run:
        description: 外部更新を行わず計画だけを確認する
        required: true
        type: boolean
        default: true
      publish_npm:
        description: 承認後にnpmへprovenance付きで公開する
        required: true
        type: boolean
        default: false

# 既定は読取専用とし、書込jobだけがjob単位で上書きする。通常のmain pushからは起動しない。
permissions:
  contents: read

jobs:
  validate:
    name: release候補と配布内容を検証する
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      state: ${{ steps.plan_outputs.outputs.state }}
      version: ${{ steps.plan_outputs.outputs.version }}
      tag: ${{ steps.plan_outputs.outputs.tag }}
      npm_enabled: ${{ steps.plan_outputs.outputs.npm_enabled }}
    steps:
      - name: 既定branchのrelease候補を取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node.js実行環境を準備する
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 固定ファイルどおりに依存を導入する
        run: npm ci
      - name: 全Gherkin・型・build・package contentsを必須gateで検証する
        run: npm run prepack
      - name: 既存tagをrelease計画用に取得する
        run: git tag --list > existing-tags.txt
      - name: 純関数でrelease計画を作成する
        id: release_plan
        continue-on-error: true
        env:
          RELEASE_REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_PUBLISH_NPM: ${{ inputs.publish_npm }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_SHA: ${{ github.sha }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_EXISTING_TAGS_FILE: existing-tags.txt
          RELEASE_GATES_JSON: >-
            [{"name":"quality","passed":true},{"name":"build","passed":true},{"name":"package","passed":true},{"name":"test","passed":true},{"name":"typecheck","passed":true}]
        run: node --import tsx scripts/plan_release.ts > release-plan.json
      - name: release計画を後続jobへ渡す
        id: plan_outputs
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          if (!output || !fs.existsSync("release-plan.json")) {
            process.exit(1);
          }
          const plan = JSON.parse(fs.readFileSync("release-plan.json", "utf8"));
          const npmStage = plan.stages.find(({ stage }) => stage === "npm_publish");
          fs.appendFileSync(
            output,
            [
              `state=${plan.state}`,
              `version=${plan.version}`,
              `tag=${plan.tag}`,
              `npm_enabled=${npmStage?.enabled === true}`,
              "",
            ].join("\n"),
          );
          NODE
      - name: release note候補を生成する
        if: always()
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_SHA^" 2>/dev/null || true)"
          {
            printf '# 変更内容\n\n'
            if [ -n "$previous_tag" ]; then
              git log "$previous_tag..$RELEASE_SHA" --pretty='- %s (%h)'
            else
              git log "$RELEASE_SHA" --pretty='- %s (%h)'
            fi
          } > release-notes.md
      - name: npm pack対象をdry-runで取得する
        if: always()
        run: npm pack --dry-run --json --ignore-scripts > npm-pack.json
      - name: version・tag・release note・npm pack対象を要約する
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const planText = fs.existsSync("release-plan.json")
            ? fs.readFileSync("release-plan.json", "utf8")
            : '{"state":"failed","reasons":["release計画を生成できませんでした"]}';
          const plan = JSON.parse(planText);
          const notes = fs.existsSync("release-notes.md")
            ? fs.readFileSync("release-notes.md", "utf8")
            : "release noteを生成できませんでした";
          const pack = fs.existsSync("npm-pack.json")
            ? JSON.parse(fs.readFileSync("npm-pack.json", "utf8"))
            : [];
          const files = pack[0]?.files?.map(({ path }) => `- ${path}`).join("\n") ?? "- 取得失敗";
          fs.appendFileSync(
            summary,
            [
              "# release候補の検証結果",
              "",
              `- 状態: ${plan.state ?? "failed"}`,
              `- version: ${plan.version ?? "不明"}`,
              `- tag: ${plan.tag ?? "不明"}`,
              `- dry-run: ${process.env.RELEASE_DRY_RUN ?? "不明"}`,
              "",
              "## release計画",
              "",
              "~~~json",
              planText.trim(),
              "~~~",
              "",
              "## release note候補",
              "",
              notes.trim(),
              "",
              "## npm pack対象",
              "",
              files,
              "",
              plan.state === "dry-run"
                ? "dry-runのためtag・GitHub Release・npm公開はすべて未実行です。"
                : plan.state === "rejected"
                  ? "計画拒否のため外部更新はすべて未実行です。"
                  : "検証だけが完了し、外部更新は後続jobで個別に記録します。",
              "",
            ].join("\n"),
          );
          NODE
        env:
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
      - name: 拒否された計画で外部更新を停止する
        if: always()
        env:
          RELEASE_STATE: ${{ steps.plan_outputs.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          const state = process.env.RELEASE_STATE;
          if (state !== "ready" && state !== "dry-run") process.exit(1);
          NODE

  tag:
    name: 検証済みcommitへGit tagを作成する
    needs: validate
    if: ${{ needs.validate.outputs.state == 'ready' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      state: ${{ steps.tag_status.outputs.state }}
    steps:
      - name: 検証済みcommitを取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: remote再確認後に注釈付きtagを作成する
        id: tag_operation
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" > tag-before.txt
          if [ -s tag-before.txt ]; then
            printf '同名tagがremoteに存在するため停止します。\n' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: remote tagのSHAを読み直す
        id: tag_status
        if: always()
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          TAG_OPERATION_OUTCOME: ${{ steps.tag_operation.outcome }}
        run: |
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" > tag-after.txt || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          const expected = process.env.RELEASE_SHA;
          const tag = process.env.RELEASE_TAG;
          if (!output || !expected || !tag) process.exit(1);
          const lines = fs.readFileSync("tag-after.txt", "utf8").trim().split(/\r?\n/).filter(Boolean);
          const peeled = lines.find((line) => line.endsWith(`refs/tags/${tag}^{}`));
          const direct = lines.find((line) => line.endsWith(`refs/tags/${tag}`));
          const observed = (peeled ?? direct ?? "").split(/\s+/)[0] ?? "";
          const succeeded =
            process.env.TAG_OPERATION_OUTCOME === "success" && observed === expected;
          fs.appendFileSync(output, `state=${succeeded ? "succeeded" : "failed"}\n`);
          NODE
      - name: Git tag操作結果と復旧方法を記録する
        if: always()
        env:
          TAG_STATE: ${{ steps.tag_status.outputs.state }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const succeeded = process.env.TAG_STATE === "succeeded";
          fs.appendFileSync(
            summary,
            [
              "# Git tag操作結果",
              "",
              `- tag: ${process.env.RELEASE_TAG ?? "不明"}`,
              `- 状態: ${succeeded ? "succeeded" : "failed"}`,
              succeeded
                ? "- 完了: validate、Git tag"
                : "- 完了: validate",
              succeeded
                ? "- 未完了: GitHub Release、npm公開（明示入力がある場合）"
                : "- 未完了: Git tag、GitHub Release、npm公開",
              succeeded
                ? "- 復旧: GitHub Release未作成を確認後、remoteとlocalのtagを削除する"
                : "- 復旧: remote tagの有無とSHAを確認してから新しいrunで再計画する",
              "",
            ].join("\n"),
          );
          NODE
      - name: tag未確認時に成功報告を拒否する
        if: always()
        env:
          TAG_STATE: ${{ steps.tag_status.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.TAG_STATE !== "succeeded") process.exit(1);
          NODE

  github_release:
    name: GitHub Releaseを作成する
    needs: [validate, tag]
    if: ${{ always() && needs.validate.outputs.state == 'ready' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      state: ${{ steps.release_status.outputs.state }}
    steps:
      - name: tag作成済みcommitを取得する
        if: ${{ needs.tag.outputs.state == 'succeeded' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 公開用release noteを再生成する
        if: ${{ needs.tag.outputs.state == 'succeeded' }}
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_SHA^" 2>/dev/null || true)"
          {
            printf '# 変更内容\n\n'
            if [ -n "$previous_tag" ]; then
              git log "$previous_tag..$RELEASE_SHA" --pretty='- %s (%h)'
            else
              git log "$RELEASE_SHA" --pretty='- %s (%h)'
            fi
          } > release-notes.md
      - name: 検証済みtagからGitHub Releaseを作成する
        id: release_operation
        if: ${{ needs.tag.outputs.state == 'succeeded' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
      - name: GitHub Releaseを読み直す
        id: release_observation
        if: ${{ needs.tag.outputs.state == 'succeeded' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --json tagName,url > release-after.json
      - name: GitHub Releaseの状態を確定する
        id: release_status
        if: always()
        env:
          TAG_STATE: ${{ needs.tag.outputs.state }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_OPERATION_OUTCOME: ${{ steps.release_operation.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          if (!output) process.exit(1);
          let state = "skipped";
          if (process.env.TAG_STATE === "succeeded") {
            try {
              const observed = JSON.parse(fs.readFileSync("release-after.json", "utf8"));
              state =
                process.env.RELEASE_OPERATION_OUTCOME === "success" &&
                observed.tagName === process.env.RELEASE_TAG
                  ? "succeeded"
                  : "failed";
            } catch {
              state = "failed";
            }
          }
          fs.appendFileSync(output, `state=${state}\n`);
          NODE
      - name: GitHub Release操作結果と復旧方法を記録する
        if: always()
        env:
          RELEASE_STATE: ${{ steps.release_status.outputs.state }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          NPM_ENABLED: ${{ needs.validate.outputs.npm_enabled }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const state = process.env.RELEASE_STATE ?? "failed";
          fs.appendFileSync(
            summary,
            [
              "# GitHub Release操作結果",
              "",
              `- tag: ${process.env.RELEASE_TAG ?? "不明"}`,
              `- 状態: ${state}`,
              state === "succeeded"
                ? "- 完了: validate、Git tag、GitHub Release"
                : "- 完了: validate、Git tag",
              state === "succeeded" && process.env.NPM_ENABLED === "true"
                ? "- 未完了: npm公開（environment承認待ち）"
                : state === "succeeded"
                  ? "- 未実行: npm公開（明示入力なし）"
                  : "- 未完了: GitHub Release、npm公開",
              state === "succeeded"
                ? "- 復旧: Releaseを削除し、npm未公開を確認後に必要ならtagを削除する"
                : "- 復旧: Releaseの有無を確認し、存在する場合は削除してから新しいrunで再計画する",
              "",
            ].join("\n"),
          );
          NODE
      - name: Release未確認時に成功報告を拒否する
        if: always()
        env:
          RELEASE_STATE: ${{ steps.release_status.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.RELEASE_STATE !== "succeeded") process.exit(1);
          NODE

  npm_publish:
    name: 承認後にnpm packageを公開する
    needs: [validate, tag, github_release]
    if: >-
      ${{ always() &&
          needs.validate.outputs.state == 'ready' &&
          needs.validate.outputs.npm_enabled == 'true' &&
          needs.tag.outputs.state == 'succeeded' &&
          needs.github_release.outputs.state == 'succeeded' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: release tagの内容を取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - name: npm公開用Node.js実行環境を準備する
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: 固定ファイルどおりに公開用依存を導入する
        run: npm ci
      - name: tag内容で全release gateを再検証する
        run: npm run prepack
      - name: 明示承認されたpackageをprovenance付きで公開する
        id: npm_operation
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: npm registryの公開versionを読み直す
        id: npm_observation
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: npm view "agent-skill-chain@$RELEASE_VERSION" version --json > npm-after.json
      - name: npm公開状態を確定する
        id: npm_status
        if: always()
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          NPM_OPERATION_OUTCOME: ${{ steps.npm_operation.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const output = process.env.GITHUB_OUTPUT;
          if (!output) process.exit(1);
          let state = "failed";
          try {
            const observed = JSON.parse(fs.readFileSync("npm-after.json", "utf8"));
            state =
              process.env.NPM_OPERATION_OUTCOME === "success" &&
              observed === process.env.RELEASE_VERSION
                ? "succeeded"
                : "failed";
          } catch {
            state = "failed";
          }
          fs.appendFileSync(output, `state=${state}\n`);
          NODE
      - name: npm公開結果と復旧方法を記録する
        if: always()
        env:
          NPM_STATE: ${{ steps.npm_status.outputs.state }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!summary) process.exit(1);
          const succeeded = process.env.NPM_STATE === "succeeded";
          fs.appendFileSync(
            summary,
            [
              "# npm公開操作結果",
              "",
              `- version: ${process.env.RELEASE_VERSION ?? "不明"}`,
              `- 状態: ${succeeded ? "succeeded" : "failed"}`,
              succeeded
                ? "- 完了: validate、Git tag、GitHub Release、npm公開"
                : "- 完了: validate、Git tag、GitHub Release",
              succeeded ? "- 未完了: なし" : "- 未完了: npm公開",
              succeeded
                ? "- 復旧: 公開済みversionは削除せずnpm deprecateで利用非推奨理由と代替versionを案内する"
                : "- 復旧: registryでversionの有無を再確認し、未公開なら原因解消後に新しいrunで再計画する",
              "",
            ].join("\n"),
          );
          NODE
      - name: npm公開未確認時に成功報告を拒否する
        if: always()
        env:
          NPM_STATE: ${{ steps.npm_status.outputs.state }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.NPM_STATE !== "succeeded") process.exit(1);
          NODE
