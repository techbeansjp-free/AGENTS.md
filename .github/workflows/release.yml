# release.yml — 自動リリース（案C）＋ marketplace 生成物公開【現在 dormant＝無効化中】
#
# ┌─ 現状（dormant）─────────────────────────────────────────────────────────┐
# │ npm 公開は今後の課題として保留中であり、自動リリースは無効化（dormant）している。 │
# │ on: から push: branches:[main] を撤去し workflow_dispatch（手動）のみとし、       │
# │ 3 job（release-npm / release-marketplace / apm-release）の if: に RELEASE_ENABLED │
# │ ゲートを付与した。main マージ・タグ push のいずれでも自動発火（version bump /     │
# │ 日時タグ / GitHub Release / npm publish / marketplace 公開 / apm release/apm      │
# │ 発行）は起きない。apm-release ジョブも他 2 job と同一の dormant ゲート配下。        │
# │ 案C の step 本体・action の SHA ピン・無限ループ防止策・NPM_TOKEN ゲートは資産   │
# │ として保持（削除でなく可逆な無効化）。経緯は自己拡張 issue                        │
# │ 20260616_144601_npm公開を今後の課題化_自動リリース現状無効化 を参照。            │
# │                                                                                  │
# │ 再開手順（最小 2 手）:                                                            │
# │   ① on: に push: branches:[main] を戻す（下記 on: の NOTE 参照）                  │
# │   ② リポジトリ変数 RELEASE_ENABLED=true を設定（Repository variables）            │
# │ （配布方法の確定・NPM_TOKEN 登録を含む詳細は docs/maintainer/RELEASE.md §5）      │
# └──────────────────────────────────────────────────────────────────────────┘
#
# 方針（案C・再開後に有効となる本来の動作）:
#   - 再開後のトリガは「main への push」。手動タグ運用は廃止し、main マージを契機に自動でリリースする。
#   - version は bump 後の package.json:version を単一の真実源とする（semver patch +1）。
#   - 日時タグ vYYYYMMDD.HHMMSS は「リリースの目印」であり semver とは独立（タグ==package.json の不変条件は撤去）。
#   - 正本リポ（main）には生成物 .adapters/ を一切置かない（/.adapters/ は gitignore のまま）。
#   - npm publish は NPM_TOKEN ゲートで保護し、未設定なら skip（ジョブ失敗にしない）。既存 version は冪等に skip。
#
# 無限ループ防止（02_設計 §3.2.2・§9.2）:
#   - 主防御: bump 結果の書き戻し push は GitHub Actions 既定 GITHUB_TOKEN を用いる。
#     既定 GITHUB_TOKEN による push は on:push workflow を再トリガしない（GitHub 仕様）。
#     PAT / deploy key は使わない（使うと再発火しうる）。
#   - 補助防御（belt-and-suspenders）: コミットメッセージに [skip ci]、concurrency 直列化、
#     actor != github-actions[bot] のガード。

name: release

# bump 書き戻し push・生成物の release ブランチ push・GitHub Release 作成のため write を要求する。
permissions:
  contents: write

on:
  # NOTE(dormant): main への自動リリースは現在無効化（dormant）。
  # 自動発火（version bump / 日時タグ / GitHub Release / npm publish）を止めるため
  # push: branches:[main] を撤去し、手動 workflow_dispatch のみ残す。
  # 再開時は push: branches:[main] を戻す（ファイル先頭の再開手順 参照）。
  workflow_dispatch:

# release ジョブ群を直列化し、同秒衝突・並行 bump の競合確率を下げる。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # =====================================================================
  # (A) version bump + 日時タグ + GitHub Release + npm publish（案C）
  # =====================================================================
  release-npm:
    runs-on: ubuntu-latest
    # bot 自身の書き戻し push では発火しない（補助防御）。
    # dormant 補助防御: RELEASE_ENABLED が 'true' のときのみ実行（未設定/その他は skip）。
    if: github.actor != 'github-actions[bot]' && vars.RELEASE_ENABLED == 'true'
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.datetag.outputs.tag }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node (with npm registry)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install sqlite3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3

      # bump 起点を最新 main に取り直す（並行マージで同一 patch を二度採番するのを緩和）。
      - name: Sync latest main (rebase)
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull --rebase origin main

      # version bump（patch +1）。git tag は npm に作らせず、後段で日時タグを別途作る。
      - name: Bump version (patch, no git tag)
        id: bump
        run: |
          set -e
          npm version patch --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "OK: package.json version を $version へ bump しました（semver patch +1）。"

      # package.json ↔ plugin.json の整合（tag 非依存）。bump 後の version を plugin.json へ反映して検証する。
      - name: Sync plugin.json version & verify
        run: |
          set -e
          bash .agent-skill-chain/source/scripts/sync-version.sh --write
          bash .agent-skill-chain/source/scripts/sync-version.sh --check

      # 公開前ビルド: 非追跡の bin を作業ツリーへ生成（prepack 代替＝使用前 build 方式）。
      - name: Build CLI bin (replaces prepack)
        run: |
          set -e
          npm ci
          npm run build
          echo "OK: src -> bin を生成しました（非追跡の生成物を作業ツリーに用意）。"

      # 配布物リーク検査: 改名後 name でも tarball にリポ固有物が漏れず必須物があること（SC-3 と兼ねる）。
      - name: Verify npm pack (leak / required files)
        run: |
          set -e
          bash .agent-skill-chain/source/scripts/verify-npm-pack.sh

      # bump 結果を main へ書き戻す。既定 GITHUB_TOKEN による push は on:push を再トリガしない（主防御）。
      # コミットメッセージの [skip ci] と non-fast-forward 時の rebase 再試行は補助防御。
      - name: Commit & push version bump to main
        run: |
          set -e
          version="${{ steps.bump.outputs.version }}"
          if git diff --quiet -- package.json package-lock.json .agent-skill-chain/source/platforms/claude/plugin.json; then
            echo "変更なし。bump 書き戻しをスキップします。"
          else
            git add package.json package-lock.json .agent-skill-chain/source/platforms/claude/plugin.json
            git commit -m "chore(release): v${version} [skip ci]"
            # 書き戻し push が non-fast-forward で reject されたら rebase の上で 1 回再試行する（N-B）。
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      # JST 日時タグ vYYYYMMDD.HHMMSS を決定する（ランナー TZ 既定 UTC に依存しない）。
      # 既存タグと衝突する場合は秒 +1 → サフィックス -2 → -3 の最大 3 段で再試行し、尽きたら失敗させる（N-C）。
      - name: Decide datetime tag (collision retry, max 3)
        id: datetag
        run: |
          set -e
          git fetch --tags --quiet
          base="$(TZ=Asia/Tokyo date +v%Y%m%d.%H%M%S)"
          candidates=("$base")
          # 秒 +1 候補
          plus1="v$(TZ=Asia/Tokyo date -d '+1 second' +%Y%m%d.%H%M%S)"
          candidates+=("$plus1" "${base}-2" "${base}-3")
          tag=""
          for c in "${candidates[@]}"; do
            if git rev-parse -q --verify "refs/tags/$c" >/dev/null; then
              echo "タグ $c は既存。次候補へ。"
              continue
            fi
            tag="$c"
            break
          done
          if [ -z "$tag" ]; then
            echo "ERROR: 日時タグ候補（最大 3 段リトライ）がすべて衝突しました。打ち切ります。" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "OK: 日時タグ $tag を採用します。"

      # GitHub Release 作成（自動生成ノート）。既存判定で二重作成を避ける（冪等）。
      - name: Create GitHub Release (generate notes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ steps.datetag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag は既存。作成をスキップします（冪等）。"
          else
            gh release create "$tag" --target "$(git rev-parse HEAD)" --title "$tag" --generate-notes
            echo "OK: GitHub Release $tag を作成しました（自動ノート）。"
          fi

      # トークンゲート: NPM_TOKEN secret が未設定なら publish せず skip して案内する。
      - name: Check NPM_TOKEN gate
        id: npm_gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret が未設定のため npm publish を skip します。Secrets に NPM_TOKEN を設定して main へ push すると publish されます。"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN を検出しました。publish を実行します。"
          fi

      # publish 本体（冪等）: 当該 version が既に npm に存在すれば skip（再実行で二重 publish しない）。
      # unscoped public（agent-skill-chain）でも --access public を明示する。
      - name: npm publish (public, idempotent)
        if: steps.npm_gate.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          name="$(node -p "require('./package.json').name")"
          version="${{ steps.bump.outputs.version }}"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} は既に publish 済み。skip します（冪等）。"
          else
            npm publish --access public
            echo "OK: ${name}@${version} を publish しました。"
          fi

  # =====================================================================
  # (B) marketplace リリース（案A）— 生成物を release/marketplace へ commit
  # =====================================================================
  release-marketplace:
    runs-on: ubuntu-latest
    # dormant 補助防御: RELEASE_ENABLED が 'true' のときのみ実行（未設定/その他は skip）。
    if: github.actor != 'github-actions[bot]' && vars.RELEASE_ENABLED == 'true'
    needs: release-npm
    env:
      RELEASE_BRANCH: release/marketplace
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install sqlite3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3

      # bump 書き戻し後の main を取り直し、最新 version 基準で生成する（並行 bump 後の整合）。
      - name: Sync latest main (rebase)
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      # package.json ↔ plugin.json の整合（tag 非依存）。tag 起点比較は撤去済み。
      - name: Verify version sync (package.json == plugin.json)
        run: |
          set -e
          bash .agent-skill-chain/source/scripts/sync-version.sh --check
          pkg="$(node -p "require('./package.json').version")"
          echo "OK: package.json=$pkg（plugin.json と一致）。"

      # 正本 .agent-skill-chain/source/ から Claude（＋cursor）アダプタを生成する。
      - name: Build adapters (claude, cursor)
        run: |
          set -e
          bash .agent-skill-chain/source/scripts/build-adapters.sh claude cursor

      # 再生成 diff ゼロ検証: もう一度 build しても生成物が変わらない（決定性）。
      - name: Re-build determinism check (diff-zero)
        run: |
          set -e
          rm -rf /tmp/adapters_first
          cp -R .adapters /tmp/adapters_first
          bash .agent-skill-chain/source/scripts/build-adapters.sh claude cursor
          diff -r /tmp/adapters_first/claude .adapters/claude
          diff -r /tmp/adapters_first/cursor .adapters/cursor
          echo "OK: 再生成で生成物の差分なし（決定性）。"

      # 生成物をリリースブランチへ commit/push（案A）。main には生成物を置かない。
      # commit メッセージは bump 後 version を参照する（main push では GITHUB_REF_NAME=main のため使わない）。
      - name: Publish adapters to release branch
        run: |
          set -e
          version="${{ needs.release-npm.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 生成物を退避（checkout でツリーが入れ替わっても残るよう作業ツリー外へ）
          work="$(mktemp -d)"
          cp -R .adapters "$work/.adapters"
          cp .claude-plugin/marketplace.json "$work/marketplace.json"

          # リリースブランチを用意（無ければ orphan で作る）
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$RELEASE_BRANCH"
            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
            git rm -rf --quiet .adapters 2>/dev/null || true
          else
            git checkout --orphan "$RELEASE_BRANCH"
            git rm -rf --quiet . 2>/dev/null || true
          fi

          # 生成物と marketplace.json を配置（source: "./.adapters/claude" はここで解決される）
          rm -rf .adapters .claude-plugin
          mkdir -p .claude-plugin
          cp -R "$work/.adapters" .adapters
          cp "$work/marketplace.json" .claude-plugin/marketplace.json

          # .adapters を確実に追跡対象にする（リリースブランチでは生成物を追跡する）
          git add -f .adapters .claude-plugin/marketplace.json

          if git diff --cached --quiet; then
            echo "変更なし（同一生成物）。commit をスキップします。"
          else
            git commit -m "release: v${version} adapters (generated from .agent-skill-chain/source/) [skip ci]"
          fi
          git push origin "$RELEASE_BRANCH"
          echo "OK: $RELEASE_BRANCH へ生成物を公開しました（marketplace source 解決先）。"

  # =====================================================================
  # (C) apm release（案A）— apm.yml + .apm/ を release/apm ブランチへ commit し、
  #     同一コミットへ apm-vX.Y.Z タグを付与する
  # =====================================================================
  apm-release:
    runs-on: ubuntu-latest
    # dormant 補助防御: RELEASE_ENABLED が 'true' のときのみ実行（未設定/その他は skip）。
    # 他 2 job（release-npm/release-marketplace）と完全に同一のゲート条件を維持する。
    if: github.actor != 'github-actions[bot]' && vars.RELEASE_ENABLED == 'true'
    needs: release-marketplace
    env:
      RELEASE_BRANCH: release/apm
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # bump 書き戻し・marketplace job 完了後の main を取り直し、最新 version 基準で生成する。
      - name: Sync latest main (rebase)
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      # package.json ↔ plugin.json ↔ apm.yml の整合（tag 非依存）。
      - name: Verify version sync (package.json == plugin.json == apm.yml)
        run: |
          set -e
          bash .agent-skill-chain/source/scripts/sync-version.sh --check
          pkg="$(node -p "require('./package.json').version")"
          echo "OK: package.json=$pkg（plugin.json/apm.yml と一致）。"

      # 正本 .agent-skill-chain/source/ から apm パッケージ（apm.yml + .apm/）を生成する。
      - name: Build apm package
        run: bash .agent-skill-chain/source/scripts/build-adapters.sh apm

      # 再生成 diff ゼロ検証: もう一度生成しても同一（決定性）であることを検証する
      # （既存 release-marketplace の「再生成 diff ゼロ」検証パターンを踏襲）。
      - name: Re-build determinism check (diff-zero)
        run: |
          set -e
          work="$(mktemp -d)"
          find .apm apm.yml -type f -exec sha256sum {} \; | sort > "$work/hash1.txt"
          bash .agent-skill-chain/source/scripts/build-adapters.sh apm
          find .apm apm.yml -type f -exec sha256sum {} \; | sort > "$work/hash2.txt"
          diff "$work/hash1.txt" "$work/hash2.txt"
          echo "OK: 再生成で生成物の差分なし（決定性）。"

      # 生成物を release/apm ブランチへ commit/push し、同一コミットへ apm-vX.Y.Z タグを付与する
      # （既存 release-marketplace の「退避 → ブランチ用意 → 配置 → git add -f → commit/push」を
      #  apm.yml/.apm/ に読み替えて流用し、末尾でタグを付与する）。
      - name: Publish to release/apm and tag
        run: |
          set -e
          version="$(node -p "require('./package.json').version")"
          tag="apm-v${version}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 生成物を退避（checkout でツリーが入れ替わっても残るよう作業ツリー外へ）
          work="$(mktemp -d)"
          cp -R .apm "$work/.apm"
          cp apm.yml "$work/apm.yml"

          # リリースブランチを用意（無ければ orphan で作る）
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$RELEASE_BRANCH"
            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
            git rm -rf --quiet .apm apm.yml 2>/dev/null || true
          else
            git checkout --orphan "$RELEASE_BRANCH"
            git rm -rf --quiet . 2>/dev/null || true
          fi

          # 生成物を配置
          rm -rf .apm apm.yml
          cp -R "$work/.apm" .apm
          cp "$work/apm.yml" apm.yml

          # .apm/apm.yml を確実に追跡対象にする（リリースブランチでは生成物を追跡する）
          git add -f .apm apm.yml

          if git diff --cached --quiet; then
            echo "変更なし（同一生成物）。commit をスキップします。"
          else
            git commit -m "release: apm-v${version} package (generated from .agent-skill-chain/source/) [skip ci]"
          fi
          git push origin "$RELEASE_BRANCH"

          # 同一コミットへ apm-vX.Y.Z タグを付与する（既定 GITHUB_TOKEN によるタグ push は
          # on:push を再トリガしない。既存の日時タグ vYYYYMMDD.HHMMSS とは接頭辞が異なり衝突しない）。
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "タグ $tag は既存。付与をスキップします（冪等）。"
          else
            git tag "$tag" "$(git rev-parse HEAD)"
            git push origin "refs/tags/$tag"
            echo "OK: タグ $tag を付与しました。"
          fi

          echo "OK: $RELEASE_BRANCH へ apm パッケージを公開しました。"
