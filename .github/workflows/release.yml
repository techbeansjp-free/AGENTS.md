# release.yml — リリースフロー（npm publish ＋ marketplace 案A）
#
# 方針（02_設計 §5.1 / 03_実装計画 §0・§2.5）:
#   - 正本リポ（main）には生成物 .adapters/ を一切置かない（/.adapters/ は gitignore のまま）。
#   - リリースは「タグ push」をトリガに、次の 2 系統を実行する:
#       (A) npm publish  : 公開前検証（version 同期・配布物リーク検査）→ scoped public publish。
#       (B) marketplace  : CI が正本 .agents/ から build-adapters.sh で生成し、
#                          生成物 .adapters/claude（＋cursor）を専用リリースブランチへ commit する（案A）。
#   - marketplace.json の source: "./.adapters/claude" は、このリリースブランチ上で解決される。
#
# 確定既定（03_実装計画 §0／§9 #1・#2・#6 で確定）:
#   - トリガ:           タグ push `v*`（例: v0.1.0）。
#   - npm パッケージ:   @techbeansjp-free/agents-md（public / npmjs.com、publishConfig.access=public）。
#   - リリースブランチ: `release/marketplace`（生成物の置き場。常に最新リリース内容で上書き同期）。
#   - 版同期:           push されたタグ（vX.Y.Z）と package.json.version / plugin.json.version が一致すること。
#
# 重要:
#   - 実際の push / publish はこの CI 上でのみ起こる（ローカルからは push/publish しない）。
#   - npm publish は NPM_TOKEN secret によるゲートで保護する。未設定なら publish step は skip し、
#     ユーザーが NPM_TOKEN を設定して v* タグを push したときにのみ発火する。

name: release

# 生成物をリリースブランチへ push する必要があるため write を要求する。
permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  # =====================================================================
  # (A) npm publish — 公開前検証 → NPM_TOKEN ゲート → scoped public publish
  # =====================================================================
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (with npm registry)
        uses: actions/setup-node@v4
        with:
          # 本プロジェクトの実行系は現行 LTS の node22 を対象とする。
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install sqlite3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3

      # 公開前検証 1) version 同期: タグ・package.json・plugin.json の version が一致すること
      - name: Verify version sync (tag == package.json == plugin.json)
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          bash .agents/scripts/sync-version.sh --check
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "ERROR: タグ($tag) と package.json($pkg) の version が一致しません" >&2
            exit 1
          fi
          echo "OK: tag=$tag, package.json=$pkg で一致"

      # 公開前ビルド: bin/agents-md.js は非追跡（.gitignore）の生成物であり、prepack を再導入しない
      #   （pack の lifecycle script 副作用が node_modules 無しのクリーン clone を壊す地雷を避ける）。
      #   publish 直前に `npm ci && npm run build` で作業ツリーに bin を生成し、後段の pack 検査
      #   （必須物 bin あり）と npm publish（作業ツリーを pack）で配布物へ同梱する（使用前 build 方式）。
      - name: Build CLI bin (replaces prepack)
        run: |
          set -e
          npm ci
          npm run build
          echo "OK: src -> bin を生成（非追跡の生成物を作業ツリーに用意）"

      # 公開前検証 2) 配布物リーク検査: tarball にリポ固有物が漏れず必須物が含まれること
      - name: Verify npm pack (leak / required files)
        run: |
          set -e
          bash .agents/scripts/verify-npm-pack.sh

      # トークンゲート: NPM_TOKEN secret が未設定なら publish せず skip して案内する。
      # （未設定のまま publish を試みて失敗する／意図せず発火するのを防ぐ）
      - name: Check NPM_TOKEN gate
        id: npm_gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret が未設定のため npm publish を skip します。リポジトリの Secrets に NPM_TOKEN を設定して v* タグを push すると publish されます。"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN を検出しました。publish を実行します。"
          fi

      # publish 本体: トークンが存在するときのみ実行する。
      # publishConfig.access=public のため scoped でも公開 publish 可能。明示に --access public も付与。
      - name: npm publish (public)
        if: steps.npm_gate.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          npm publish --access public

  # =====================================================================
  # (B) marketplace リリース（案A）— 生成物を release/marketplace へ commit
  # =====================================================================
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: release/marketplace
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 本プロジェクトの実行系は現行 LTS の node22 を対象とする。
          # setup-node@v4 は node20 ランタイムで動作する現行メジャー（node16 非推奨警告を出さない）。
          node-version: "22"

      - name: Install sqlite3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3

      # 1) version 同期検証: タグ・package.json・plugin.json の version が一致すること
      - name: Verify version sync (tag == package.json == plugin.json)
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          # package.json / plugin.json 間の一致は単一正本スクリプトで検証
          bash .agents/scripts/sync-version.sh --check
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "ERROR: タグ($tag) と package.json($pkg) の version が一致しません" >&2
            exit 1
          fi
          echo "OK: tag=$tag, package.json=$pkg で一致"

      # 2) 正本 .agents/ から Claude（＋cursor）アダプタを生成
      - name: Build adapters (claude, cursor)
        run: |
          set -e
          bash .agents/scripts/build-adapters.sh claude cursor

      # 3) 再生成 diff ゼロ検証: もう一度 build しても生成物が変わらない（決定性）
      - name: Re-build determinism check (diff-zero)
        run: |
          set -e
          rm -rf /tmp/adapters_first
          cp -R .adapters /tmp/adapters_first
          bash .agents/scripts/build-adapters.sh claude cursor
          diff -r /tmp/adapters_first/claude .adapters/claude
          diff -r /tmp/adapters_first/cursor .adapters/cursor
          echo "OK: 再生成で生成物の差分なし（決定性）"

      # 4) 生成物をリリースブランチへ commit/push（案A）。main には生成物を置かない。
      #    リリースブランチは「生成物 + marketplace.json」のみを持つ orphan 系の運用とし、
      #    毎回そのタグ時点の生成物で内容を作り直す（履歴は taglog として残す）。
      - name: Publish adapters to release branch
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 生成物を退避（checkout でツリーが入れ替わっても残るよう作業ツリー外へ）
          work="$(mktemp -d)"
          cp -R .adapters "$work/.adapters"
          cp .claude-plugin/marketplace.json "$work/marketplace.json"

          # リリースブランチを用意（無ければ orphan で作る）
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$RELEASE_BRANCH"
            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
            git rm -rf --quiet .adapters 2>/dev/null || true
          else
            git checkout --orphan "$RELEASE_BRANCH"
            git rm -rf --quiet . 2>/dev/null || true
          fi

          # 生成物と marketplace.json を配置（source: "./.adapters/claude" はここで解決される）
          rm -rf .adapters .claude-plugin
          mkdir -p .claude-plugin
          cp -R "$work/.adapters" .adapters
          cp "$work/marketplace.json" .claude-plugin/marketplace.json

          # .adapters を確実に追跡対象にする（リリースブランチでは生成物を追跡する）
          git add -f .adapters .claude-plugin/marketplace.json

          if git diff --cached --quiet; then
            echo "変更なし（同一生成物）。commit をスキップします。"
          else
            git commit -m "release: ${GITHUB_REF_NAME} adapters (generated from .agents/)"
          fi
          git push origin "$RELEASE_BRANCH"
          echo "OK: $RELEASE_BRANCH へ生成物を公開しました（marketplace source 解決先）。"
