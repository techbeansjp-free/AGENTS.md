name: v0.5 automatic release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Manual version (0.5.N or 0.5.N-alpha/beta/rc.N)
        required: true
        type: string
      dry_run:
        description: Validate and package without publication
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

# Serialize numbering and publication; never cancel an in-flight asset upload.
concurrency:
  group: asc-release
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      artifact: release-${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reuse matching PR checks and select next patch version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release.mjs plan
      - name: Build fixed distribution
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          mkdir release-output
          node scripts/pack-candidate.mjs "$PWD/release-output" "--version=$RELEASE_VERSION" > release-output/package-result.json
          git rev-parse HEAD > release-output/source-commit.txt
          cd release-output
          sha256sum agent-skill-chain-*.tgz > SHA256SUMS
      - name: Install and verify the actual versioned tarball
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/check-release-package.mjs "release-output/agent-skill-chain-$RELEASE_VERSION.tgz" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-output/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: release-output
      - name: Recheck source and publish without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release.mjs publish release-output
