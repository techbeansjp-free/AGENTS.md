name: v0.5 unpublished release candidate

# Candidate generation is not publication approval. No push trigger or write token.
"on":
  workflow_dispatch:
    inputs:
      version:
        description: Unpublished candidate version (0.5.N)
        required: true
        type: string
      expected_sha:
        description: Exact reviewed source commit (40 hex characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind candidate to the requested commit and version
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^0\.5\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare Linux isolation
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor-profiles bubblewrap
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          /usr/bin/bwrap --unshare-all --die-with-parent --new-session --ro-bind / / -- /bin/true
      - name: Prepare per-invocation lifecycle and resource verification
        run: |
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show --property=Version
      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts
      - name: Test harness including Linux isolation
        env:
          ASC_TEST_CGROUP: "1"
        run: npm run quality
      - name: Build unpublished canonical package
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          mkdir candidate-output
          node v05/scripts/pack-candidate.mjs "$PWD/candidate-output" "--version=$CANDIDATE_VERSION" > candidate-output/package-result.json
          git rev-parse HEAD > candidate-output/source-commit.txt
          cd candidate-output
          sha256sum agent-skill-chain-*.tgz > SHA256SUMS
      - name: Preserve candidate for owner review (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: v05-unpublished-candidate-${{ github.sha }}
          path: candidate-output/
          if-no-files-found: error
          retention-days: 14
