# 正本: AGENTS.md §不変条件I1・I4・I6・I7
#
# 本リポジトリ（agent-skill-chain自身の開発リポジトリ）専用の自己テストワークフローである。
# PRへのpushごとに agent-skill-chain CLI 自体のテストスイート（npm test、test/unit・
# test/integration対象）を実行する。配布テンプレート（.agent-skill-chain/templates/github/
# .github/workflows/）には含めない——consumerはagent-skill-chain自身のsrc/testを保有せず、
# このジョブがconsumer環境で意味を持たないため（Issue #290）。
name: agent-skill-chain / self-test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Run npm test and save execution log
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-execution.log

      - name: Upload npm test execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-test-execution-log
          path: test-execution.log
          if-no-files-found: error
