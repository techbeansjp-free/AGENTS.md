name: agent-skill-chain / config documentation sync

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify-config-doc-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - run: ./.agent-skill-chain/ci/verify-config-doc-sync.sh
