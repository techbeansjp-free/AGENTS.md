name: trusted project品質契約

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# base commitのvalidatorだけでcandidateの固定設定fileを読む。candidate code、script、依存は実行しない。
permissions:
  contents: read

# 同じPRへの新しいpushで、古いcommitの実行を止める（#1714）。
# 手動の再実行（run_attempt > 1）と PR 番号のない event は固有の group に入れ、最新 commit の実行を取り消さない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}${{ github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  trusted-project-quality:
    name: base validatorで品質自己緩和を拒否
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: trusted baseを取得する
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: trusted validatorの依存だけを固定導入する
        working-directory: trusted
        run: npm ci --ignore-scripts
      - name: candidateを実行せず固定fileとして取得する
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: base validatorでcandidate品質設定を検証する
        working-directory: trusted
        run: node --import tsx scripts/check_project_quality.ts "--root=$GITHUB_WORKSPACE/candidate" "--trusted-root=$GITHUB_WORKSPACE/trusted"
      - name: base source validatorでcandidate全体を検証する
        working-directory: trusted
        run: node --import tsx scripts/check_source_quality.ts "--root=$GITHUB_WORKSPACE/candidate"
