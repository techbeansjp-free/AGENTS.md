name: Native verification assets
on:
  pull_request:
permissions:
  contents: read
# 同じPRへの新しいpushで、古いcommitの実行を止める（#1714）。
# 手動の再実行（run_attempt > 1）は固有のgroupに入れ、最新commitの実行を取り消さない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}${{ github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: true
jobs:
  mac-native-verification:
    name: Mac native sandbox and dependencies
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Install explicit Codex sandbox runtime (no model calls)
        run: npm install --prefix "$RUNNER_TEMP/asc-native-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.156.0
      - name: Verify tracked control files and actual dependencies inside sandbox
        run: ASC_TEST_CODEX="$RUNNER_TEMP/asc-native-codex/node_modules/@openai/codex/bin/codex.js" node test/native/host-assets.mjs
      - name: Keep Controller temporary files out of the sandbox without TMPDIR
        run: env -u TMPDIR ASC_TEST_CODEX="$RUNNER_TEMP/asc-native-codex/node_modules/@openai/codex/bin/codex.js" node test/native/temp-isolation.mjs
