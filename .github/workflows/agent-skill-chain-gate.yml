# 正本: AGENTS.md §4セグメント・4ゲート / §不変条件I8 / .agent-skill-chain/config/agent-skill-chain.yaml review.*・checks.*
#
# PRへのpushごとに4ゲート（spec/design/implementation/validation）のレビューを起動し、
# gate-reportを検証したうえでCheck Runへ発行する。.agent-skill-chain/scripts/gate-review.sh・
# .agent-skill-chain/scripts/gate-publish.sh・.agent-skill-chain/ci/verify-gate-report.sh は
# いずれも agent-skill-chain CLI（src/agents-md.ts、ビルド後 bin/agents-md.js）への薄いラッパー
# であるため、検査本体の前にビルドを行う。
#
# レビュープロファイルの判定は不変条件I8をそのまま実装する：
# risk != normal（unclassified含む）OR autonomy == full → strict。
name: agent-skill-chain / gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  detect-segments:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.segments.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch for segment detection
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Detect started segments
        id: segments
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          matrix='['
          while IFS= read -r segment; do
            matrix+="\"$segment\","
          done < <(./.agent-skill-chain/scripts/detect-changed-segments.sh "$BASE_REF")
          matrix="${matrix%,}]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  gate-review:
    needs: detect-segments
    if: needs.detect-segments.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.detect-segments.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Derive issue_id and review profile
        id: ctx
        env:
          BRANCH: ${{ github.head_ref }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ISSUE_ID="ISSUE-$(echo "$BRANCH" | sed -E 's#^[^/]+/([0-9]+)-.*#\1#')"
          if ! [[ "$ISSUE_ID" =~ ^ISSUE-[0-9]+$ ]]; then
            echo "ブランチ名 '$BRANCH' から issue_id を抽出できません（.agent-skill-chain/config/agent-skill-chain.yaml branch.pattern に非適合）" >&2
            exit 1
          fi
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "target_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          REVIEW_SUBJECT=ordinary
          if echo "$LABELS_JSON" | grep -q '"review:core-audit"'; then REVIEW_SUBJECT=core_audit; fi
          echo "review_subject=$REVIEW_SUBJECT" >> "$GITHUB_OUTPUT"

          REVIEWER_CONTEXT="$(node bin/agents-md.js gate reviewer-context \
            "$ISSUE_ID" "$HEAD_SHA" "origin/${{ github.base_ref }}" "$REVIEW_SUBJECT")"
          ADAPTER="$(echo "$REVIEWER_CONTEXT" | sed -n 's/^adapter=//p')"
          CORE_REVIEW_REQUIRED="$(echo "$REVIEWER_CONTEXT" | sed -n 's/^core_review_required=//p')"
          echo "adapter=$ADAPTER" >> "$GITHUB_OUTPUT"
          echo "core_review_required=$CORE_REVIEW_REQUIRED" >> "$GITHUB_OUTPUT"

          PROFILE=standard
          if ! echo "$LABELS_JSON" | grep -q '"risk:normal"'; then PROFILE=strict; fi
          if echo "$LABELS_JSON" | grep -q '"autonomy:full"'; then PROFILE=strict; fi
          if [ "$CORE_REVIEW_REQUIRED" = "true" ]; then PROFILE=strict; fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Detect automatic reviewer credentials
        id: credentials
        env:
          ANTHROPIC_API_KEY: ${{ steps.ctx.outputs.adapter == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.ctx.outputs.adapter == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          OPENAI_API_KEY: ${{ steps.ctx.outputs.adapter == 'codex' && secrets.OPENAI_API_KEY || '' }}
        run: |
          ADAPTER="${{ steps.ctx.outputs.adapter }}"
          AVAILABLE=true
          case "$ADAPTER" in
            claude) [[ -z "$ANTHROPIC_API_KEY" && -z "$CLAUDE_CODE_OAUTH_TOKEN" ]] && AVAILABLE=false ;;
            codex) [[ -z "$OPENAI_API_KEY" ]] && AVAILABLE=false ;;
          esac
          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"
          echo "core_review_required=${{ steps.ctx.outputs.core_review_required }}" >> "$GITHUB_OUTPUT"

      - name: Publish neutral gate when reviewer credentials are unavailable
        if: steps.credentials.outputs.available == 'false' && steps.credentials.outputs.core_review_required != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.ctx.outputs.target_sha }}
          GATE_ID: ${{ matrix.gate }}
        run: |
          node -e 'console.log(JSON.stringify({name: `agent-skill-chain/${process.env.GATE_ID}-gate`, head_sha: process.env.HEAD_SHA, status: "completed", conclusion: "neutral", output: {title: "automatic gate review not run", summary: "Automatic gate review was not run because reviewer credentials are not configured. Follow the manual review, local gate record, and admin merge procedure."}}))' | gh api -X POST "repos/${{ github.repository }}/check-runs" --input -
          echo "自動ゲートレビューは認証情報未設定のため未実施です。手動レビュー・ローカル記録・admin mergeの運用へ移行してください。"

      - name: Publish action-required gate when core reviewer credentials are unavailable
        if: steps.credentials.outputs.available == 'false' && steps.credentials.outputs.core_review_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.ctx.outputs.target_sha }}
          GATE_ID: ${{ matrix.gate }}
        run: |
          node -e 'console.log(JSON.stringify({name: `agent-skill-chain/${process.env.GATE_ID}-gate`, head_sha: process.env.HEAD_SHA, status: "completed", conclusion: "action_required", output: {title: "core review requires human action", summary: "The required frontier-coding / maximum-reasoning reviewer is unavailable. The gate is human_required and merge remains blocked."}}))' | gh api -X POST "repos/${{ github.repository }}/check-runs" --input -
          echo "コア独立レビューの必須能力を利用できないため、human_requiredとして停止しました。"

      # target_sha を明示的に渡す（4番目の引数）。actions/checkout@v7 は pull_request イベントで
      # マージref（refs/pull/<n>/merge）をdetached HEADでチェックアウトするため、gate review が
      # entry.path の git rev-parse HEAD で自己解決するとPRの実際のブランチ先端コミットと乖離し、
      # 発行されるCheck RunのSHAがPRのSHAと一致しなくなる（Issue #171 実地障害）。
      - name: Run gate review (${{ matrix.gate }})
        id: review
        if: steps.credentials.outputs.available == 'true'
        run: |
          REVIEW_OUTPUT="$(./.agent-skill-chain/scripts/gate-review.sh "${{ steps.ctx.outputs.issue_id }}" "${{ matrix.gate }}" "${{ steps.ctx.outputs.profile }}" "${{ steps.ctx.outputs.target_sha }}")"
          REPORT_PATH="$(echo "$REVIEW_OUTPUT" | sed -n 's/^gate_report_path: //p')"
          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

      # self-extension のコアレビューは公式 Codex Action を read-only で独立2回起動する。
      # verdict はレビュアへ書込み権限を渡さず、trusted code の record-verdict が集約・記録する。
      - name: Prepare Codex core reviewer prompt
        if: steps.credentials.outputs.available == 'true' && steps.ctx.outputs.core_review_required == 'true' && steps.ctx.outputs.adapter == 'codex'
        run: |
          mkdir -p .agent-skill-chain/runtime
          node bin/agents-md.js gate reviewer-prompt \
            "${{ steps.ctx.outputs.issue_id }}" "${{ matrix.gate }}" "${{ steps.ctx.outputs.target_sha }}" \
            > .agent-skill-chain/runtime/codex-core-review-prompt.txt

      - name: Run Codex core reviewer 1
        id: codex_reviewer_1
        if: steps.credentials.outputs.available == 'true' && steps.ctx.outputs.core_review_required == 'true' && steps.ctx.outputs.adapter == 'codex'
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .agent-skill-chain/runtime/codex-core-review-prompt.txt
          model: gpt-5.6-sol
          effort: xhigh
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          output-schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["conformance", "falsification", "blockers", "approved_artifacts", "inconclusive"],
              "properties": {
                "conformance": {"type": "string", "enum": ["pass", "fail", "pending"]},
                "falsification": {"type": "string", "enum": ["pass", "fail", "pending"]},
                "blockers": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["severity", "origin", "code", "evidence"],
                    "properties": {
                      "severity": {"type": "string", "enum": ["blocking", "warning", "info"]},
                      "origin": {"type": "string", "enum": ["specification", "design", "implementation", "validation"]},
                      "code": {"type": "string"},
                      "evidence": {"type": "array", "items": {"type": "string"}}
                    }
                  }
                },
                "approved_artifacts": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["path"],
                    "properties": {
                      "path": {"type": "string"}
                    }
                  }
                },
                "inconclusive": {"type": "boolean"}
              }
            }

      - name: Run Codex core reviewer 2
        id: codex_reviewer_2
        if: steps.credentials.outputs.available == 'true' && steps.ctx.outputs.core_review_required == 'true' && steps.ctx.outputs.adapter == 'codex' && steps.ctx.outputs.profile == 'strict'
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .agent-skill-chain/runtime/codex-core-review-prompt.txt
          model: gpt-5.6-sol
          effort: xhigh
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          output-schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["conformance", "falsification", "blockers", "approved_artifacts", "inconclusive"],
              "properties": {
                "conformance": {"type": "string", "enum": ["pass", "fail", "pending"]},
                "falsification": {"type": "string", "enum": ["pass", "fail", "pending"]},
                "blockers": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["severity", "origin", "code", "evidence"],
                    "properties": {
                      "severity": {"type": "string", "enum": ["blocking", "warning", "info"]},
                      "origin": {"type": "string", "enum": ["specification", "design", "implementation", "validation"]},
                      "code": {"type": "string"},
                      "evidence": {"type": "array", "items": {"type": "string"}}
                    }
                  }
                },
                "approved_artifacts": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["path"],
                    "properties": {
                      "path": {"type": "string"}
                    }
                  }
                },
                "inconclusive": {"type": "boolean"}
              }
            }

      - name: Record Codex core reviewer verdicts
        id: codex_judgment
        if: always() && steps.credentials.outputs.available == 'true' && steps.ctx.outputs.core_review_required == 'true' && steps.ctx.outputs.adapter == 'codex'
        env:
          CODEX_VERDICT_1: ${{ steps.codex_reviewer_1.outputs.final-message }}
          CODEX_VERDICT_2: ${{ steps.codex_reviewer_2.outputs.final-message }}
          REVIEWER_1_OUTCOME: ${{ steps.codex_reviewer_1.outcome }}
          REVIEWER_2_OUTCOME: ${{ steps.codex_reviewer_2.outcome }}
          REVIEW_PROFILE: ${{ steps.ctx.outputs.profile }}
        run: |
          EXPECTED=1
          REVIEWERS_AVAILABLE=true
          if [ "$REVIEWER_1_OUTCOME" != "success" ]; then REVIEWERS_AVAILABLE=false; fi
          if [ "$REVIEW_PROFILE" = "strict" ]; then
            EXPECTED=2
            if [ "$REVIEWER_2_OUTCOME" != "success" ]; then REVIEWERS_AVAILABLE=false; fi
          fi

          set +e
          if [ "$REVIEWERS_AVAILABLE" = "true" ]; then
            VERDICT_FILE="$RUNNER_TEMP/codex-core-review-verdicts.json"
            node -e 'const verdicts=[JSON.parse(process.env.CODEX_VERDICT_1)]; if (process.env.REVIEW_PROFILE === "strict") verdicts.push(JSON.parse(process.env.CODEX_VERDICT_2)); process.stdout.write(JSON.stringify(verdicts));' > "$VERDICT_FILE"
            node bin/agents-md.js gate record-verdict \
              "${{ steps.review.outputs.report_path }}" "$GITHUB_WORKSPACE" "$EXPECTED" < "$VERDICT_FILE"
            CODE=$?
          else
            node bin/agents-md.js gate mark-human-required "${{ steps.review.outputs.report_path }}"
            CODE=1
          fi
          if [ "$CODE" -ne 0 ]; then
            node bin/agents-md.js gate mark-human-required "${{ steps.review.outputs.report_path }}"
            echo "outcome=error" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=completed" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          set -e

      # コア以外は、config で選択した provider 固有アダプタの launch_gate_reviewer を使う。
      # 終了コードで後続を分岐する（絶対に崩さない不変契約・AGENTS.md I8）:
      #   0        判定完了 → verify + publish
      #   3        deferred（human 非同期）→ publish が action_required 発行・pending 拒否スキップ・job 緑
      #   その他    error → publish が action_required 発行（フェイルセーフ）+ 末尾で step を赤に可視化
      # レビュア認証は secrets を env で渡す（実値はログに出さない）。
      - name: Run gate reviewer judgment (${{ matrix.gate }})
        if: steps.credentials.outputs.available == 'true' && steps.ctx.outputs.core_review_required != 'true'
        id: adapter_judgment
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ steps.ctx.outputs.adapter == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.ctx.outputs.adapter == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          OPENAI_API_KEY: ${{ steps.ctx.outputs.adapter == 'codex' && secrets.OPENAI_API_KEY || '' }}
          ASC_BASE_REF: origin/${{ github.base_ref }}
          ASC_REVIEW_SUBJECT: ${{ steps.ctx.outputs.review_subject }}
          CLAUDE_CORE_REVIEW_MODEL: ${{ steps.ctx.outputs.adapter == 'claude' && vars.CLAUDE_CORE_REVIEW_MODEL || '' }}
          CLAUDE_CORE_REVIEW_MODEL_TIER: ${{ steps.ctx.outputs.adapter == 'claude' && vars.CLAUDE_CORE_REVIEW_MODEL_TIER || '' }}
          CLAUDE_CORE_REVIEW_REASONING_TIER: ${{ steps.ctx.outputs.adapter == 'claude' && vars.CLAUDE_CORE_REVIEW_REASONING_TIER || '' }}
          CLAUDE_CORE_REVIEW_REASONING_PROBE_CMD: ${{ steps.ctx.outputs.adapter == 'claude' && vars.CLAUDE_CORE_REVIEW_REASONING_PROBE_CMD || '' }}
        run: |
          set +e
          ./.agent-skill-chain/scripts/gate-launch-reviewer.sh \
            "${{ steps.ctx.outputs.issue_id }}" "${{ matrix.gate }}" "${{ steps.ctx.outputs.profile }}" \
            "${{ steps.review.outputs.report_path }}" "${{ steps.ctx.outputs.target_sha }}"
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo "outcome=completed" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -eq 3 ]; then
            echo "outcome=deferred" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=error" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # 判定完了時のみスキーマ検証を通す（deferred/error は human_required で schema 準拠のまま publish へ）。
      - name: Verify gate report schema
        if: steps.codex_judgment.outputs.outcome == 'completed' || steps.adapter_judgment.outputs.outcome == 'completed'
        run: ./.agent-skill-chain/ci/verify-gate-report.sh "${{ steps.review.outputs.report_path }}"

      # completed/deferred/error のいずれでも publish する。final に応じ success/failure/action_required を発行し、
      # 真に未レビュー（final==pending）のみ拒否する（起動失敗を決して success にしない＝I8）。
      - name: Publish gate report
        if: always() && (steps.codex_judgment.outputs.outcome != '' || steps.adapter_judgment.outputs.outcome != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.agent-skill-chain/scripts/gate-publish.sh "${{ steps.ctx.outputs.issue_id }}" "${{ steps.review.outputs.report_path }}"

      # error（起動失敗・timeout・未構成）は publish で action_required を発行したうえで、step を赤にして
      # 可視化する（merge は action_required で停止済み。ここでの失敗は「判定が完了しなかった」ことの通知）。
      - name: Surface reviewer error
        if: always() && (steps.codex_judgment.outputs.outcome == 'error' || steps.adapter_judgment.outputs.outcome == 'error')
        run: |
          echo "ゲートレビュア判定が完了しませんでした（Codex Action exit=${{ steps.codex_judgment.outputs.code }}, launch_gate_reviewer exit=${{ steps.adapter_judgment.outputs.code }}）。gate は action_required（merge blocked）です。" >&2
          exit 1
