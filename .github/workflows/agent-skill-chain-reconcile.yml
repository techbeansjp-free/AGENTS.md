# 正本: AGENTS.md §ゲートの継承・無効化
#
# PR headへのpush（synchronize）ごとに、承認済み成果物digestを対象commit SHAへ照合する。変化なしなら最新SHAへ
# 成功を再発行し、変化ありなら当該ゲートと全下流ゲートを無効化する
# （.agent-skill-chain/scripts/gate-reconcile.sh、判定ルールは
# .agent-skill-chain/schemas/gate-report.schema.yaml末尾を参照）。agent-skill-chain CLI
# （src/agents-md.ts、ビルド後 bin/agents-md.js）への薄いラッパーであるため、検査本体の前に
# ビルドを行う。
name: agent-skill-chain / reconcile

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  checks: write
  pull-requests: read
  actions: read

jobs:
  reconcile:
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected base trust root
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch target as read-only Git object
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/agent-skill-chain/targets/${HEAD_SHA}"

      - name: Detect unmigrated reconcile workflow
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TARGET_WORKFLOW="$(git show "refs/agent-skill-chain/targets/${HEAD_SHA}:.github/workflows/agent-skill-chain-reconcile.yml")"
          if [[ "$TARGET_WORKFLOW" != *"pull_request_target:"* ]]; then
            echo "::warning::PR head still contains the unmigrated push-triggered reconcile workflow; merge the default branch before trusting reconcile results"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Derive issue_id
        id: ctx
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          ISSUE_ID="ISSUE-$(echo "$BRANCH" | sed -E 's#^[^/]+/([0-9]+)-.*#\1#')"
          if [[ "$ISSUE_ID" =~ ^ISSUE-[0-9]+$ ]]; then
            echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
            echo "skip_checks=false" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == dependabot/* ]]; then
            if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
              echo "issue_id=" >> "$GITHUB_OUTPUT"
              echo "skip_checks=true" >> "$GITHUB_OUTPUT"
            else
              echo "ブランチ '$BRANCH' は dependabot/ 形式ですが、PR作成者が dependabot[bot] ではありません（実測: ${PR_AUTHOR:-なし}）。Dependabot許可リストに該当しないため照合をスキップできません" >&2
              exit 1
            fi
          elif [[ "$BRANCH" == chore/root-cleanup-* ]]; then
            echo "issue_id=" >> "$GITHUB_OUTPUT"
            echo "skip_checks=true" >> "$GITHUB_OUTPUT"
          else
            echo "ブランチ名 '$BRANCH' から issue_id を抽出できません（.agent-skill-chain/config/agent-skill-chain.yaml branch.pattern に非適合、かつ Dependabot許可リストにも非該当）" >&2
            exit 1
          fi

      - name: Reconcile gates against pushed SHA
        if: steps.ctx.outputs.skip_checks != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.agent-skill-chain/scripts/gate-reconcile.sh "${{ steps.ctx.outputs.issue_id }}" "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.number }}"
