name: v0.5 Linux品質検証
on:
  pull_request:
permissions:
  contents: read
# 同じPRへの新しいpushで、古いcommitの実行を止める（#1714）。
# 手動の再実行（run_attempt > 1）と PR 番号のない event は固有の group に入れ、最新 commit の実行を取り消さない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}${{ github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare Linux isolation
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor-profiles bubblewrap
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          /usr/bin/bwrap --unshare-all --die-with-parent --new-session --ro-bind / / -- /bin/true
      - name: Prepare per-invocation lifecycle and resource verification
        run: |
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show --property=Version
      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts
      - name: Test harness including Linux isolation
        env:
          ASC_TEST_CGROUP: "1"
          # テストの増え方の報告（#1732）のため、各テストの時間を junit でも記録する。表示は既定の spec のまま。
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=${{ runner.temp }}/asc-test-results.xml
        run: npm run quality
      - name: Inspect standard unpublished distribution
        run: npm pack --dry-run --json
      # テストの増え方を job summary と warning annotation に出す（#1732）。報告だけで、この job を失敗にしない。
      # 比較の基点は PR の merge-base。base branch の先端と比べると、ほかの PR の増減が混ざる。
      - name: Find the merge base for the test growth report
        id: test-growth-base
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE: repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: echo "sha=$(gh api "$COMPARE" --jq .merge_base_commit.sha)" >> "$GITHUB_OUTPUT"
      - name: Fetch base tests for the test growth report
        if: ${{ !cancelled() && steps.test-growth-base.outputs.sha != '' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.test-growth-base.outputs.sha }}
          path: .asc-test-growth-base
          persist-credentials: false
          sparse-checkout: test
      - name: Report test growth (warning only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/test-growth-report.mjs --base=.asc-test-growth-base --head=. "--junit=${{ runner.temp }}/asc-test-results.xml"
      - name: TEMPORARY upload junit for measurement (#1732)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: asc-test-results
          path: ${{ runner.temp }}/asc-test-results.xml
  host-protocol:
    name: Host protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record actual platform
        run: node -e "console.log(JSON.stringify({platform:process.platform,arch:process.arch,release:require('node:os').release()}))"
      - name: Host transport, native diagnostic result validation and real Git
        run: node --test test/test_host_execution.mjs test/test_native_probe.mjs test/test_host_process.mjs test/test_stdin_file.mjs
      - name: Exact verification Git reconstruction
        run: node --test --test-name-pattern="verification Git reconstructs" test/test_controller.mjs
