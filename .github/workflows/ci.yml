name: v0.5 Linux品質検証
on:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare Linux isolation
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor-profiles bubblewrap
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          /usr/bin/bwrap --unshare-all --die-with-parent --new-session --ro-bind / / -- /bin/true
      - name: Prepare per-invocation lifecycle and resource verification
        run: |
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show --property=Version
      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts
      - name: Test harness including Linux isolation
        env:
          ASC_TEST_CGROUP: "1"
        run: npm run quality
      - name: Inspect standard unpublished distribution
        run: npm pack --dry-run --json
  host-protocol:
    name: Host protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record actual platform
        run: node -e "console.log(JSON.stringify({platform:process.platform,arch:process.arch,release:require('node:os').release()}))"
      - name: Host transport, native diagnostic result validation and real Git
        run: node --test test/test_host_execution.mjs test/test_native_probe.mjs
      - name: Exact verification Git reconstruction
        run: node --test --test-name-pattern="verification Git reconstructs" test/test_controller.mjs
