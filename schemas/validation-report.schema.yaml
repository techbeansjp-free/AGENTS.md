# 正本: AGENTS.md §不変条件I7 / memo/システム刷新/システム刷新.md §A-9
# 全AC-IDと検証方法・証跡の対応を記録する。孤児AC・孤児テスト参照を禁止する（I7）。
# 自動化可能なACは自動テストを必須。手動/混合は理由・手順・結果・証跡・実行者を必須とする。
$schema: http://json-schema.org/draft-07/schema#
schema_version: agent-skill-chain/validation-report/v1
title: agent-skill-chain validation report
type: object
required: [schema_version, issue_id, target_sha, acceptance_criteria]
additionalProperties: false
properties:
  schema_version:
    const: agent-skill-chain/validation-report/v1
  issue_id:
    type: string
    pattern: '^ISSUE-[0-9]+$'
  target_sha:
    type: string
  acceptance_criteria:
    type: array
    minItems: 1
    items:
      type: object
      required: [ac_id, verification, evidence]
      additionalProperties: false
      properties:
        ac_id:
          type: string
          pattern: '^AC-[0-9]+$'
        verification:
          type: object
          required: [mode, result]
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [automated, manual, hybrid]
            result:
              type: string
              enum: [pass, fail]
            reason:
              type: string
              description: "mode=manual|hybrid の場合必須: 自動化できない理由"
            procedure:
              type: string
              description: "mode=manual|hybrid の場合必須: 検証手順"
            executor:
              type: string
              description: "mode=manual|hybrid の場合必須: 実行者または実行エージェント"
        evidence:
          type: array
          items: {type: string}
          minItems: 1
  regression:
    type: object
    additionalProperties: false
    properties:
      executed: {type: boolean}
      evidence: {type: array, items: {type: string}}

# mode=manual|hybrid の場合、reason・procedure・executor の3項目は required とみなす
# （JSON Schemaのif/thenで強制する場合は ci/verify-ac-coverage.sh 側の実装で担保する）。

examples:
  - schema_version: agent-skill-chain/validation-report/v1
    issue_id: ISSUE-123
    target_sha: abc123
    acceptance_criteria:
      - ac_id: AC-1
        verification: {mode: automated, result: pass}
        evidence: ['test/ac1.spec.ts']
      - ac_id: AC-2
        verification:
          mode: manual
          result: pass
          reason: "UI手触りの確認は自動化不可"
          procedure: "ブラウザでXフローを操作し目視確認"
          executor: claude
        evidence: ['issues/123/evidence/ac2-screenshot.png']
    regression: {executed: true, evidence: ['ci-run:12345']}
