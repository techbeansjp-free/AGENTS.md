# agent-skill-chain 設定初期値
# 正本: AGENTS.md §設定
#
# 項目追加は以下の手順を必須とする（内部で固定できる値は設定に出さない）:
#   ①ハードコードでは対応できない理由の提示
#   ②利用者/プロジェクト単位で変わる必要性の提示
#   ③schema_version の更新
#   ④既定値の定義
#   ⑤migration/後方互換性の定義
#   ⑥必要なら ADR の作成

schema_version: agent-skill-chain/config/v1

profile: standard            # standard | lightweight（既定プロファイル。ADR-0023）

coordination:
  backend: github            # github | local

durability:
  backend: remote             # remote | local_mirror

autonomy:
  default: gated               # gated | full

risk:
  default: unclassified        # unclassified | normal | high

review:
  adapter: claude                # claude | codex | human（判定ステップが起動する launch_gate_reviewer 実体）
  standard: {reviewer_count: 1, modes: [conformance, falsification]}
  strict:   {reviewer_count: 2, trigger: {risk_not_normal: true, autonomy_full: true}}

# worker: セグメント作業ワーカー（spec/design/implementation/validation）を起動する実行系アダプタと
# モデル選択の恒久設定（正本: AGENTS.md §設定、ADR-0015）。
# 恒久設定の変更操作・実行主体・タイミング: 変更は本ファイルの直接編集で行う（専用の書き換え
# コマンドは存在しない）。具体的なモデル文字列を書いてよいのは model_tiers だけであり、モデル
# 世代の更新時はこの対応表の値だけを書き換える（segment_overrides・スキーマ・アダプタのソース
# には書かない）。実行主体は writer lease を保持するセグメント作業ワーカーであり、当該変更を
# 扱う Issue の実装セグメントで編集する。進行役は調整状態（Issue・ラベル・PR review証跡・
# マージ・worktree ライフサイクル）のみを読み書きし（不変条件I5）、この設定ファイルという
# 成果物側の資産は編集しない——対話で「実装は◯◯で」等の指示を受けた場合、進行役はその内容を
# Issue へ記録しワーカーを起動することに限って関与する。現在の解決結果は
# `agent-skill-chain worker context <issue_id> <segment>` で確認できる。
worker:
  adapter: claude                # claude | codex | human（segment_overridesが無いセグメントの既定。未設定時は human）
  # Agent tool経由の起動は、進行役セッションとの生存期間結合など既知の制約を伴う。
  # Claude Code CLIセッション・claude adapterの条件が揃った場合に使い、明示的なfalseで無効化できる。
  agent_tool_dispatch:
    enabled: true
  segment_overrides:
    # ISSUE-307 AC-6: 実装セグメントを codex・ティアhighest_capability・reasoning effort highへ
    # 恒久設定する。具体的なモデル文字列はここに書かない（唯一の保持場所は下記 model_tiers）。
    implementation: {adapter: codex, model_tier: highest_capability, reasoning_effort: high}
  model_tiers:
    # ティア名と実行系アダプタの組から具体的なモデル文字列を与える対応表。本 Issue で具体的な
    # モデル文字列を置く唯一の場所（ADR-0015）。モデル世代の更新はこの値の書き換えだけで完結する。
    highest_capability: {codex: gpt-5.6-sol}

worktree:
  root: .worktrees
  path_pattern: "{issue_created_at}-{type}-{issue_id}-{slug}"
  timestamp: {source: issue_created_at, format: "%Y%m%d_%H%M%S", timezone: Asia/Tokyo}
  slug_max_length: 48
  immutable_path: true

branch:
  pattern: "{type}/{issue_id}-{slug}"

issue:
  allowed_types: [feature, bugfix, hotfix, refactor, docs, process, chore]

wip:
  limit: 3
  count_by: active_writer_lease

lease:
  ttl_seconds: 3600
  renewal_interval_seconds: 900

bdd:
  profile: standard            # standard | strict

# issue_sync: GitHubモードで、ゲート通過ごとに成果物全文とゲート状態を GitHub Issue/PR 本文の
# 固定マーカー区間へ一方向転記する（ADR-0021、既定値はISSUE-567で改定）。既定は有効であり、
# GitHubモードではGitHub Issueが正本であるべきという方針に基づく。明示的に `enabled: false`
# を設定すれば無効化でき、本文へ一切書き込まれない従前の挙動を維持できる。ローカルモードでは
# 常に無効として扱う。
#   enabled:        オプトアウトの可否。有効化されたプロジェクトでは成果物内容の正本が Issue/PR
#                   本文へ移るため、ハードコードできずプロジェクト単位で選択できる必要がある。
#   target:         転記先。Issue 中心の運用か PR 中心の運用かはプロジェクトで異なる。
#                   pr_body/both は当該Issueに紐づく open な PR が一意に定まる場合のみ転記する。
#   max_body_chars: 転記後の本文全体の上限。超過時は全文を書かず Git 側参照の案内文へ切り替える。
#                   人間記述部分の分量・GitHub 側上限の将来変更に依存するため設定で持つ。
# 転記対象ファイル集合・正本の対応関係・上限超過時の方式は選択の余地が無いため設定に出さない。
issue_sync:
  enabled: true                # false にするとゲート通過時のIssue/PR本文への全文転記を無効化する
  target: issue_body           # issue_body | pr_body | both
  max_body_chars: 60000        # GitHub の本文上限 65536 に対する安全側の既定値

# merge: 進行役（AIエージェント）が `agent-skill-chain pr merge` コマンド自体でPRマージを
# 実行してよいかの opt-in（Issue #427）。既定は false（未設定含む）であり、consumer
# プロジェクトでは人間の明示的なマージを既定とする。本リポジトリ（techbeansjp-free/AGENTS.md
# 自身）は、ユーザーが進行役による自走的マージ運用を明示承認済みの開発環境であるため true。
# `autonomy: gated | full`（レビュー厳格度の制御）とは独立した別軸であり、混同しない。
# auto_update_branch（Issue #493）: 対象PRのhead branchがbase branchに対して最新でない
# （behind）と判明した場合に、`gh api -X PUT .../update-branch` による自動最新化を試みてよいかの
# opt-in。既定は未設定＝false（最新化を試みず日本語エラーで中断する安全側の既定挙動）。本項目は
# 明示的にオプトインしない限り true にしない（要件2）。本リポジトリでも現時点では未設定のまま
# （behind時は日本語エラーで中断し人間判断へ委ねる）とする。
# 進行役がこの設定を有効化する、または update-branch API を直接呼び出すことは、ローカルでコミットを
# 作成せず GitHub 側でサーバーサイドのマージ／調整状態操作を行うため、I5 違反ではない。
merge:
  autonomous: true

# human_confirmation: 実装セグメント着手前（`segment start <issue_id> implementation`）に人間の
# 明示的な確認を要求するかの opt-in（Issue #427、`merge.autonomous` と同じ精神の独立した設定）。
# 既定は before_implementation: true 相当（未設定含む）であり、consumer プロジェクトでは着手前に
# 人間確認を要求する。本リポジトリは merge.autonomous と同様に自走的な実装セグメント起動を
# 明示承認済みの開発環境であるため false（＝人間確認を省略する）。真偽の極性が merge.autonomous
# と逆であることに注意（本フィールドは「確認要否」、merge.autonomous は「自動実行の許可」）。
human_confirmation:
  before_implementation: false

templates:
  github_source: .agent-skill-chain/templates/github/.github
  github_target: .github
  claude_agents_source: .agent-skill-chain/templates/claude/agents
  claude_agents_target: .claude/agents
  verify_sync: true

checks:
  spec: agent-skill-chain/spec-gate
  design: agent-skill-chain/design-gate
  implementation: agent-skill-chain/implementation-gate
  validation: agent-skill-chain/validation-gate
