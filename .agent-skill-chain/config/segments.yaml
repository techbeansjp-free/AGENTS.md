# 固定4セグメントの入出力マニフェスト。
# 正本: AGENTS.md §4セグメント・4ゲート / memo/システム刷新/システム刷新.md §A-3
#
# セグメント自体の追加・変更は破壊的変更とする。
# 変更には ADR 作成 + AGENTS.md 改定 + schema_version 更新 + migration を要する。
# 検証は schemas/segments.schema.yaml。

schema_version: agent-skill-chain/segments/v1
segments:
  - {id: spec,           outputs: [SPEC.md],                                                next: design}
  - {id: design,         outputs: [DESIGN.md, ADR, PLAN.md],                                 next: implementation}
  - {id: implementation, outputs: [code, unit_test_results],                                 next: validation}
  - {id: validation,     outputs: [acceptance_test_results, regression_test_results, pr],    next: completed}
