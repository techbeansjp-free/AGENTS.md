# 正本: AGENTS.md §GitHub配布・マルチAI対応
# scripts/setup-labels.sh が GitHub Labels API へ適用する定義。
labels:
  - name: "type:feature"
    color: "1d76db"
    description: "新しい機能・振る舞いの追加"
  - name: "type:bugfix"
    color: "d73a4a"
    description: "既存の振る舞いの不具合修正"
  - name: "type:hotfix"
    color: "b60205"
    description: "本番に影響する緊急の不具合修正"
  - name: "type:refactor"
    color: "5319e7"
    description: "外部から観測できる振る舞いを変えない内部構造の改善"
  - name: "type:docs"
    color: "0075ca"
    description: "資料の追加・修正"
  - name: "type:process"
    color: "6f42c1"
    description: "開発プロセス・運用規約自体の変更"
  - name: "risk:unclassified"
    color: "fbca04"
    description: "リスク未分類（既定値。Strictレビュープロファイルが適用される）"
  - name: "risk:normal"
    color: "0e8a16"
    description: "通常リスク"
  - name: "risk:high"
    color: "e11d21"
    description: "高リスク（Strictレビュープロファイルが適用される）"
  - name: "autonomy:gated"
    color: "c5def5"
    description: "既定の自走範囲。各ゲートで停止しうる"
  - name: "autonomy:full"
    color: "bfd4f2"
    description: "完全自走（Strictレビュープロファイルが適用される）。人間の明示的オプトインが必要"
  - name: "risk-upgrade-approved"
    color: "f9d0c4"
    description: "autonomy/riskの既定値を緩める変更を人間が明示的に承認したことを示す（AGENTS.md 不変条件I8）"
  - name: "review:core-audit"
    color: "b60205"
    description: "コア資産の監査を明示し、frontier coding・maximum reasoningのStrict独立レビューを要求する"
