# Issue #283のtrusted rollout完了前は、candidate branchのコードでgate Checkを継承・無効化しない。
# push trigger自体は配布互換のため残すが、このworkflowは明示的な停止契約としてno-opにする。
name: agent-skill-chain / reconcile

on:
  push:
    branches-ignore: [main, 'chore/root-cleanup-*']

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Stop legacy reconciliation until trusted rollout
        run: |
          echo "Issue #283 trusted rollout is required before canonical gate Check reconciliation."
