# Default-main trust rootだけが専用GitHub App Checkを記録する。App tokenはNode内のdirect fetchだけで使う。
# 専用App installation権限: Checks write、Commit statuses write、Metadata read。
name: agent-skill-chain / trusted gate recorder
run-name: gate-record-${{ github.event.client_payload.pr_number }}-${{ github.event.client_payload.gate }}-${{ github.event.client_payload.target_sha }}

on:
  repository_dispatch:
    types: [agent-skill-chain-gate-record]

permissions:
  contents: read
  pull-requests: read
  issues: write
  attestations: write
  id-token: write
  artifact-metadata: write

concurrency:
  group: gate-record-${{ github.repository }}-${{ github.event.client_payload.pr_number }}-${{ github.event.client_payload.gate }}
  cancel-in-progress: false

jobs:
  record:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    environment: agent-skill-chain-gate-bootstrap-v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed default-main trust root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build

      - name: Validate dispatch payload allowlist
        id: payload
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: node bin/agents-md.js gate record-trusted-check validate >> "$GITHUB_OUTPUT"

      - name: Fetch target as a read-only Git object
        env:
          PR_NUMBER: ${{ steps.payload.outputs.pr_number }}
          TARGET_SHA: ${{ steps.payload.outputs.target_sha }}
        run: |
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/agent-skill-chain/targets/${TARGET_SHA}"
          test "$(git rev-parse "refs/agent-skill-chain/targets/${TARGET_SHA}^{commit}")" = "$TARGET_SHA"

      - name: Prepare dedicated-App in-progress Check and envelope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          ASC_GATE_APP_ID: ${{ vars.ASC_GATE_APP_ID || secrets.ASC_GATE_APP_ID }}
          ASC_GATE_APP_PRIVATE_KEY: ${{ secrets.ASC_GATE_APP_PRIVATE_KEY }}
        run: |
          node bin/agents-md.js gate record-trusted-check prepare \
            "$RUNNER_TEMP/trusted-gate-state.json" \
            "$RUNNER_TEMP/agent-skill-chain-gate-attestation.json"

      - name: Attest exact gate envelope
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: ${{ runner.temp }}/agent-skill-chain-gate-attestation.json

      - name: Verify signer workflow, ref, digest, and certificate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          gh attestation verify "$RUNNER_TEMP/agent-skill-chain-gate-attestation.json" \
            -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/agent-skill-chain-trusted-gate.yml" \
            --source-ref refs/heads/main \
            --signer-digest "$GITHUB_WORKFLOW_SHA" \
            --format json > "$RUNNER_TEMP/trusted-gate-verification.json"

      - name: Finalize dedicated-App Check as the last operation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          ASC_GATE_APP_ID: ${{ vars.ASC_GATE_APP_ID || secrets.ASC_GATE_APP_ID }}
          ASC_GATE_APP_PRIVATE_KEY: ${{ secrets.ASC_GATE_APP_PRIVATE_KEY }}
        run: |
          node bin/agents-md.js gate record-trusted-check finalize \
            "$RUNNER_TEMP/trusted-gate-state.json" \
            "$RUNNER_TEMP/agent-skill-chain-gate-attestation.json" \
            "$RUNNER_TEMP/trusted-gate-verification.json"
