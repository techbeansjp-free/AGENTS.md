# protected baseのtrusted verifierだけを実行する。PR headはGit objectとして読み、codeを実行しない。
# AI reviewはローカルadapterが行い、本workflowはGitHub Review API証跡の検証とCheck Run記録だけを担う。
name: agent-skill-chain / gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  detect-segments:
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.segments.outputs.matrix }}
      issue_id: ${{ steps.context.outputs.issue_id }}
      target_sha: ${{ steps.context.outputs.target_sha }}
      base_sha: ${{ steps.context.outputs.base_sha }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      profile: ${{ steps.context.outputs.profile }}
      review_subject: ${{ steps.context.outputs.review_subject }}
    steps:
      - name: Checkout protected base trust root
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch target as read-only Git object
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/agent-skill-chain/targets/${HEAD_SHA}"

      - name: Resolve immutable context
        id: context
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          ISSUE_ID="ISSUE-$(echo "$BRANCH" | sed -E 's#^[^/]+/([0-9]+)-.*#\1#')"
          if ! [[ "$ISSUE_ID" =~ ^ISSUE-[0-9]+$ ]]; then
            echo "branchからIssue IDを解決できません: $BRANCH" >&2
            exit 1
          fi
          PROFILE=standard
          if ! echo "$LABELS_JSON" | grep -q '"risk:normal"'; then PROFILE=strict; fi
          if echo "$LABELS_JSON" | grep -q '"autonomy:full"'; then PROFILE=strict; fi
          if echo "$LABELS_JSON" | grep -q '"review:core-audit"'; then PROFILE=strict; fi
          REVIEW_SUBJECT=ordinary
          if echo "$LABELS_JSON" | grep -q '"review:core-audit"'; then REVIEW_SUBJECT=core_audit; fi
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "target_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "review_subject=$REVIEW_SUBJECT" >> "$GITHUB_OUTPUT"

      - name: Detect started segments without executing target code
        id: segments
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          HEAD_SHA: ${{ steps.context.outputs.target_sha }}
        run: |
          SEGMENTS=""
          while IFS= read -r changed; do
            case "$changed" in
              SPEC.md) SEGMENTS="$SEGMENTS spec" ;;
              DESIGN.md|PLAN.md|docs/adr/*) SEGMENTS="$SEGMENTS design" ;;
              VALIDATION.md) SEGMENTS="$SEGMENTS validation" ;;
              src/*|test/*|package.json|package-lock.json|tsconfig.json|.agent-skill-chain/*|.github/*)
                SEGMENTS="$SEGMENTS implementation" ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          MATRIX="$(for segment in spec design implementation validation; do
            if [[ " $SEGMENTS " == *" $segment "* ]]; then echo "$segment"; fi
          done | jq -R . | jq -s -c .)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  verify-and-publish:
    needs: detect-segments
    if: github.event.pull_request.base.ref == github.event.repository.default_branch && needs.detect-segments.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.detect-segments.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected base trust root
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-segments.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch target as read-only Git object
        env:
          HEAD_SHA: ${{ needs.detect-segments.outputs.target_sha }}
          PR_NUMBER: ${{ needs.detect-segments.outputs.pr_number }}
        run: git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/agent-skill-chain/targets/${HEAD_SHA}"

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build

      - name: Verify local-review evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ runner.temp }}/gate-${{ matrix.gate }}.yaml
          GATE_ID: ${{ matrix.gate }}
          HEAD_SHA: ${{ needs.detect-segments.outputs.target_sha }}
        run: |
          set +e
          node bin/agents-md.js gate verify-evidence \
            "${{ needs.detect-segments.outputs.issue_id }}" "${{ matrix.gate }}" \
            "${{ needs.detect-segments.outputs.profile }}" "${{ needs.detect-segments.outputs.target_sha }}" \
            "${{ needs.detect-segments.outputs.base_sha }}" "${{ needs.detect-segments.outputs.pr_number }}" \
            "$REPORT_PATH" "${{ needs.detect-segments.outputs.review_subject }}"
          CODE=$?
          set -e
          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -ne 0 ]; then
            node -e 'console.log(JSON.stringify({name: `agent-skill-chain/${process.env.GATE_ID}-gate`, head_sha: process.env.HEAD_SHA, status: "completed", conclusion: "action_required", output: {title: "gate evidence verification failed", summary: "Protected-base verifier could not validate local-review evidence; merge remains blocked."}}))' |
              gh api -X POST "repos/${{ github.repository }}/check-runs" --input -
            exit "$CODE"
          fi
      - name: Verify gate report schema
        run: ./.agent-skill-chain/ci/verify-gate-report.sh "${{ steps.evidence.outputs.report_path }}"

      - name: Publish Check Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.agent-skill-chain/scripts/gate-publish.sh "${{ needs.detect-segments.outputs.issue_id }}" "${{ steps.evidence.outputs.report_path }}"
