# 正本: AGENTS.md §4セグメント・4ゲート
# .agent-skill-chain/config/segments.yaml（固定4セグメントの入出力マニフェスト）自体の構造を検査するスキーマ。
# セグメントの追加・変更は破壊的変更（ADR + AGENTS.md改定 + schema_version更新 + migration必須）。
$schema: http://json-schema.org/draft-07/schema#
schema_version: agent-skill-chain/segments/v1
title: agent-skill-chain segments manifest
type: object
required: [schema_version, segments]
additionalProperties: false
properties:
  schema_version:
    const: agent-skill-chain/segments/v1
  segments:
    type: array
    minItems: 4
    maxItems: 4
    items:
      type: object
      required: [id, outputs, next]
      additionalProperties: false
      properties:
        id:
          type: string
          enum: [spec, design, implementation, validation]
        outputs:
          type: array
          items: {type: string}
          minItems: 1
        next:
          type: string
          enum: [design, implementation, validation, completed]

examples:
  - schema_version: agent-skill-chain/segments/v1
    segments:
      - {id: spec, outputs: [SPEC.md], next: design}
      - {id: design, outputs: [DESIGN.md, ADR, PLAN.md], next: implementation}
      - {id: implementation, outputs: [code, unit_test_results], next: validation}
      - {id: validation, outputs: [acceptance_test_results, regression_test_results, pr], next: completed}
