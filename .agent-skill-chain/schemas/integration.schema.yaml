# 正本: AGENTS.md §4セグメント・4ゲート・§不変条件I4
# 1 Issue = 1 PR の集約状態。GitHubモードでは実PRの補助記録、ローカルモードでは
# Integration Recordが正本となる（GitHub未連携時のDraft PR相当）。
$schema: http://json-schema.org/draft-07/schema#
schema_version: agent-skill-chain/integration/v1
title: agent-skill-chain integration record
type: object
required: [schema_version, issue_id, branch, status, closes, gates]
additionalProperties: false
properties:
  schema_version:
    const: agent-skill-chain/integration/v1
  issue_id:
    type: string
    pattern: '^ISSUE-[0-9]+$'
  branch:
    type: string
  pr_url:
    type: string
    description: GitHubモードのみ。ローカルモードでは省略する。
  status:
    type: string
    enum: [draft, ready_for_review, merged, closed]
  head_sha:
    type: string
    pattern: '^[0-9a-f]{40}$'
    description: statusをmerged/closedへ遷移した時点で統合済みとして記録したIssueブランチのcommit SHA。
  closes:
    type: string
    pattern: '^ISSUE-[0-9]+$'
  gates:
    type: object
    required: [spec, design, implementation, validation]
    additionalProperties: false
    properties:
      spec: {type: string, enum: [pending, approved, rejected]}
      design: {type: string, enum: [pending, approved, rejected]}
      implementation: {type: string, enum: [pending, approved, rejected]}
      validation: {type: string, enum: [pending, approved, rejected]}

examples:
  - schema_version: agent-skill-chain/integration/v1
    issue_id: ISSUE-123
    branch: feature/123-user-authentication
    pr_url: 'https://github.com/example/repo/pull/45'
    status: merged
    head_sha: '0123456789abcdef0123456789abcdef01234567'
    closes: ISSUE-123
    gates: {spec: approved, design: approved, implementation: pending, validation: pending}
