# 正本: AGENTS.md §プロジェクト固有ポリシー / memo/システム刷新/システム刷新.md §A-18
# consumer project 側 `.agent-skill-chain/project/manifest.yaml` の検証スキーマ。
# manifest に登録されていない文書は、存在するだけでは規約として扱わない
# （unregistered_documents_are_normative: false をCIが強制）。
$schema: http://json-schema.org/draft-07/schema#
schema_version: agent-skill-chain/project-policy/v1
title: agent-skill-chain project policy manifest
type: object
required: [schema_version, project, documents, precedence, constraints]
additionalProperties: false
properties:
  schema_version:
    const: agent-skill-chain/project-policy/v1
  project:
    type: object
    required: [id, policy_version]
    additionalProperties: false
    properties:
      id:
        type: string
      policy_version:
        type: integer
        minimum: 1
  documents:
    type: object
    required: [common, roles]
    additionalProperties: false
    properties:
      common:
        type: array
        items: {type: string}
      roles:
        type: object
        additionalProperties: false
        properties:
          spec:           {type: array, items: {type: string}}
          design:         {type: array, items: {type: string}}
          implementation: {type: array, items: {type: string}}
          validation:     {type: array, items: {type: string}}
  precedence:
    type: object
    required: [level, overrides]
    additionalProperties: false
    properties:
      level:
        const: project
      overrides:
        type: array
        items: {type: string, enum: [package-defaults, adapter-defaults]}
  constraints:
    type: object
    required: [may_override_core_invariants, unregistered_documents_are_normative]
    additionalProperties: false
    properties:
      may_override_core_invariants:
        const: false
      unregistered_documents_are_normative:
        const: false

# core invariant（プロジェクトポリシーで上書き不可、違反はCIが設定エラーとして実行停止）：
# main直接変更禁止(I4)、4セグメント・4ゲート(A-3)、reviewerの独立性・read-only(A-4)、
# writer lease(A-4)、Check Runとdigestによる承認(A-6)、checkpointへのpush必須(I3)、
# システム仕様とコードの同一PR発効、禁止語・secret scan、進行役の非執筆(I5)、
# サブエージェントが全体進行を制御しないこと(A-17)。

examples:
  - schema_version: agent-skill-chain/project-policy/v1
    project:
      id: agent-skill-chain
      policy_version: 1
    documents:
      common: [RULES.md]
      roles:
        spec: [roles/spec.md]
        design: [roles/design.md]
        implementation: [roles/implementation.md]
        validation: [roles/validation.md]
    precedence:
      level: project
      overrides: [package-defaults, adapter-defaults]
    constraints:
      may_override_core_invariants: false
      unregistered_documents_are_normative: false
