# 正本: AGENTS.md §プロジェクト固有ポリシー
# consumer project 側 `.agent-skill-chain/project/manifest.yaml` の検証スキーマ。
# manifest に登録されていない文書は、存在するだけでは規約として扱わない
# （unregistered_documents_are_normative: false をCIが強制）。
$schema: http://json-schema.org/draft-07/schema#
schema_version: agent-skill-chain/project-policy/v1
title: agent-skill-chain project policy manifest
type: object
required: [schema_version, project, documents, precedence, constraints]
additionalProperties: false
properties:
  schema_version:
    const: agent-skill-chain/project-policy/v1
  project:
    type: object
    required: [id, policy_version]
    additionalProperties: false
    properties:
      id:
        type: string
      policy_version:
        type: integer
        minimum: 1
  documents:
    type: object
    required: [common, roles]
    additionalProperties: false
    properties:
      common:
        type: array
        items: {type: string}
      roles:
        type: object
        additionalProperties: false
        properties:
          spec:           {type: array, items: {type: string}}
          design:         {type: array, items: {type: string}}
          implementation: {type: array, items: {type: string}}
          validation:     {type: array, items: {type: string}}
  precedence:
    type: object
    required: [level, overrides]
    additionalProperties: false
    properties:
      level:
        const: project
      overrides:
        type: array
        items: {type: string, enum: [package-defaults, adapter-defaults]}
  constraints:
    type: object
    required: [may_override_core_invariants, unregistered_documents_are_normative]
    additionalProperties: false
    properties:
      may_override_core_invariants:
        const: false
      unregistered_documents_are_normative:
        const: false
  model_selection:
    type: object
    required: [ordinary, core_review]
    additionalProperties: false
    properties:
      ordinary:
        type: object
        required: [behavior]
        additionalProperties: false
        properties:
          behavior: {const: explicit_selection}
      core_review:
        type: object
        required: [required_profile, unavailable, execution, capability, triggers, adapters]
        additionalProperties: false
        properties:
          required_profile: {const: strict}
          unavailable: {const: human_required}
          execution:
            type: object
            required: [reviewer_location, evidence_transport, ci_role, reviewer_count, trusted_reviewer_actors]
            additionalProperties: false
            properties:
              reviewer_location: {const: local}
              evidence_transport: {const: github_pr_review}
              ci_role: {const: verify_and_publish}
              reviewer_count: {type: integer, const: 2}
              trusted_reviewer_actors:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, minLength: 1}
          capability:
            type: object
            required: [model_tier, reasoning_tier]
            additionalProperties: false
            properties:
              model_tier: {const: frontier_coding}
              reasoning_tier: {const: maximum_reasoning}
          triggers:
            type: object
            required: [github_label, local_state_value, exact_paths, path_prefixes]
            additionalProperties: false
            properties:
              github_label: {const: "review:core-audit"}
              local_state_value: {const: core_audit}
              exact_paths:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, minLength: 1}
              path_prefixes:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, minLength: 1}
          adapters:
            type: object
            required: [codex, claude, human]
            additionalProperties: false
            properties:
              codex:
                type: object
                required: [model, reasoning_effort, override_attestation_env]
                additionalProperties: false
                properties:
                  model: {const: gpt-5.6-sol}
                  reasoning_effort: {const: xhigh}
                  override_attestation_env: {const: CODEX_CORE_REVIEWER_ATTESTED}
              claude:
                type: object
                required: [model_env, model_tier_env, reasoning_tier_env, reasoning_probe_env]
                additionalProperties: false
                properties:
                  model_env: {const: CLAUDE_CORE_REVIEW_MODEL}
                  model_tier_env: {const: CLAUDE_CORE_REVIEW_MODEL_TIER}
                  reasoning_tier_env: {const: CLAUDE_CORE_REVIEW_REASONING_TIER}
                  reasoning_probe_env: {const: CLAUDE_CORE_REVIEW_REASONING_PROBE_CMD}
              human:
                type: object
                required: [behavior]
                additionalProperties: false
                properties:
                  behavior: {const: human_required}

# core invariant（プロジェクトポリシーで上書き不可、違反はCIが設定エラーとして実行停止）：
# main直接変更禁止(I4)、4セグメント・4ゲート(A-3)、reviewerの独立性・read-only(A-4)、
# writer lease(A-4)、Check Runとdigestによる承認(A-6)、checkpointへのpush必須(I3)、
# システム仕様とコードの同一PR発効、禁止語・secret scan、進行役の非執筆(I5)、
# サブエージェントが全体進行を制御しないこと(A-17)。

examples:
  - schema_version: agent-skill-chain/project-policy/v1
    project:
      id: agent-skill-chain
      policy_version: 1
    documents:
      common: [RULES.md]
      roles:
        spec: [roles/spec.md]
        design: [roles/design.md]
        implementation: [roles/implementation.md]
        validation: [roles/validation.md]
    precedence:
      level: project
      overrides: [package-defaults, adapter-defaults]
    constraints:
      may_override_core_invariants: false
      unregistered_documents_are_normative: false
