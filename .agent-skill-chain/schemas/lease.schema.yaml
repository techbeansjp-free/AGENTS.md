# 正本: AGENTS.md §役割・権限・writer lease / memo/システム刷新/システム刷新.md §A-4
# 1 Issueにつき同時1つのwriter leaseのみを許可する。read-onlyレビュアはこのスキーマの対象外。
# 取得・更新・解放は各Coordination Backendのcompare-and-set相当の原子的処理で実装する。
$schema: http://json-schema.org/draft-07/schema#
schema_version: agent-skill-chain/lease/v1
title: agent-skill-chain writer lease
type: object
required: [schema_version, writer_lease]
additionalProperties: false
properties:
  schema_version:
    const: agent-skill-chain/lease/v1
  writer_lease:
    type: object
    required: [issue_id, holder, segment, acquired_at, expires_at, token]
    additionalProperties: false
    properties:
      issue_id:
        type: string
        pattern: '^ISSUE-[0-9]+$'
      holder:
        type: string
        description: "lease保持者の実行ID（例: run-456）"
      segment:
        type: string
        enum: [spec, design, implementation, validation, adr_finalization]
      acquired_at:
        type: string
        format: date-time
      expires_at:
        type: string
        format: date-time
      token:
        type: string
        description: compare-and-set用のランダムトークン

# 既定値（config/agent-skill-chain.yaml の lease.* が正本）: ttl_seconds=3600, renewal_interval_seconds=900
# 期限切れleaseは reconcile.sh が検出し、成果物のpush状態を確認したうえで回収するか人間判断へ昇格する。

examples:
  - schema_version: agent-skill-chain/lease/v1
    writer_lease:
      issue_id: ISSUE-123
      holder: run-456
      segment: implementation
      acquired_at: '2026-07-19T03:00:00+09:00'
      expires_at: '2026-07-19T04:00:00+09:00'
      token: random-token
